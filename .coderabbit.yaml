# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    auto_incremental_review: false
    base_branches:
      - "main"
      - "staging"
  path_filters:
    - "!bun.lock"
    - "!package-lock.json"
    - "!drizzle/**"
