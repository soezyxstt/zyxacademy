<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Zyx Academy</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="offline-shell.css" />
    <style>
      :root {
        --background: #ffffff;
        --foreground: #18181b;
        --card: #ffffff;
        --surface: #f4f5f7;
        --surface-hover: #eceef2;
        --muted-foreground: #64748b;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --primary: #2a3c6a;
        --primary-hover: #213056;
        --primary-fg: #ffffff;
        --zx-z-fill: #2a3c6a;
        --zx-x-fill: #cc542b;
        --nav-bg: rgba(255, 255, 255, 0.88);
        --status-warning-bg: rgba(217, 119, 6, 0.11);
        --status-warning-border: rgba(217, 119, 6, 0.24);
        --status-warning-fg: #b45309;
        --status-success-bg: rgba(22, 163, 74, 0.11);
        --status-success-border: rgba(22, 163, 74, 0.24);
        --status-success-fg: #15803d;
        --ring: rgba(42, 60, 106, 0.28);
        --radius: 10px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121316;
          --foreground: #f4f4f5;
          --card: #191b20;
          --surface: #20232a;
          --surface-hover: #272b34;
          --muted-foreground: #a1a1aa;
          --border: #2b2f38;
          --border-strong: #3b404d;
          --primary: #6382e8;
          --primary-hover: #7592ee;
          --primary-fg: #0b1120;
          --zx-z-fill: #f3f4f5;
          --zx-x-fill: #d96238;
          --nav-bg: rgba(18, 19, 22, 0.88);
          --status-warning-bg: rgba(245, 158, 11, 0.14);
          --status-warning-border: rgba(245, 158, 11, 0.28);
          --status-warning-fg: #fbbf24;
          --status-success-bg: rgba(34, 197, 94, 0.14);
          --status-success-border: rgba(34, 197, 94, 0.28);
          --status-success-fg: #4ade80;
          --ring: rgba(99, 130, 232, 0.36);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .navbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 52px;
        max-width: 860px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 26px;
        height: 16px;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }

      .nav-controls {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--status-warning-border);
        font-size: 12px;
        font-weight: 600;
        background: var(--status-warning-bg);
        color: var(--status-warning-fg);
      }

      .status-pill-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
      }

      .status-pill.online {
        background: var(--status-success-bg);
        border-color: var(--status-success-border);
        color: var(--status-success-fg);
      }

      .lang-switch {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .lang-btn {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted-foreground);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 8px;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .lang-btn[aria-pressed="true"] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .reconnect-banner {
        position: sticky;
        top: 52px;
        z-index: 19;
        background: var(--status-success-bg);
        border-bottom: 1px solid var(--status-success-border);
      }

      .reconnect-banner-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 860px;
        margin: 0 auto;
        padding: 8px 24px;
      }

      .reconnect-banner-text {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--status-success-fg);
      }

      .reconnect-banner-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .page {
        flex: 1;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }

      .offline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .offline-header-left {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        min-width: 0;
      }

      .offline-icon-box {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--status-warning-bg);
        border: 1px solid var(--status-warning-border);
        color: var(--status-warning-fg);
        flex-shrink: 0;
      }

      .offline-icon-box.online {
        background: var(--status-success-bg);
        border-color: var(--status-success-border);
        color: var(--status-success-fg);
      }

      .offline-header-copy {
        min-width: 0;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .lead {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted-foreground);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 36px;
        border-radius: 8px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
      }

      .btn-sm {
        height: 30px;
        padding: 0 11px;
        font-size: 12px;
      }

      .btn-primary {
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-fg);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      .btn-outline {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
      }

      .btn-outline:hover:not(:disabled) {
        background: var(--surface);
        border-color: var(--border-strong);
      }

      .btn-ghost {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-foreground);
        padding: 0 10px;
        height: 32px;
      }

      .btn-ghost:hover:not(:disabled) {
        background: var(--surface);
        color: var(--foreground);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .spin {
        animation: zyx-spin 0.8s linear infinite;
      }

      .status {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--status-warning-fg);
      }

      .status:empty {
        display: none;
      }

      .library-section {
        margin-top: 22px;
      }

      .section-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .section-heading-group {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .section-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .section-meta {
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .search-wrap {
        position: relative;
        width: 240px;
        max-width: 100%;
      }

      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-foreground);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        height: 32px;
        padding: 0 10px 0 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--foreground);
        font-size: 13px;
        font-family: inherit;
        transition: border-color 120ms ease, background-color 120ms ease;
      }

      .search-input::placeholder {
        color: var(--muted-foreground);
      }

      .search-input:focus {
        background: var(--card);
        border-color: var(--primary);
      }

      .reading-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--border);
      }

      .reading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        padding: 12px 10px;
        margin: 0 -10px;
        transition: background-color 120ms ease;
      }

      .reading-row:hover {
        background: var(--surface);
        border-radius: 8px;
      }

      .reading-open {
        appearance: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 0;
        cursor: pointer;
      }

      .reading-identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
      }

      .reading-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--primary);
        flex-shrink: 0;
      }

      .reading-row:hover .reading-icon {
        background: var(--card);
      }

      .reading-text {
        min-width: 0;
        flex: 1;
      }

      .reading-title {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 1px;
      }

      .reading-sub {
        display: block;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .reading-metrics {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .reading-chevron {
        color: var(--muted-foreground);
        opacity: 0.5;
        flex-shrink: 0;
        transition: transform 120ms ease, opacity 120ms ease;
      }

      .reading-row:hover .reading-chevron {
        opacity: 1;
        transform: translateX(2px);
      }

      .icon-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .icon-btn:hover {
        background: var(--surface-hover);
        color: var(--foreground);
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 44px 20px;
        border-top: 1px solid var(--border);
      }

      .empty-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        margin-bottom: 12px;
      }

      .empty-title {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
      }

      .empty-desc {
        margin: 0;
        max-width: 400px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted-foreground);
      }

      .reader-progress {
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 25;
        background: transparent;
        pointer-events: none;
      }

      .reader-progress-bar {
        height: 100%;
        width: 0%;
        background: var(--primary);
        transition: width 80ms linear;
      }

      .reader-container {
        max-width: 680px;
        margin: 0 auto;
      }

      .reader-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 14px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }

      .reader-meta {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted-foreground);
        margin: 0 0 6px;
      }

      .reader-title {
        margin: 0 0 24px;
        font-size: 24px;
        line-height: 1.28;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      @media (max-width: 600px) {
        .navbar-inner,
        .reconnect-banner-inner,
        .page {
          padding-left: 16px;
          padding-right: 16px;
        }
        .offline-header {
          flex-direction: column;
          align-items: stretch;
        }
        .actions {
          width: 100%;
        }
        .actions .btn {
          width: 100%;
        }
        .search-wrap {
          width: 100%;
        }
        .reading-metrics {
          display: none;
        }
      }

      .reader-section {
        padding-top: 18px;
        margin-top: 18px;
        border-top: 1px solid var(--border);
      }

      .reader-section:first-of-type {
        padding-top: 0;
        margin-top: 0;
        border-top: 0;
      }

      .reader-section h2 {
        margin: 0 0 10px;
        font-size: 17px;
        line-height: 1.4;
        font-weight: 700;
      }

      .reader-section h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        line-height: 1.4;
        font-weight: 600;
      }

      .reader-section p {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.68;
      }

      .reader-section ul,
      .reader-section ol {
        margin: 0 0 12px;
        padding-left: 22px;
      }

      .reader-section li {
        margin-bottom: 6px;
        font-size: 16px;
        line-height: 1.62;
      }

      .reader-section blockquote {
        margin: 0 0 12px;
        padding: 8px 14px;
        border-left: 3px solid var(--primary);
        background: var(--surface);
        border-radius: 0 8px 8px 0;
      }

      .reader-section code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--surface);
      }

      .reader-section pre {
        margin: 0 0 12px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        overflow-x: auto;
        font-size: 13px;
      }

      .reader-section pre code {
        padding: 0;
        background: transparent;
      }

      .offline-objective {
        border-left: 3px solid var(--primary);
        padding-left: 12px;
        margin-bottom: 14px;
      }

      .offline-objective p {
        color: var(--muted-foreground);
        font-size: 15px;
      }

      .offline-math-block {
        display: block;
        margin: 12px 0;
        padding: 8px 4px;
        overflow-x: auto;
        text-align: center;
      }

      .offline-visual {
        margin: 16px 0;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
      }

      .offline-visual figcaption {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .offline-visual-svg {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
        color: #1e293b;
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 4px;
      }

      .offline-visual-desc,
      .offline-visual-note {
        font-size: 13px !important;
        line-height: 1.5 !important;
        color: var(--muted-foreground) !important;
        margin: 8px 0 0 !important;
      }

      .offline-img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 10px 0;
      }

      .offline-table-wrap {
        width: 100%;
        overflow-x: auto;
        margin: 12px 0;
      }

      .offline-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .offline-table th,
      .offline-table td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
      }

      .offline-table th {
        background: var(--surface);
        font-weight: 600;
      }

      .offline-worked-example {
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--status-success-fg);
        background: var(--card);
      }

      .offline-step-reason {
        font-size: 13px;
        color: var(--muted-foreground);
        margin-top: 2px;
      }

      .hidden {
        display: none !important;
      }

      .startup-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--background);
      }

      .startup-splash-mark {
        width: 56px;
        height: 34px;
      }

      .startup-spinner {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        animation: zyx-spin 0.8s linear infinite;
      }

      @keyframes zyx-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .offline-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" class="startup-splash" role="status" aria-label="Zyx Academy">
      <svg
        class="startup-splash-mark"
        viewBox="0 0 370 216"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M262.25 66.0576L309.5 0H369.5L292.25 108L369.5 216H309.5L268.486 158.661C275.133 144.348 279 126.43 279 104C279 56 293.001 32 302.001 26C274.001 37 270.21 75.5 263.5 92.5C259.39 102.914 253.201 114.236 244.281 124.821L155 0H215L262.25 66.0576Z"
          fill="var(--zx-x-fill)"
        />
        <path
          d="M139 0L176.75 52.7764L95.0488 167H133C206.5 167 239.65 125.559 252.5 93C259.21 76 273.5 37 301.5 26C292.5 32 278.786 43 270.5 105C256.067 213 172.5 216 114.5 216H0L119.451 49H0V0H139Z"
          fill="var(--zx-z-fill)"
        />
      </svg>
      <span class="startup-spinner" aria-hidden="true"></span>
    </div>

    <div id="offline-shell" class="offline-shell hidden">
    <header class="navbar">
      <div class="navbar-inner">
        <div class="brand">
          <svg
            class="brand-mark"
            viewBox="0 0 370 216"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M262.25 66.0576L309.5 0H369.5L292.25 108L369.5 216H309.5L268.486 158.661C275.133 144.348 279 126.43 279 104C279 56 293.001 32 302.001 26C274.001 37 270.21 75.5 263.5 92.5C259.39 102.914 253.201 114.236 244.281 124.821L155 0H215L262.25 66.0576Z"
              fill="var(--zx-x-fill)"
            />
            <path
              d="M139 0L176.75 52.7764L95.0488 167H133C206.5 167 239.65 125.559 252.5 93C259.21 76 273.5 37 301.5 26C292.5 32 278.786 43 270.5 105C256.067 213 172.5 216 114.5 216H0L119.451 49H0V0H139Z"
              fill="var(--zx-z-fill)"
            />
          </svg>
          <span class="brand-name">Zyx Academy</span>
        </div>

          if (sections.length === 0) {
            var empty = document.createElement("p");
            empty.textContent = t.noContent;
            readerBodyEl.appendChild(empty);
          } else {
            for (var i = 0; i < sections.length; i++) {
              var sec = sections[i];
              var secEl = document.createElement("section");
              secEl.className = "reader-section";
              if (sec.slug) secEl.setAttribute("data-section-slug", String(sec.slug));
              if (sec.headingHtml) {
                var h2Html = document.createElement("h2");
                h2Html.appendChild(sanitizeHtmlFragment(sec.headingHtml));
                secEl.appendChild(h2Html);
              } else if (sec.heading) {
                var h2 = document.createElement("h2");
                h2.textContent = sec.heading;
                secEl.appendChild(h2);
              }
              if (sec.bodyHtml) {
                secEl.appendChild(sanitizeHtmlFragment(sec.bodyHtml));
              } else {
                renderMarkdownInto(secEl, sec.body || "");
              }
              readerBodyEl.appendChild(secEl);
            }
          }

          homeView.classList.add("hidden");
          readerView.classList.remove("hidden");
          if (readerProgress) readerProgress.classList.remove("hidden");
          restoreReadingPosition(reading);
          window.requestAnimationFrame(updateReaderProgress);
        }

        function closeReadingView() {
          window.dispatchEvent(new Event("zyx:offline-reader-closed"));
          persistActiveReadingPosition();
          activeReading = null;
          readerView.classList.add("hidden");
          if (readerProgress) readerProgress.classList.add("hidden");
          if (readerProgressBar) readerProgressBar.style.width = "0%";
          homeView.classList.remove("hidden");
        }

        function renderLibrary() {
          var t = COPY[currentLang];
          readingListEl.textContent = "";

          if (searchWrap) {
            searchWrap.classList.toggle("hidden", cachedItems.length === 0);
          }

          if (cachedItems.length === 0) {
            libraryMeta.textContent = "";
            if (libraryEmptyTitle) libraryEmptyTitle.textContent = t.emptyTitle;
            if (libraryEmptyDesc) libraryEmptyDesc.textContent = t.emptyLibrary;
            libraryEmptyEl.classList.remove("hidden");
            readingListEl.classList.add("hidden");
            return;
          }

          libraryMeta.textContent = t.savedCount(
            cachedItems.length,
            formatBytes(cachedTotalBytes)
          );

          var query = searchQuery.trim().toLowerCase();
          var visibleItems = query
            ? cachedItems.filter(function (item) {
                var hay = [item.title, item.courseTitle, item.chapterTitle]
                  .filter(Boolean)
                  .join(" ")
                  .toLowerCase();
                return hay.indexOf(query) !== -1;
              })
            : cachedItems;

          if (visibleItems.length === 0) {
            if (libraryEmptyTitle) libraryEmptyTitle.textContent = t.emptySearchTitle;
            if (libraryEmptyDesc) libraryEmptyDesc.textContent = t.emptySearchDesc;
            libraryEmptyEl.classList.remove("hidden");
            readingListEl.classList.add("hidden");
            return;
          }

          libraryEmptyEl.classList.add("hidden");
          readingListEl.classList.remove("hidden");

          for (var i = 0; i < visibleItems.length; i++) {
            (function (item) {
              var li = document.createElement("li");
              li.className = "reading-row";

              var openBtn = document.createElement("button");
              openBtn.type = "button";
              openBtn.className = "reading-open";

              var identity = document.createElement("span");
              identity.className = "reading-identity";

              var iconWrap = document.createElement("span");
              iconWrap.className = "reading-icon";
              iconWrap.setAttribute("aria-hidden", "true");
              iconWrap.innerHTML =
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

              var textWrap = document.createElement("span");
              textWrap.className = "reading-text";

              var titleSpan = document.createElement("span");
              titleSpan.className = "reading-title";
              titleSpan.textContent = item.title || "Materi";

              var subParts = [];
              if (item.courseTitle) subParts.push(item.courseTitle);
              if (item.chapterTitle) subParts.push(item.chapterTitle);

              textWrap.appendChild(titleSpan);
              if (subParts.length > 0) {
                var subSpan = document.createElement("span");
                subSpan.className = "reading-sub";
                subSpan.textContent = subParts.join(" · ");
                textWrap.appendChild(subSpan);
              }

              identity.appendChild(iconWrap);
              identity.appendChild(textWrap);
              openBtn.appendChild(identity);

              var metricParts = [];
              if (item.estimatedMinutes > 0) {
                metricParts.push(item.estimatedMinutes + " " + t.minUnit);
              }
              if (item.sizeBytes > 0) metricParts.push(formatBytes(item.sizeBytes));
              if (metricParts.length > 0) {
                var metrics = document.createElement("span");
                metrics.className = "reading-metrics";
                metrics.textContent = metricParts.join(" · ");
                openBtn.appendChild(metrics);
              }

              var chevron = document.createElement("span");
              chevron.className = "reading-chevron";
              chevron.setAttribute("aria-hidden", "true");
              chevron.innerHTML =
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
              openBtn.appendChild(chevron);

              openBtn.addEventListener("click", function () {
                var invoke = getTauriInvoke();
                if (!invoke) return;
                invoke("get_offline_reading", { key: item.key })
                  .then(function (res) {
                    if (res && res.reading) {
                      openReadingView(res.reading);
                    }
                  })
                  .catch(function () {});
              });

              var delBtn = document.createElement("button");
              delBtn.type = "button";
              delBtn.className = "icon-btn";
              delBtn.setAttribute("aria-label", t.deleteLabel);
              delBtn.innerHTML =
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>';
              delBtn.addEventListener("click", function () {
                var invoke = getTauriInvoke();
                if (!invoke) return;
                try {
                  window.localStorage.removeItem(POSITION_PREFIX + item.key);
                } catch {}
                invoke("remove_offline_reading", { key: item.key })
                  .then(loadLibrary)
                  .catch(function () {});
              });

              li.appendChild(openBtn);
              li.appendChild(delBtn);
              readingListEl.appendChild(li);
            })(visibleItems[i]);
          }
        }

        async function loadLibrary() {
          var invoke = getTauriInvoke();
          if (!invoke) {
            cachedItems = [];
            cachedTotalBytes = 0;
            renderLibrary();
            return;
          }
          try {
            var res = await invoke("list_offline_readings");
            cachedItems = Array.isArray(res && res.items) ? res.items : [];
            cachedTotalBytes = Number(res && res.totalBytes) || 0;
          } catch {
            cachedItems = [];
            cachedTotalBytes = 0;
          }
          renderLibrary();
        }

        function updateConnectionUI(showBannerIfOnline) {
          var t = COPY[currentLang];
          var isOnline = connectionState === "online";
          var isConnecting = connectionState === "connecting";
          var isOffline = connectionState === "offline";
          connPill.classList.toggle("online", isOnline);
          connPill.classList.toggle("offline", isOffline);
          connPill.classList.toggle("unreachable", connectionState === "unreachable");
          if (offlineIconBox) offlineIconBox.classList.toggle("online", isOnline);
          connLabel.textContent = isConnecting
            ? t.connectingPill
            : isOnline ? t.onlinePill : isOffline ? t.offlinePill : t.unavailablePill;
          retryButton.disabled = isConnecting;
          readerReconnectBtn.disabled = isConnecting;
          bannerOnlineBtn.disabled = isConnecting;
          if (retryIcon) retryIcon.classList.toggle("spin", isConnecting);
          if (retryLabel) retryLabel.textContent = isConnecting ? t.retrying : t.retry;
          statusEl.textContent = "";
          if (isOffline) {
            titleEl.textContent = t.offlineTitle;
            messageEl.textContent = t.offlineMsg;
          } else if (connectionState === "unreachable") {
            titleEl.textContent = t.unavailableTitle;
            messageEl.textContent = t.unavailableMsg;
          } else {
            titleEl.textContent = enteredOfflineMode ? t.libraryTitle : t.connectingTitle;
            messageEl.textContent = "";
          }
          messageEl.classList.toggle("hidden", !messageEl.textContent);
          librarySection.classList.toggle("hidden", isConnecting && !enteredOfflineMode);
          if (!isOnline) {
            reconnectBanner.classList.add("hidden");
          } else if (showBannerIfOnline && enteredOfflineMode && !bannerDismissed) {
            reconnectBanner.classList.remove("hidden");
          }
        }

        function renderLang(lang) {
          currentLang = lang;
          document.documentElement.lang = lang;
          var t = COPY[lang];
          if (retryLabel) retryLabel.textContent = t.retry;
          if (refreshLibraryBtn) refreshLibraryBtn.textContent = t.offlineBtn;
          libraryHeading.textContent = t.libraryHeading;
          if (librarySearch) {
            librarySearch.placeholder = t.searchPlaceholder;
            librarySearch.setAttribute("aria-label", t.searchPlaceholder);
          }
          readerBackLabel.textContent = t.back;
          readerReconnectBtn.textContent = t.reconnect;
          reconnectBannerText.textContent = t.bannerText;
          bannerOnlineBtn.textContent = t.reconnect;
          bannerDismissBtn.setAttribute("aria-label", t.bannerDismiss);
          langIdBtn.setAttribute("aria-pressed", String(lang === "id"));
          langEnBtn.setAttribute("aria-pressed", String(lang === "en"));
          updateConnectionUI(false);
          renderLibrary();
        }

        langIdBtn.addEventListener("click", function () {
          renderLang("id");
        });
        langEnBtn.addEventListener("click", function () {
          renderLang("en");
        });
        retryButton.addEventListener("click", function () {
          void handleReturnOnline();
        });
        readerReconnectBtn.addEventListener("click", function () {
          void handleReturnOnline();
        });
        bannerOnlineBtn.addEventListener("click", function () {
          void handleReturnOnline();
        });
        bannerDismissBtn.addEventListener("click", function () {
          bannerDismissed = true;
          reconnectBanner.classList.add("hidden");
        });
        if (refreshLibraryBtn) {
          refreshLibraryBtn.addEventListener("click", function () {
            showOfflineShell(false);
            librarySection.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
        if (librarySearch) {
          librarySearch.addEventListener("input", function () {
            searchQuery = librarySearch.value || "";
            renderLibrary();
          });
        }
        window.addEventListener("zyx:offline-open-reading", function (event) {
          var key = event.detail && event.detail.key;
          var invoke = getTauriInvoke();
          if (!key || !invoke) return;
          persistActiveReadingPosition();
          void invoke("get_offline_reading", { key: key }).then(function (result) {
            if (result && result.reading) openReadingView(result.reading);
          });
        });
        window.addEventListener("zyx:offline-lock-reader", function () {
          closeReadingView();
          readerTitleEl.textContent = "";
          readerMetaEl.textContent = "";
          readerBodyEl.replaceChildren();
        });

        readerBackBtn.addEventListener("click", closeReadingView);

        window.addEventListener(
          "scroll",
          function () {
            schedulePositionSave();
            updateReaderProgress();
          },
          { passive: true }
        );
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") {
            persistActiveReadingPosition();
          }
        });
        window.addEventListener("pagehide", persistActiveReadingPosition);

        function showOfflineShell(showBannerIfOnline) {
          enteredOfflineMode = true;
          if (startupSplash) startupSplash.classList.add("hidden");
          if (offlineShell) offlineShell.classList.remove("hidden");
          updateConnectionUI(Boolean(showBannerIfOnline));
          void loadLibrary();
        }

        // Never auto-redirect mid-read when connectivity returns.
        window.addEventListener("online", function () {
          var generation = connectionGeneration;
          bannerDismissed = false;
          connectionState = "connecting";
          updateConnectionUI(false);
          void probeServerReachable().then(function (reachable) {
            if (generation !== connectionGeneration) return;
            connectionState = reachable ? "online" : navigator.onLine === false ? "offline" : "unreachable";
            updateConnectionUI(true);
          });
        });
        window.addEventListener("offline", function () {
          invalidateConnectionProbe();
          connectionState = "offline";
          bannerDismissed = false;
          showOfflineShell(false);
        });

        renderLang(currentLang);

        // A saved account opens the local library before probing the server.
        // Empty installs keep the upstream splash and fast static reachability check.
        void (async function initialConnect() {
          if (window.zyxOfflineShell) {
            await window.zyxOfflineShell.ready;
            if (window.zyxOfflineShell.hasIdentity) showOfflineShell(false);
          }
          var generation = connectionGeneration;
          if (navigator.onLine === false) {
            connectionState = "offline";
            showOfflineShell(false);
            return;
          }
          var reachable = await probeServerReachable();
          if (generation !== connectionGeneration) return;
          connectionState = reachable ? "online" : navigator.onLine === false ? "offline" : "unreachable";
          if (reachable && !activeReading && !enteredOfflineMode) {
            updateConnectionUI(false);
            window.location.replace(targetOrigin + "/");
          } else {
            showOfflineShell(reachable);
          }
        })();
      })();
    </script>
  </body>
</html>
