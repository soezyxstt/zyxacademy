apply plugin: 'com.android.application'

def zyxVersionCodeRaw = (project.findProperty('zyxVersionCode') ?: System.getenv('ZYX_ANDROID_VERSION_CODE') ?: '1').toString().trim()
def zyxVersionCode = zyxVersionCodeRaw.isInteger() ? Math.max(1, zyxVersionCodeRaw.toInteger()) : 1
def zyxVersionName = (project.findProperty('zyxVersionName') ?: System.getenv('ZYX_APP_VERSION') ?: '0.1.0-alpha.2').toString().trim()
def zyxKeystorePath = System.getenv('ZYX_ANDROID_KEYSTORE_PATH')
def zyxKeystorePassword = System.getenv('ZYX_ANDROID_KEYSTORE_PASSWORD')
def zyxKeyAlias = System.getenv('ZYX_ANDROID_KEY_ALIAS')
def zyxKeyPassword = System.getenv('ZYX_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = Boolean.valueOf(
    zyxKeystorePath &&
    zyxKeystorePassword &&
    zyxKeyAlias &&
    zyxKeyPassword &&
    file(zyxKeystorePath).exists()
)

android {
    namespace "com.zyx.academy"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zyx.academy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode zyxVersionCode
        versionName zyxVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(zyxKeystorePath)
                storePassword zyxKeystorePassword
                keyAlias zyxKeyAlias
                keyPassword zyxKeyPassword
            }
        }
    }
    flavorDimensions "channel"
    productFlavors {
        stable {
            dimension "channel"
            applicationId "com.zyx.academy"
        }
        nightly {
            dimension "channel"
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    // 1.2.1 requires API 24; retain the app's existing API 23 support.
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists() || file('src/nightly/google-services.json').exists() || file('src/stable/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
