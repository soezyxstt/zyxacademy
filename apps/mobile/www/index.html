<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Zyx Academy</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="offline-shell.css" />
    <style>
      :root {
        --background: #ffffff;
        --foreground: #18181b;
        --card: #ffffff;
        --surface: #f4f5f7;
        --surface-hover: #eceef2;
        --muted-foreground: #64748b;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --primary: #2a3c6a;
        --primary-hover: #213056;
        --primary-fg: #ffffff;
        --zx-accent: #cc542b;
        --zx-z-fill: #2a3c6a;
        --zx-x-fill: #cc542b;
        --nav-bg: rgba(255, 255, 255, 0.88);
        --status-warning-bg: rgba(217, 119, 6, 0.11);
        --status-warning-fg: #b45309;
        --status-success-fg: #15803d;
        --radius: 10px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121316;
          --foreground: #f4f4f5;
          --card: #191b20;
          --surface: #20232a;
          --surface-hover: #272b34;
          --muted-foreground: #a1a1aa;
          --border: #2b2f38;
          --border-strong: #3b404d;
          --primary: #6382e8;
          --primary-hover: #7592ee;
          --primary-fg: #0b1120;
          --zx-accent: #e07850;
          --zx-z-fill: #f3f4f5;
          --zx-x-fill: #d96238;
          --nav-bg: rgba(18, 19, 22, 0.88);
          --status-warning-bg: rgba(245, 158, 11, 0.14);
          --status-warning-fg: #fbbf24;
          --status-success-fg: #4ade80;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* Zyx slim sticky navbar matching MobileNavbar */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .navbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 52px;
        max-width: 760px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 26px;
        height: 16px;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--foreground);
        white-space: nowrap;
      }

      .nav-right {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .connection-note {
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .connection-note:empty {
        position: absolute;
      }

      .lang-switch {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .lang-btn {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted-foreground);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 8px;
        cursor: pointer;
      }

      .lang-btn[aria-pressed="true"] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .btn-sm {
        height: 30px;
        padding: 0 11px;
        font-size: 12px;
      }

      .page {
        flex: 1;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .offline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }

      .offline-header-left {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .offline-header-copy {
        min-width: 0;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 19px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .lead {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted-foreground);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        flex-shrink: 0;
      }

      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 38px;
        padding: 0 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 120ms ease, opacity 120ms ease;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .btn-primary {
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-fg);
      }

      .btn-primary:active:not(:disabled) {
        background: var(--primary-hover);
      }

      .btn-outline {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
      }

      .btn-outline:active:not(:disabled) {
        background: var(--surface);
      }

      .btn-ghost {
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        padding: 0 8px;
        height: 34px;
      }

      .spin {
        animation: zyx-spin 0.8s linear infinite;
      }

      @keyframes zyx-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .feedback {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--status-warning-fg);
      }

      .feedback:empty {
        display: none;
      }

      /* Saved offline library section */
      .library-section {
        margin-top: 20px;
      }

      .section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .section-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .section-meta {
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
      }

      .reading-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--border);
      }

      .reading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--border);
        padding: 11px 0;
      }

      .reading-open {
        appearance: none;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 0;
        cursor: pointer;
      }

      .reading-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--primary);
        flex-shrink: 0;
      }

      .reading-text {
        min-width: 0;
        flex: 1;
      }

      .reading-title {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 1px;
      }

      .reading-sub {
        display: block;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .icon-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
        flex-shrink: 0;
      }

      .icon-btn:active {
        background: var(--surface);
        color: var(--foreground);
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 16px;
        border-top: 1px solid var(--border);
      }

      .empty-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        margin-bottom: 10px;
      }

      .empty-title {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
      }

      .empty-desc {
        margin: 0;
        max-width: 340px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted-foreground);
      }

      /* Reader view */
      .reader-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .reader-meta {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px;
      }

      .reader-title {
        margin: 0 0 20px;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .reader-section {
        padding-top: 18px;
        margin-top: 18px;
        border-top: 1px solid var(--border);
      }

      .reader-section:first-of-type {
        padding-top: 0;
        margin-top: 0;
        border-top: 0;
      }

      .reader-section h2 {
        margin: 0 0 10px;
        font-size: 17px;
        line-height: 1.4;
        font-weight: 700;
      }

      .reader-section h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        line-height: 1.4;
        font-weight: 600;
      }

      .reader-section h4 {
        margin: 12px 0 6px;
        font-size: 14px;
        line-height: 1.4;
        font-weight: 600;
      }

      .reader-section p {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.68;
        color: var(--foreground);
      }

      .reader-section ul,
      .reader-section ol {
        margin: 0 0 12px;
        padding-left: 22px;
      }

      .reader-section li {
        margin-bottom: 6px;
        font-size: 16px;
        line-height: 1.62;
      }

      .reader-section blockquote {
        margin: 0 0 12px;
        padding: 8px 14px;
        border-left: 3px solid var(--primary);
        background: var(--surface);
        border-radius: 0 8px 8px 0;
        font-size: 15px;
      }

      .reader-section code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--surface);
      }

      .reader-section pre {
        margin: 0 0 12px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.5;
      }

      .reader-section pre code {
        padding: 0;
        background: transparent;
      }

      .reader-section a {
        color: var(--primary);
        text-decoration: underline;
      }

      .reader-section hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 18px 0;
      }

      /* Rich math, visual, table, and worked example styles */
      .offline-objective {
        border-left: 3px solid var(--primary);
        padding-left: 12px;
        margin-bottom: 14px;
        color: var(--muted-foreground);
      }

      .offline-objective p {
        color: var(--muted-foreground);
        font-size: 15px;
      }

      .offline-math-block {
        display: block;
        margin: 12px 0;
        padding: 8px 4px;
        overflow-x: auto;
        text-align: center;
      }

      .katex-display {
        margin: 0.5em 0;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .offline-visual {
        margin: 16px 0;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
      }

      .offline-visual figcaption {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--foreground);
      }

      .offline-visual-svg {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
        color: #1e293b;
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 4px;
      }

      .offline-visual-desc,
      .offline-visual-note {
        font-size: 13px !important;
        line-height: 1.5 !important;
        color: var(--muted-foreground) !important;
        margin: 8px 0 0 !important;
      }

      .offline-visual-legend {
        margin-top: 8px;
      }

      .offline-img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 10px 0;
      }

      .offline-table-wrap {
        width: 100%;
        overflow-x: auto;
        margin: 12px 0;
      }

      .offline-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .offline-table th,
      .offline-table td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
      }

      .offline-table th {
        background: var(--surface);
        font-weight: 600;
      }

      .offline-worked-example {
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--status-success-fg);
        background: var(--card);
      }

      .offline-step-reason {
        font-size: 13px;
        color: var(--muted-foreground);
        margin-top: 2px;
      }

      .offline-worked-verify {
        margin-top: 10px !important;
        font-size: 14px !important;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 520px) {
        .offline-header {
          flex-direction: column;
          align-items: stretch;
        }
        .actions {
          width: 100%;
        }
        .actions .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <div class="brand">
          <svg
            class="brand-mark"
            viewBox="0 0 370 216"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M262.25 66.0576L309.5 0H369.5L292.25 108L369.5 216H309.5L268.486 158.661C275.133 144.348 279 126.43 279 104C279 56 293.001 32 302.001 26C274.001 37 270.21 75.5 263.5 92.5C259.39 102.914 253.201 114.236 244.281 124.821L155 0H215L262.25 66.0576Z"
              fill="var(--zx-x-fill)"
            />
            <path
              d="M139 0L176.75 52.7764L95.0488 167H133C206.5 167 239.65 125.559 252.5 93C259.21 76 273.5 37 301.5 26C292.5 32 278.786 43 270.5 105C256.067 213 172.5 216 114.5 216H0L119.451 49H0V0H139Z"
              fill="var(--zx-z-fill)"
            />
          </svg>
          <span class="brand-name">Zyx Academy</span>
        </div>
        <div class="nav-right">
          <span class="connection-note" id="offline-indicator" role="status"></span>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" id="lang-id" aria-pressed="true">
              ID
            </button>
            <button type="button" class="lang-btn" id="lang-en" aria-pressed="false">
              EN
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="page">
      <div id="home-view">
        <section class="offline-header">
          <div class="offline-header-left">
            <div class="offline-header-copy">
              <h1 id="title">Materi di perangkat</h1>
              <p class="lead" id="description">
                Periksa koneksi internet Anda lalu coba lagi, atau buka materi tersimpan di bawah.
              </p>
              <p class="feedback" id="status" role="status" aria-live="polite"></p>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="retry-btn">
              <svg id="retry-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
              </svg>
              <span id="retry-label">Coba lagi</span>
            </button>
          </div>
        </section>

        <section class="library-section" id="library-section" aria-labelledby="library-heading">
          <div class="section-header">
            <h2 class="section-title" id="library-heading">Bacaan tersimpan</h2>
            <span class="section-meta" id="library-meta"></span>
          </div>
          <ul class="reading-list" id="reading-list"></ul>
          <div class="empty-state hidden" id="library-empty">
            <div class="empty-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
              </svg>
            </div>
            <p class="empty-title" id="library-empty-title">Belum ada bacaan tersimpan</p>
            <p class="empty-desc" id="library-empty-desc"></p>
          </div>
        </section>
      </div>

      <article id="reader-view" class="hidden" aria-live="polite">
        <div class="reader-bar">
          <button type="button" class="btn btn-ghost" id="reader-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
            <span id="reader-back-label">Kembali</span>
          </button>
          <button type="button" class="btn btn-outline btn-sm" id="reader-reconnect-btn">
            Buka aplikasi
          </button>
        </div>
        <p class="reader-meta" id="reader-meta"></p>
        <h1 class="reader-title" id="reader-title"></h1>
        <div id="reader-body"></div>
      </article>
    </main>

    <script src="offline-origin.js"></script>
    <script src="offline-shell.js"></script>
    <script>
      (function () {
        var POSITION_PREFIX = "zyx:offline-reading-pos:";

            back: "Back",

              return count + (count === 1 ? " reading, " : " readings, ") + sizeText;

          },
        };

        var currentLang = (navigator.language || "id").toLowerCase().startsWith("en")
          ? "en"

        var offlineIndicator = document.getElementById("offline-indicator");
        var titleEl = document.getElementById("title");
        var descEl = document.getElementById("description");

        var retryIcon = document.getElementById("retry-icon");

        var statusEl = document.getElementById("status");
        var langIdBtn = document.getElementById("lang-id");
        var langEnBtn = document.getElementById("lang-en");
        var librarySection = document.getElementById("library-section");
        var libraryHeading = document.getElementById("library-heading");
        var libraryMeta = document.getElementById("library-meta");
        var readingListEl = document.getElementById("reading-list");
        var libraryEmptyEl = document.getElementById("library-empty");
        var homeView = document.getElementById("home-view");
        var readerView = document.getElementById("reader-view");
        var readerBackBtn = document.getElementById("reader-back-btn");
        var readerBackLabel = document.getElementById("reader-back-label");
        var readerReconnectBtn = document.getElementById("reader-reconnect-btn");
        var readerMetaEl = document.getElementById("reader-meta");
        var readerTitleEl = document.getElementById("reader-title");
        var readerBodyEl = document.getElementById("reader-body");

        var cachedItems = [];
        var cachedTotalBytes = 0;
        var activeReading = null;
        var scrollSaveTimer = null;

        function getTargetOrigin() {
          var host = (window.location.hostname || "").toLowerCase();
          if (
            (window.location.protocol === "https:" || window.location.protocol === "http:") &&
            host &&
            host !== "localhost" &&
            host !== "127.0.0.1" &&
            (host === "zyxacademy.com" ||
              host.endsWith(".zyxacademy.com") ||
              host === "zyx.academy" ||
              host.endsWith(".zyx.academy"))
          ) {
            return window.location.origin;
          }
          return DEFAULT_ORIGIN;
        }

        function formatBytes(bytes) {
          var n = Number(bytes) || 0;
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + " KB";
          return (n / (1024 * 1024)).toFixed(1) + " MB";
        }

        function getOfflineStorePlugin() {
          return (
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.ZyxOfflineStore
          ) || null;
        }

        function isSafeAttributeUrl(rawValue, isImgSrc) {
          var cleaned = String(rawValue || "").replace(/[\u0000-\u001f\u007f]+/g, "").trim();
          if (!cleaned) return false;
          if (/^https?:\/\//i.test(cleaned)) return true;
          if (cleaned.charAt(0) === "#" || (cleaned.charAt(0) === "/" && cleaned.charAt(1) !== "/")) {
            return true;
          }
          if (isImgSrc && /^data:image\/(?:png|jpeg|jpg|webp|gif|svg\+xml);base64,[a-z0-9+/=\s]+$/i.test(cleaned)) {
            return true;
          }
          return false;
        }

        function sanitizeHtmlFragment(html) {
          var template = document.createElement("template");
          template.innerHTML = String(html || "");
          var blockedTags = [
            "SCRIPT",
            "IFRAME",
            "OBJECT",
            "EMBED",
            "STYLE",
            "LINK",
            "META",
            "BASE",
            "FORM",
            "USE",
            "ANIMATE",
            "SET",
            "NOSCRIPT",
          ];
          for (var t = 0; t < blockedTags.length; t++) {
            var bad = template.content.querySelectorAll(blockedTags[t].toLowerCase());
            for (var j = bad.length - 1; j >= 0; j--) {
              bad[j].remove();
            }
          }
          var all = template.content.querySelectorAll("*");
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            var attrs = Array.prototype.slice.call(el.attributes);
            for (var a = 0; a < attrs.length; a++) {
              var name = attrs[a].name.toLowerCase();
              var value = attrs[a].value || "";
              if (name.indexOf("on") === 0 || name === "formaction" || name === "srcdoc") {
                el.removeAttribute(attrs[a].name);
                continue;
              }
              if (name === "href" || name === "src" || name === "xlink:href") {
                var isImgSrc = el.tagName === "IMG" && name === "src";
                if (!isSafeAttributeUrl(value, isImgSrc)) {
                  el.removeAttribute(attrs[a].name);
                }
              }
            }
          }
          return template.content;
        }

        function readLocalPosition(key) {
          if (!key) return null;
          try {
            var raw = window.localStorage.getItem(POSITION_PREFIX + key);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        }

        function pickLatestPosition(a, b) {
          if (!a && !b) return null;
          if (!a) return b;
          if (!b) return a;
          return (Number(b.updatedAt) || 0) > (Number(a.updatedAt) || 0) ? b : a;
        }

        function captureCurrentReadingPosition() {
          if (!activeReading || !activeReading.key || readerView.classList.contains("hidden")) {
            return null;
          }
          var scrollY = Math.max(0, Math.round(window.scrollY || document.documentElement.scrollTop || 0));
          var docHeight = Math.max(
            document.documentElement.scrollHeight || 0,
            document.body.scrollHeight || 0
          );
          var maxScroll = Math.max(0, docHeight - window.innerHeight);
          var scrollRatio = maxScroll > 0 ? Math.max(0, Math.min(1, scrollY / maxScroll)) : 0;

          var sectionSlug = null;
          var sectionIndex = 0;
          var sectionEls = readerBodyEl.querySelectorAll(".reader-section");
          for (var i = 0; i < sectionEls.length; i++) {
            var rect = sectionEls[i].getBoundingClientRect();
            if (rect.top <= 120) {
              sectionIndex = i;
              sectionSlug = sectionEls[i].getAttribute("data-section-slug") || null;
            } else {
              break;
            }
          }

          return {
            key: activeReading.key,
            sectionSlug: sectionSlug,
            sectionIndex: sectionIndex,
            scrollY: scrollY,
            scrollRatio: scrollRatio,
            scope: "document",
            updatedAt: Date.now(),
          };
        }

        function findSectionElementBySlug(slug) {
          if (!slug) return null;
          var sections = readerBodyEl.querySelectorAll("[data-section-slug]");
          for (var i = 0; i < sections.length; i++) {
            if (sections[i].getAttribute("data-section-slug") === slug) {
              return sections[i];
            }
          }
          return null;
        }

        function persistActiveReadingPosition() {
          var pos = captureCurrentReadingPosition();
          if (!pos) return;
          var serialized = JSON.stringify(pos);
          try {
            window.localStorage.setItem(POSITION_PREFIX + pos.key, serialized);
          } catch {
            // Non-fatal
          }
          var store = getOfflineStorePlugin();
          if (store && store.saveReadingPosition) {
            store
              .saveReadingPosition({ key: pos.key, positionJson: serialized })
              .catch(function () {});
          }
        }

        function schedulePositionSave() {
          if (!activeReading || readerView.classList.contains("hidden")) return;
          if (scrollSaveTimer !== null) window.clearTimeout(scrollSaveTimer);
          scrollSaveTimer = window.setTimeout(function () {
            scrollSaveTimer = null;
            persistActiveReadingPosition();
          }, 250);
        }

        function restoreReadingPosition(reading) {
          var pos = pickLatestPosition(
            reading && reading.readingPosition ? reading.readingPosition : null,
            readLocalPosition(reading && reading.key)
          );
          if (!pos) {
            window.scrollTo(0, 0);
            return;
          }
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              if (pos.sectionSlug && pos.scope !== "document") {
                var scopedSec = findSectionElementBySlug(pos.sectionSlug);
                if (scopedSec) {
                  scopedSec.scrollIntoView({ behavior: "auto", block: "start" });
                  return;
                }
              }
              var docHeight = Math.max(
                document.documentElement.scrollHeight || 0,
                document.body.scrollHeight || 0
              );
              var maxScroll = Math.max(0, docHeight - window.innerHeight);
              var targetY = 0;
              if (Number(pos.scrollRatio) > 0 && maxScroll > 0) {
                targetY = Math.round(Math.max(0, Math.min(1, Number(pos.scrollRatio))) * maxScroll);
              } else if (Number(pos.scrollY) > 0) {
                targetY = Math.min(maxScroll, Math.round(Number(pos.scrollY)));
              }
              if (targetY > 0) {
                window.scrollTo(0, targetY);
                return;
              }
              if (pos.sectionSlug) {
                var targetSec = findSectionElementBySlug(pos.sectionSlug);
                if (targetSec) {
                  targetSec.scrollIntoView({ behavior: "auto", block: "start" });
                  return;
                }
              }
              window.scrollTo(0, 0);
            });
          });
        }

        async function probeServerReachable() {
          if (navigator.onLine === false) return false;
          var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
          var timer = controller
            ? window.setTimeout(function () {
                controller.abort();
              }, 4500)
            : null;
          try {
            await fetch(getTargetOrigin() + "/brand/zyx-favicon-32.png", {
              method: "HEAD",
              mode: "no-cors",
              cache: "no-store",
              signal: controller ? controller.signal : undefined,
            });
            return true;
          } catch {
            return false;
          } finally {
            if (timer !== null) window.clearTimeout(timer);
          }
        }

        async function handleReturnOnline() {
          persistActiveReadingPosition();
          var t = COPY[currentLang];
          retryBtn.disabled = true;
          readerReconnectBtn.disabled = true;
          if (retryIcon) retryIcon.classList.add("spin");
          if (retryLabel) retryLabel.textContent = t.retrying;
          statusEl.textContent = "";
          var reachable = await probeServerReachable();
          if (!reachable) {
            statusEl.textContent = t.stillOffline;
            retryBtn.disabled = false;
            readerReconnectBtn.disabled = false;
            if (retryIcon) retryIcon.classList.remove("spin");
            if (retryLabel) retryLabel.textContent = t.retry;
            updateConnectionUI();
            return;
          }
          window.location.replace(getTargetOrigin() + "/");
        }

        function renderMarkdownInto(container, markdown) {
          var lines = String(markdown || "").split(/\r?\n/);
          var listEl = null;
          var codeLines = null;
          var paragraphLines = [];

          function flushParagraph() {
            if (paragraphLines.length === 0) return;
            var p = document.createElement("p");
            p.textContent = paragraphLines.join("\n").trim();
            if (p.textContent) container.appendChild(p);
            paragraphLines = [];
          }

          function flushList() {
            if (!listEl) return;
            container.appendChild(listEl);
            listEl = null;
          }

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.trim().startsWith("```")) {
              flushParagraph();
              flushList();
              if (codeLines === null) {
                codeLines = [];
              } else {
                var pre = document.createElement("pre");
                pre.textContent = codeLines.join("\n");
                container.appendChild(pre);
                codeLines = null;
              }
              continue;
            }
            if (codeLines !== null) {
              codeLines.push(line);
              continue;
            }
            var trimmed = line.trim();
            if (!trimmed) {
              flushParagraph();
              flushList();
              continue;
            }
            if (/^###\s+/.test(trimmed)) {
              flushParagraph();
              flushList();
              var h3 = document.createElement("h3");
              h3.textContent = trimmed.replace(/^###\s+/, "");
              container.appendChild(h3);
              continue;
            }
            if (/^##?\s+/.test(trimmed)) {
              flushParagraph();
              flushList();
              var h2 = document.createElement("h2");
              h2.textContent = trimmed.replace(/^##?\s+/, "");
              container.appendChild(h2);
              continue;
            }
            if (/^[-*+]\s+/.test(trimmed)) {
              flushParagraph();
              if (!listEl) listEl = document.createElement("ul");
              var li = document.createElement("li");
              li.textContent = trimmed.replace(/^[-*+]\s+/, "");
              listEl.appendChild(li);
              continue;
            }
            flushList();
            paragraphLines.push(line);
          }

          if (codeLines !== null) {
            var leftoverPre = document.createElement("pre");
            leftoverPre.textContent = codeLines.join("\n");
            container.appendChild(leftoverPre);
          }
          flushParagraph();
          flushList();
        }

        function openReadingView(reading) {
          activeReading = reading;
          var t = COPY[currentLang];
          var metaParts = [];
          if (reading.courseTitle) metaParts.push(reading.courseTitle);
          if (reading.chapterTitle) metaParts.push(reading.chapterTitle);
          if (reading.estimatedMinutes > 0) {
            metaParts.push(reading.estimatedMinutes + " " + t.minUnit);
          }
          readerMetaEl.textContent = metaParts.join(", ");
          readerMetaEl.classList.toggle("hidden", metaParts.length === 0);
          readerTitleEl.textContent = reading.title || "";
          readerBodyEl.textContent = "";

          var sections = Array.isArray(reading.sections) ? reading.sections : [];
          if (sections.length === 0) {
            var empty = document.createElement("p");
            empty.textContent = t.noContent;
            readerBodyEl.appendChild(empty);
          } else {
            for (var i = 0; i < sections.length; i++) {
              var sec = sections[i];
              var secEl = document.createElement("section");
              secEl.className = "reader-section";
              if (sec.slug) secEl.setAttribute("data-section-slug", String(sec.slug));
              if (sec.headingHtml) {
                var h2Html = document.createElement("h2");
                h2Html.appendChild(sanitizeHtmlFragment(sec.headingHtml));
                secEl.appendChild(h2Html);
              } else if (sec.heading) {
                var h2 = document.createElement("h2");
                h2.textContent = sec.heading;
                secEl.appendChild(h2);
              }
              if (sec.bodyHtml) {
                secEl.appendChild(sanitizeHtmlFragment(sec.bodyHtml));
              } else {
                renderMarkdownInto(secEl, sec.body || "");
              }
              readerBodyEl.appendChild(secEl);
            }
          }

          homeView.classList.add("hidden");
          readerView.classList.remove("hidden");
          restoreReadingPosition(reading);
        }

        function closeReadingView() {
          window.dispatchEvent(new Event("zyx:offline-reader-closed"));
          persistActiveReadingPosition();
          activeReading = null;
          readerView.classList.add("hidden");
          homeView.classList.remove("hidden");
        }

        function renderLibrary() {
          var t = COPY[currentLang];
          readingListEl.textContent = "";

          if (cachedItems.length === 0) {
            libraryMeta.textContent = "";
            var emptyTitleEl = document.getElementById("library-empty-title");
            var emptyDescEl = document.getElementById("library-empty-desc");
            if (emptyTitleEl) emptyTitleEl.textContent = t.emptyTitle;
            if (emptyDescEl) emptyDescEl.textContent = t.emptyLibrary;
            libraryEmptyEl.classList.remove("hidden");
            readingListEl.classList.add("hidden");
            return;
          }

          libraryMeta.textContent = t.savedCount(
            cachedItems.length,
            formatBytes(cachedTotalBytes)
          );
          libraryEmptyEl.classList.add("hidden");
          readingListEl.classList.remove("hidden");

          for (var i = 0; i < cachedItems.length; i++) {
            (function (item) {
              var li = document.createElement("li");
              li.className = "reading-row";

              var openBtn = document.createElement("button");
              openBtn.type = "button";
              openBtn.className = "reading-open";

              var iconWrap = document.createElement("span");
              iconWrap.className = "reading-icon";
              iconWrap.setAttribute("aria-hidden", "true");
              iconWrap.innerHTML =
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

              var textWrap = document.createElement("span");
              textWrap.className = "reading-text";

              var titleSpan = document.createElement("span");
              titleSpan.className = "reading-title";
              titleSpan.textContent = item.title || "Materi";

              var metaParts = [];
              if (item.courseTitle) metaParts.push(item.courseTitle);
              if (item.chapterTitle) metaParts.push(item.chapterTitle);
              if (item.estimatedMinutes > 0) {
                metaParts.push(item.estimatedMinutes + " " + t.minUnit);
              }
              if (item.sizeBytes > 0) metaParts.push(formatBytes(item.sizeBytes));

              textWrap.appendChild(titleSpan);
              if (metaParts.length > 0) {
                var subSpan = document.createElement("span");
                subSpan.className = "reading-sub";
                subSpan.textContent = metaParts.join(" · ");
                textWrap.appendChild(subSpan);
              }

              openBtn.appendChild(iconWrap);
              openBtn.appendChild(textWrap);
              openBtn.addEventListener("click", function () {
                var store = getOfflineStorePlugin();
                if (!store || !store.getReading) return;
                store
                  .getReading({ key: item.key })
                  .then(function (res) {
                    if (res && res.reading) {
                      openReadingView(res.reading);
                    }
                  })
                  .catch(function () {});
              });

              var delBtn = document.createElement("button");
              delBtn.type = "button";
              delBtn.className = "icon-btn";
              delBtn.setAttribute("aria-label", t.deleteLabel);
              delBtn.innerHTML =
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>';
              delBtn.addEventListener("click", function () {
                var store = getOfflineStorePlugin();
                if (!store || !store.removeReading) return;
                try {
                  window.localStorage.removeItem(POSITION_PREFIX + item.key);
                } catch {}
                store
                  .removeReading({ key: item.key })
                  .then(loadLibrary)
                  .catch(function () {});
              });

              li.appendChild(openBtn);
              li.appendChild(delBtn);
              readingListEl.appendChild(li);
            })(cachedItems[i]);
          }
        }

        async function loadLibrary() {
          var store = getOfflineStorePlugin();
          if (!store || !store.listReadings) {
            cachedItems = [];
            cachedTotalBytes = 0;
            renderLibrary();
            return;
          }
          try {
            var res = await store.listReadings();
            cachedItems = Array.isArray(res && res.items) ? res.items : [];
            cachedTotalBytes = Number(res && res.totalBytes) || 0;
          } catch {
            cachedItems = [];
            cachedTotalBytes = 0;
          }
          renderLibrary();
        }

        function updateConnectionUI() {
          var offline = navigator.onLine === false;
          offlineIndicator.textContent = offline ? COPY[currentLang].offline : "";
          descEl.classList.toggle("hidden", !offline);
        }

        function renderLang(lang) {
          currentLang = lang;
          document.documentElement.lang = lang;
          var t = COPY[lang];
          titleEl.textContent = t.title;
          descEl.textContent = t.description;
          var retryLabelEl = document.getElementById("retry-label");
          if (retryLabelEl) retryLabelEl.textContent = t.retry;
          else retryBtn.textContent = t.retry;
          libraryHeading.textContent = t.libraryHeading;
          readerBackLabel.textContent = t.back;
          readerReconnectBtn.textContent = t.reconnect;
          langIdBtn.setAttribute("aria-pressed", String(lang === "id"));
          langEnBtn.setAttribute("aria-pressed", String(lang === "en"));
          updateConnectionUI();
          renderLibrary();
        }

        langIdBtn.addEventListener("click", function () {
          renderLang("id");
        });

        langEnBtn.addEventListener("click", function () {
          renderLang("en");
        });

        retryBtn.addEventListener("click", function () {
          void handleReturnOnline();
        });

        readerReconnectBtn.addEventListener("click", function () {
          void handleReturnOnline();
        });

        window.addEventListener("zyx:offline-open-reading", function (event) {
          var key = event.detail && event.detail.key;
          var store = getOfflineStorePlugin();
          if (!key || !store) return;
          persistActiveReadingPosition();
          void store.getReading({ key: key }).then(function (result) {
            if (result && result.reading) openReadingView(result.reading);
          });
        });
        if (window.zyxOfflineShell) {
          void window.zyxOfflineShell.ready.then(async function () {
            if (window.zyxOfflineShell.hasIdentity || navigator.onLine === false) return;
            try {
              var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
              var timer = controller ? setTimeout(function () { controller.abort(); }, 3500) : null;
              var response = await fetch(DEFAULT_ORIGIN + "/favicon.ico", { method: "HEAD", cache: "no-store", credentials: "omit", mode: "no-cors", signal: controller ? controller.signal : undefined });
              if (timer) clearTimeout(timer);
              if (response.ok || response.type === "opaque") window.location.replace(DEFAULT_ORIGIN + "/");
            } catch { /* The local library remains usable. */ }
          });
        }
        window.addEventListener("zyx:offline-lock-reader", function () {
          closeReadingView();
          readerTitleEl.textContent = "";
          readerMetaEl.textContent = "";
          readerBodyEl.replaceChildren();
        });


        readerBackBtn.addEventListener("click", closeReadingView);

        window.addEventListener("scroll", schedulePositionSave, { passive: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") {
            persistActiveReadingPosition();
          }
        });
        window.addEventListener("pagehide", persistActiveReadingPosition);

        // When connectivity returns, never auto-redirect mid-read.
        window.addEventListener("online", function () {
          updateConnectionUI();
        });

        window.addEventListener("offline", function () {
          updateConnectionUI();
        });

        renderLang(currentLang);
        void loadLibrary();
      })();
    </script>
  </body>
</html>
