<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Zyx Academy</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #52525b;
        --border: #e4e4e7;
        --surface: #f4f4f5;
        --primary: #18181b;
        --primary-fg: #ffffff;
        --accent: #d9532f;
        --radius: 12px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --surface: #18181b;
          --primary: #fafafa;
          --primary-fg: #09090b;
          --accent: #e06b48;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Inter, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(env(safe-area-inset-top) + 20px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--fg);
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        display: inline-block;
      }

      .lang-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }

      .lang-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        cursor: pointer;
      }

      .lang-btn[aria-pressed="true"] {
        background: var(--bg);
        color: var(--fg);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        padding: 32px 0;
      }

      .icon-wrap {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: var(--fg);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        appearance: none;
        width: 100%;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: opacity 120ms ease;
      }

      .btn:active {
        opacity: 0.82;
      }

      .btn-primary {
        border: 1px solid var(--primary);
        background: var(--primary);
        color: var(--primary-fg);
      }

      .btn-secondary {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
      }

      .status {
        margin-top: 16px;
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Zyx Academy</span>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" id="lang-id" aria-pressed="true">
          ID
        </button>
        <button
          type="button"
          class="lang-btn"
          id="lang-en"
          aria-pressed="false"
        >
          EN
        </button>
      </div>
    </header>

    <main>
      <div class="icon-wrap" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 2l20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <line x1="12" x2="12.01" y1="20" y2="20" />
        </svg>
      </div>

      <h1 id="title">Tidak dapat terhubung ke Zyx Academy</h1>
      <p id="description">
        Periksa koneksi internet Anda, lalu coba muat ulang. Anda tetap dapat
        membuka bacaan yang sudah tersimpan di perangkat.
      </p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="retry-btn">
          Coba lagi
        </button>
        <button type="button" class="btn btn-secondary" id="offline-btn">
          Buka bacaan offline
        </button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var DEFAULT_ORIGIN = "https://www.zyxacademy.com";

        var COPY = {
          id: {
            title: "Tidak dapat terhubung ke Zyx Academy",
            description:
              "Periksa koneksi internet Anda, lalu coba muat ulang. Anda tetap dapat membuka bacaan yang sudah tersimpan di perangkat.",
            retry: "Coba lagi",
            retrying: "Menghubungkan kembali...",
            offline: "Buka bacaan offline",
            stillOffline: "Koneksi masih belum tersedia.",
          },
          en: {
            title: "Unable to connect to Zyx Academy",
            description:
              "Check your internet connection and try again. You can still open readings saved on this device.",
            retry: "Try again",
            retrying: "Reconnecting...",
            offline: "Open offline readings",
            stillOffline: "Still offline. Check your connection.",
          },
        };

        var currentLang =
          (navigator.language || "id").toLowerCase().startsWith("en")
            ? "en"
            : "id";

        var titleEl = document.getElementById("title");
        var descEl = document.getElementById("description");
        var retryBtn = document.getElementById("retry-btn");
        var offlineBtn = document.getElementById("offline-btn");
        var statusEl = document.getElementById("status");
        var langIdBtn = document.getElementById("lang-id");
        var langEnBtn = document.getElementById("lang-en");

        function getTargetOrigin() {
          if (
            window.location.protocol === "http:" ||
            window.location.protocol === "https:"
          ) {
            return window.location.origin;
          }
          return DEFAULT_ORIGIN;
        }

        function renderLang(lang) {
          currentLang = lang;
          document.documentElement.lang = lang;
          var t = COPY[lang];
          titleEl.textContent = t.title;
          descEl.textContent = t.description;
          retryBtn.textContent = t.retry;
          offlineBtn.textContent = t.offline;
          langIdBtn.setAttribute("aria-pressed", String(lang === "id"));
          langEnBtn.setAttribute("aria-pressed", String(lang === "en"));
        }

        langIdBtn.addEventListener("click", function () {
          renderLang("id");
        });

        langEnBtn.addEventListener("click", function () {
          renderLang("en");
        });

        retryBtn.addEventListener("click", function () {
          var t = COPY[currentLang];
          statusEl.textContent = t.retrying;
          if (!navigator.onLine) {
            statusEl.textContent = t.stillOffline;
            return;
          }
          window.location.href = getTargetOrigin() + "/";
        });

        offlineBtn.addEventListener("click", function () {
          window.location.href = getTargetOrigin() + "/offline";
        });

        window.addEventListener("online", function () {
          window.location.href = getTargetOrigin() + "/";
        });

        renderLang(currentLang);
      })();
    </script>
  </body>
</html>
