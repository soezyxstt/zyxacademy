# Machine-Readable Rulebook: Bahasa Ajar (Indonesia - Gaya Tutor Sebaya)
# Single Source of Truth untuk prompt penulisan dan validator deterministik (scripts/lint_bahasa_ajar.py)

version: "1.1"
language: "id"
target_audience: "Mahasiswa menengah ke bawah / pemula (gaya tutor sebaya yang santai, mengalir, tetap akurat)"

rules:
  - rule_id: "STYLE.PUNCT.NO_LONG_DASHES"
    dimension: "Format"
    priority: "P0_HARD"
    operational_def: "Nol kemunculan Unicode em dash (U+2014) dan en dash (U+2013) di mana pun dalam naskah."
    verifier:
      type: "regex"
      pattern: "[\u2013\u2014]"
      max_matches: 0
    repair: "Ganti em/en dash dengan koma, tanda kurung, titik dua, atau kata 'sampai'."

  - rule_id: "ID.COHESION.INTRACLAUSE_START"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Konjungsi intrakalimat (sehingga, sedangkan, agar, serta, melainkan) tidak boleh mengawali kalimat; 'Karena' di awal kalimat hanya sah jika diikuti koma dan klausa induk."
    verifier:
      type: "regex_sentence_start"
      forbidden: ["Sehingga", "Sedangkan", "Agar", "Serta", "Melainkan"]
      allow_karena_with_comma: true
    repair: "Gabungkan ke kalimat sebelumnya, atau ganti dengan jembatan alami ('Jadi,', 'Akibatnya,', 'Sementara itu,')."

  - rule_id: "ID.COHESION.NO_STACKED_CONJUNCTION"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Larangan menumpuk konjungsi ganda yang mubazir atau tidak baku."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "selain itu juga"
        - "namun sebaliknya"
        - "tetapi namun"
        - "sehabis kemudian"
        - "lalu kemudian"
        - "disebabkan karena"
        - "dikarenakan oleh"
        - "agar supaya"
        - "demi untuk"
        - "sehingga menyebabkan"
    repair: "Pilih satu konjungsi yang paling tepat maknanya dan hapus konjungsi kedua."

  - rule_id: "ID.LEXICON.NO_PLEONASM"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Larangan frasa pleonasme dan diksi tidak baku yang mengaburkan subjek atau verba."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "bertujuan untuk"
        - "dikarenakan"
        - "adalah merupakan"
        - "hanya sekadar"
        - "sangat sekali"
        - "dimana"
        - "di mana"
    repair: "Ganti 'bertujuan untuk' -> 'bertujuan', 'dikarenakan' -> 'karena'/'disebabkan oleh', 'adalah merupakan' -> 'adalah'/'itu', 'di mana' -> 'tempat'/'yang'."

  - rule_id: "ID.COHESION.NO_DANGLING_INI"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Penunjuk 'Ini' atau 'Itu' tidak boleh berdiri sendiri sebagai subjek di awal kalimat tanpa nomina perangkum."
    verifier:
      type: "regex_sentence_start"
      pattern: "^(Ini|Itu)\\s+(adalah|merupakan|membuktikan|menunjukkan|berarti|menyebabkan|membuat|terjadi|disebabkan|setara)\\b"
    repair: "Tambahkan nomina perangkum yang akrab: 'Hal ini ...', 'Angka ini ...', 'Efek ini ...'."

  - rule_id: "ID.STYLE.NO_STIFF_TEXTBOOK_DICTION"
    dimension: "Style"
    priority: "P1_STRONG"
    operational_def: "Hindari diksi diktat/ensiklopedia yang kaku ('ialah', 'yakni', 'bahwasanya', 'adapun', 'berdasarkan hal tersebut', 'tersebut di atas', 'pada keluaran', 'pembacaan semu')."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "ialah"
        - "yakni"
        - "bahwasanya"
        - "adapun"
        - "berdasarkan hal tersebut"
        - "tersebut di atas"
        - "oleh sebab itu maka"
        - "pada keluaran"
        - "pembacaan semu"
    repair: "Ganti dengan bahasa tutur yang akrab dan konkret ('itu', 'artinya', 'dari sini', 'di hasil ukurnya', 'angka salah baca')."

  - rule_id: "ID.POV.PEER_TUTOR_VOICE"
    dimension: "Situation"
    priority: "P1_STRONG"
    operational_def: "Gunakan suara tutor sebaya yang hangat dengan sapaan 'kamu'/'kalian'/'kita' (min rasio 1,5%) serta jembatan percakapan alami ('Nah,', 'Jadi,', 'Coba', 'Kalau menurut...', 'Hati-hati', 'Artinya,')."
    verifier:
      type: "python_metric"
      pronoun_targets: ["kamu", "kalian", "kita", "anda"]
      min_ratio: 0.015
      conversational_bridges: ["nah", "jadi", "coba", "bayangkan", "kalau", "artinya", "hati-hati", "harusnya", "menurut"]
      min_bridges_per_120_words: 1
    repair: "Sapa pembaca langsung dengan 'kamu'/'kalian'/'kita' dan selipkan jembatan obrolan alami ('Nah, setelah dapat X, kita bisa lanjut ke Y...')."

  - rule_id: "ID.SYNTAX.SENTENCE_LENGTH"
    dimension: "Format"
    priority: "P1_STRONG"
    operational_def: "Rerata panjang kalimat <= 16 kata; batas keras per kalimat <= 22 kata agar enak dibaca dalam satu tarikan napas."
    verifier:
      type: "python_metric"
      mean_max: 16
      hard_max: 22
    repair: "Pecah kalimat panjang menjadi dua kalimat aktif pendek yang mengalir."

  - rule_id: "ID.PARAGRAPH.FOCUSED_LENGTH"
    dimension: "Format"
    priority: "P1_STRONG"
    operational_def: "Satu fokus ide per paragraf (target 50-120 kata; peringatan di atas 130 kata)."
    verifier:
      type: "python_metric"
      paragraph_word_max: 130
    repair: "Pecah paragraf > 130 kata menjadi dua paragraf yang lebih lega."

  - rule_id: "ID.LEXICON.CONCEPTS_FIRST_BOLD_DEF"
    dimension: "Content"
    priority: "P1_STRONG"
    operational_def: "Bangun intuisi sehari-hari dulu sebelum menempelkan istilah teknis; cetak tebal istilah pada kemunculan pertama diikuti penjelasan yang membumi."
    verifier:
      type: "llm_rubric"
      rubric_id: "concepts_first_defined"
    repair: "Ceritakan apa yang terjadi dalam bahasa sehari-hari dulu, baru kenalkan **istilah resmi**."

  - rule_id: "ID.PEDAGOGY.WORKED_EXAMPLE_AND_INTERACTION"
    dimension: "Content"
    priority: "P1_STRONG"
    operational_def: "Materi konsep/hitungan menyertakan contoh konkret langkah demi langkah dan minimal satu momen interaksi (pertanyaan pelibat atau peringatan titik rawan salah paham)."
    verifier:
      type: "llm_rubric"
      rubric_id: "worked_example_and_interaction"
    repair: "Tambahkan contoh hitungan/kasus terurai dan satu pertanyaan pelibat atau catatan 'Hati-hati di bagian ini...'."
