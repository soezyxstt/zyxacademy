# Machine-Readable Rulebook: Instructional Language (English - Peer-Tutor Voice)
# Single Source of Truth for drafting prompts and deterministic linter (scripts/lint_instructional_en.py)

version: "1.1"
language: "en"
target_audience: "Novice / lower-to-mid-achieving college readers (warm peer-tutor voice, never stiff textbook prose)"

rules:
  - rule_id: "STYLE.PUNCT.NO_LONG_DASHES"
    dimension: "Format"
    priority: "P0_HARD"
    operational_def: "Zero occurrences of Unicode em dash (U+2014) or en dash (U+2013) anywhere in the output."
    verifier:
      type: "regex"
      pattern: "[\u2013\u2014]"
      max_matches: 0
    repair: "Replace em/en dashes with commas, parentheses, colons, or the word 'to'."

  - rule_id: "EN.COHESION.NO_DANGLING_DEMONSTRATIVE"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Sentence-initial 'This', 'These', 'That', or 'Those' must be followed by a summary noun, never directly by a verb."
    verifier:
      type: "regex_sentence_start"
      pattern: "^(This|These|That|Those)\\s+(is|are|was|were|shows|show|proves|prove|means|mean|causes|cause|leads|lead|creates|create|makes|make|occurs|occur|happens|happen|explains|explain|indicates|indicate|suggests|suggest|can|will|may|might)\\b"
    repair: "Add an explicit summary noun: 'This shift shows...', 'These numbers tell us...'."

  - rule_id: "EN.LEXICON.NO_BUREAUCRATIC_FILLER"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Eliminate wordy bureaucratic fillers and common hidden-verb nominalizations."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "in order to"
        - "due to the fact that"
        - "at this point in time"
        - "for the purpose of"
        - "in the event that"
        - "utilize"
        - "utilization"
        - "make a decision"
        - "conduct an investigation"
        - "the implementation of"
        - "a reduction in"
        - "the utilization of"
    repair: "Replace with plain active verbs: 'to', 'because', 'now', 'use', 'decide', 'investigate', 'implemented', 'dropped'."

  - rule_id: "EN.COHESION.NO_ADDITIVE_BLOAT"
    dimension: "Style"
    priority: "P0_HARD"
    operational_def: "Avoid heavy additive connectives ('furthermore', 'moreover', 'in addition to this', 'additionally') that hurt comprehension on difficult texts."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "furthermore"
        - "moreover"
        - "in addition to this"
        - "additionally"
    repair: "Remove the additive filler or replace it with a causal ('because', 'so', 'therefore') or contrastive ('however', 'although', 'but') link."

  - rule_id: "EN.STYLE.NO_STIFF_TEXTBOOK_PHRASING"
    dimension: "Style"
    priority: "P1_STRONG"
    operational_def: "Avoid stiff, distant textbook phrasing ('one must', 'the student should', 'it should be noted that', 'it is important to note that', 'herein', 'thereby', 'constitutes', 'with respect to', 'apparent reading')."
    verifier:
      type: "phrase_blacklist"
      forbidden:
        - "one must"
        - "the student should"
        - "the student must"
        - "it should be noted that"
        - "it is important to note that"
        - "herein"
        - "thereby"
        - "aforementioned"
        - "constitutes"
        - "with respect to"
        - "pertaining to"
    repair: "Rewrite in warm peer-tutor language with 'you'/'we', natural contractions, and concrete verbs."

  - rule_id: "EN.POV.PEER_TUTOR_VOICE"
    dimension: "Situation"
    priority: "P1_STRONG"
    operational_def: "Use conversational pronouns ('you', 'your', 'we', 'our') at >= 1.5% word ratio, natural contractions, and conversational bridges/check-in questions paired with task relevance."
    verifier:
      type: "hybrid"
      pronoun_targets: ["you", "your", "we", "our", "let's"]
      min_ratio: 0.015
      llm_rubric: "read_aloud_peer_tutor_and_relevance"
    repair: "Talk directly with 'you'/'we', add natural contractions, and insert a conversational bridge ('Now, once we get X...') or check-in question."

  - rule_id: "EN.SYNTAX.SENTENCE_LENGTH"
    dimension: "Format"
    priority: "P1_STRONG"
    operational_def: "Mean sentence length <= 22 words; hard maximum per sentence <= 28 words."
    verifier:
      type: "python_metric"
      mean_max: 22
      hard_max: 28
    repair: "Split long or center-embedded sentences into two crisp active sentences."

  - rule_id: "EN.PARAGRAPH.DEDUCTIVE_LENGTH"
    dimension: "Format"
    priority: "P1_STRONG"
    operational_def: "One idea per focused paragraph (target 70-120 words; warn above 135 words)."
    verifier:
      type: "python_metric"
      paragraph_word_max: 135
    repair: "Split paragraphs exceeding 135 words into two focused paragraphs."

  - rule_id: "EN.SYNTAX.ACTIVE_VOICE"
    dimension: "Style"
    priority: "P1_STRONG"
    operational_def: "Prefer active agent-first clauses; keep passive constructions below 20% of sentences."
    verifier:
      type: "python_metric"
      passive_ratio_max: 0.20
    repair: "Move the agent to the subject slot and use a direct active verb."

  - rule_id: "EN.FORMAT.SELECTIVE_SIGNALING"
    dimension: "Format"
    priority: "P1_STRONG"
    operational_def: "Bold signaling stays selective (<= 20% of total prose words)."
    verifier:
      type: "python_metric"
      bold_word_ratio_max: 0.20
    repair: "Bold only core terms on first introduction and key structural anchors."

  - rule_id: "EN.LEXICON.CONCEPTS_FIRST_STRUCTURE_FUNCTION"
    dimension: "Content"
    priority: "P1_STRONG"
    operational_def: "Explain concepts in concrete plain language before naming technical jargon; define every new term with both Structure and Function."
    verifier:
      type: "llm_rubric"
      rubric_id: "concepts_first_structure_function"
    repair: "Lead with concrete intuition, then introduce the bolded term with a Structure + Function definition."
