interface:
  display_name: "Zyx Admin Operations"
  short_description: "Manage authorized Zyx admin operations through MCP"
  default_prompt: "Use $zyx-admin-operations. Call admin.environment and match its environment and origin to the user-requested target. Pass expectedEnvironment and expectedOrigin on every admin data call. Stop if the intended connection is unavailable; never substitute another environment. Inspect granted scopes, actual tool catalog and target revisions. Follow signed mutation plans, preserve retry request keys, and distinguish queued external work from completed provider effects."
