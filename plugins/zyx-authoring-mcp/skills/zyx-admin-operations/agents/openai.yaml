interface:
  display_name: "Zyx Admin Operations"
  short_description: "Manage authorized Zyx admin operations through MCP"
  default_prompt: "Use $zyx-admin-operations. Call admin.environment and match its environment and origin to the user-requested target. Pass expectedEnvironment and expectedOrigin on every admin data call. Stop if the intended connection is unavailable; never substitute another environment. Use admin.capabilities for the relevant domain, inspect granted scopes and exact target revisions, and choose a focused blog, revision, form, media or recovery skill when appropriate. Follow signed mutation plans, preserve retry request keys, recover lost responses through admin.operation_receipt, and distinguish queued external work from completed provider effects."
