appId: com.zyx.academy.nativeparity
name: Operations question Idea weights and draft revision
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://operations-fixture?caseId=operations-evaluation-questions-populated"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: 'Open in .*Zyx Academy Native.*'
          commands:
            - tapOn: "Open"
- assertVisible:
    id: operations-evaluation-questions-populated
- extendedWaitUntil:
    visible: '.*Gaya tetap 10 N.*'
    timeout: 20000
- tapOn: Lihat detail
- scrollUntilVisible:
    element:
      text: Edit Soal dan Kunci Jawaban
- tapOn: Edit Soal dan Kunci Jawaban
- scrollUntilVisible:
    element:
      text: MD03.2
- tapOn: MD03.2
- scrollUntilVisible:
    element:
      text: '.*100%.*Siap disimpan.*'
    direction: UP
- assertVisible: '.*2 Idea terhubung.*'
- takeScreenshot: evaluation-idea-weights
- scrollUntilVisible:
    element:
      id: evaluation-question-save-draft
# The footer can match at the bottom of the screen while clipped by the scroll view.
- scroll
- waitForAnimationToEnd
- tapOn:
    id: evaluation-question-save-draft
- extendedWaitUntil:
    visible: Perubahan disimpan sebagai draf.
    timeout: 20000
