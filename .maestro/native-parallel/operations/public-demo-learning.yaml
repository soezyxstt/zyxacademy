appId: com.zyx.academy.nativeparity
name: Operations public demo completion, study planning and tryout list
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://operations-fixture?caseId=&mode=populated&theme=light&locale=en&path=%2Fdemo%2Farticle%3Fcourse%3Ddemo-kalkulus"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: 'Open in .*Zyx Academy Native.*'
          commands:
            - tapOn: "Open"
- scrollUntilVisible:
    element:
      id: public-demo-complete-material
- tapOn:
    id: public-demo-complete-material
- assertVisible: Completed
- openLink: "zyx-native-parity://operations-fixture?caseId=&mode=populated&theme=light&locale=en&path=%2Fdemo%2Fprogress%3Fcourse%3Ddemo-kalkulus"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: 'Open in .*Zyx Academy Native.*'
          commands:
            - tapOn: "Open"
- assertVisible: 3 of 8 materials completed
- takeScreenshot: demo-progress
- scrollUntilVisible:
    element:
      id: public-demo-progress-mastery
    centerElement: true
- tapOn:
    id: public-demo-progress-mastery
- assertVisible: Topic to revisit
- takeScreenshot: demo-mastery
- scrollUntilVisible:
    element:
      id: public-demo-mastery-path
    centerElement: true
- tapOn:
    id: public-demo-mastery-path
- scrollUntilVisible:
    element:
      id: public-demo-path-days
    centerElement: true
- tapOn:
    id: public-demo-path-days
- inputText: "2"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: public-demo-path-create-plan
- assertVisible: "Day 1 · 12 min"
- scrollUntilVisible:
    element:
      id: public-demo-path-day-2
    centerElement: true
- tapOn:
    id: public-demo-path-day-2
- scrollUntilVisible:
    element: "Luas bertanda · 12 min"
- assertVisible: "Luas bertanda · 12 min"
- takeScreenshot: demo-path-planned
- scrollUntilVisible:
    element:
      id: public-demo-path-roadmap
    direction: UP
    centerElement: true
- tapOn:
    id: public-demo-path-roadmap
- assertNotVisible:
    id: public-demo-path-day-2
- openLink: "zyx-native-parity://operations-fixture?caseId=&mode=populated&theme=light&locale=en&path=%2Fdemo%2Ftryout-list%3Fcourse%3Ddemo-kalkulus"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: 'Open in .*Zyx Academy Native.*'
          commands:
            - tapOn: "Open"
- assertVisible: "3 questions · 15 min · Up to 2 attempts"
- takeScreenshot: demo-tryout-list
- tapOn:
    id: public-demo-tryout-start
- assertVisible: Open demo in browser
