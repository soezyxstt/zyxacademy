appId: com.zyx.academy.nativeparity
name: Operations admin authoring, recovery and confirmation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://operations-fixture?caseId=&mode=recoverable&theme=light&locale=id&path=%2Fadmin%2Fblog"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: 'Open in .*Zyx Academy Native.*'
          commands:
            - tapOn: "Open"
- assertVisible: Data belum dapat dimuat. Coba lagi.
- tapOn: Coba lagi
- assertVisible: Strategi latihan mandiri
- takeScreenshot: management-blog-populated
- tapOn: Pratinjau
- assertVisible: Sunting
- tapOn: Coba lagi
- scrollUntilVisible:
