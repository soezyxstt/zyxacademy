    direction: DOWN
- takeScreenshot: management-blog-preview
- openLink: "zyx-native-parity://operations-fixture?caseId=&mode=populated&theme=light&locale=id&path=%2Fadmin%2Fblog%2Fnew"
- runFlow:
    when:
      platform: iOS
