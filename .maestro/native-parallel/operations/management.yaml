appId: com.zyx.academy.nativeparity
name: Operations admin authoring, recovery and confirmation
---
- launchApp
- openLink: "zyx-native-parity://operations-fixture?path=%2Fadmin%2Fblog&mode=recoverable"
- assertVisible: Data belum dapat dimuat. Coba lagi.
- tapOn: Coba lagi
- assertVisible: Strategi latihan mandiri
- takeScreenshot: ${SCREENSHOT_DIR}/management-blog-populated
- tapOn: Pratinjau
- assertVisible: Sunting
- tapOn: Coba lagi
- scrollUntilVisible:
    element: Pengaturan publikasi
    direction: DOWN
- takeScreenshot: ${SCREENSHOT_DIR}/management-blog-preview
- openLink: "zyx-native-parity://operations-fixture?path=%2Fadmin%2Fblog%2Fnew"
- assertVisible: Simpan artikel
- tapOn: Simpan artikel
- assertVisible: Isi judul atau awali konten dengan heading judul.
- takeScreenshot: ${SCREENSHOT_DIR}/management-blog-invalid
- openLink: "zyx-native-parity://operations-fixture?path=%2Fadmin%2Fforms%2Fform-local"
- assertVisible: Umpan balik latihan
- assertVisible: 2 respons
- takeScreenshot: ${SCREENSHOT_DIR}/management-form-summary
- openLink: "zyx-native-parity://operations-fixture?path=%2Fadmin%2Ftautan"
- assertVisible: Tautan penting
- tapOn:
    text: Hapus
    index: 0
- assertVisible: Hapus tautan?
- takeScreenshot: ${SCREENSHOT_DIR}/management-link-confirmation
- tapOn: Batal
- assertVisible: '.*Panduan belajar.*'
- openLink: "zyx-native-parity://operations-fixture?path=%2Fadmin%2Fblog&mode=denied&theme=dark"
- assertVisible: Akses admin diperlukan.
- assertNotVisible: Strategi latihan mandiri
- takeScreenshot: ${SCREENSHOT_DIR}/management-denied
