appId: com.zyx.academy.nativeparity
name: Tutor schedule calendar and slot dialog
---
- launchApp
- openLink: zyx-native-parity://academic?role=tutor&path=%2Ftutor%2Fschedule&theme=dark
- extendedWaitUntil:
    visible:
      id: tutor-schedule-calendar
    timeout: 20000
- assertVisible: Struktur dan fungsi sel
- tapOn:
    id: tutor-schedule-calendar-date-2026-11-23
- assertVisible: Tidak ada slot atau sesi pada tanggal ini.
- tapOn: Tambah slot
- assertVisible:
    id: tutor-schedule-slot-dialog
- tapOn: Simpan slot
- assertVisible:
    id: tutor-schedule-calendar-event-academic-slot-2
- tapOn:
    id: tutor-schedule-calendar-event-academic-slot-2
- assertVisible: Edit slot ketersediaan
- tapOn:
    id: tutor-schedule-slot-dialog-close
- assertVisible:
    id: tutor-schedule-calendar-event-academic-slot-2
- takeScreenshot: academic-tutor-schedule-slot-dark
- tapOn:
    id: tutor-schedule-calendar-next
- assertVisible:
    id: tutor-schedule-calendar-date-2026-11-30
- tapOn:
    id: tutor-schedule-calendar-previous
- tapOn:
    id: tutor-schedule-calendar-date-2026-11-23
- assertVisible:
    id: tutor-schedule-calendar-event-academic-slot-2
