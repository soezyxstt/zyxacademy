appId: com.zyx.academy.nativeparity
name: Shared search expansion, editing and clear
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-search-collapsed
- runFlow: helpers/confirm-ios-link.yaml
- tapOn:
    id: shared-ui-search-collapsed-trigger
- assertVisible:
    id: shared-ui-search-collapsed-input
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: shared-ui-search-collapsed-input
          focused: true
- inputText: Gelombang
- assertVisible:
    id: shared-ui-search-collapsed-input
    text: Gelombang
- tapOn:
    id: shared-ui-search-collapsed-clear
- assertNotVisible:
    id: shared-ui-search-collapsed-clear
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: shared-ui-search-collapsed-input
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: Mekanika
      - assertVisible:
          id: shared-ui-search-collapsed-input
          text: '^Mekanika$'
- tapOn:
    id: shared-ui-search-collapsed-close
- assertVisible:
    id: shared-ui-search-collapsed-trigger
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-search-query
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible:
    id: shared-ui-search-query-input
    text: Gelombang
- tapOn:
    id: shared-ui-search-query-clear
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: shared-ui-search-query-input
          focused: true
- assertNotVisible:
    id: shared-ui-search-query-clear
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: Fisika
      - assertVisible:
          id: shared-ui-search-query-input
          text: '^Fisika$'
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-search-loading
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible:
    id: shared-ui-search-loading-input
    text: Energi
    enabled: true
- tapOn:
    id: shared-ui-search-loading-clear
- inputText: Gaya
- assertVisible:
    id: shared-ui-search-loading-input
    text: Gaya
