appId: com.zyx.academy.nativeparity
name: Shared grid and table data states
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-grid-narrow
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible:
    id: shared-ui-grid-narrow-grid-item-mechanics-column-1
- assertVisible:
    id: shared-ui-grid-narrow-grid-item-thermodynamics-column-1
- assertVisible:
    id: shared-ui-grid-narrow-grid-item-waves-column-1
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-grid-long
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible: Usaha dan energi pada sistem dengan gaya yang berubah terhadap posisi
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-table-empty
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible: Belum ada peserta yang perlu ditinjau\.
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-table-single
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible: '.*Maya Ayuningtyas Kusumawardani.*'
- assertVisible: Hubungan perubahan entalpi dengan perpindahan kalor pada sistem tertutup
- openLink: zyx-native-parity://internal/shared-ui/shared-ui-table-many
- runFlow: helpers/confirm-ios-link.yaml
- assertVisible: '.*Nara Pratama.*'
- assertVisible: '.*Sinta Dewi.*'
- assertVisible: '.*Maya Ayuningtyas Kusumawardani.*'
