appId: com.zyx.academy.nativeparity
name: Dialog validation and overlay dismissal
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://shared-ui/shared-dialog-closed-light
- extendedWaitUntil:
    visible:
      id: shared-dialog-closed-light-trigger
    timeout: 15000
- assertNotVisible:
    id: shared-dialog-closed-light-panel
- tapOn:
    id: shared-dialog-closed-light-trigger
- tapOn:
    id: shared-dialog-closed-light-panel-close
- assertVisible:
    id: shared-dialog-closed-light-trigger
- openLink: zyx-native-parity://shared-ui/shared-dialog-validation-light
- tapOn:
    id: shared-dialog-validation-light-submit
- assertVisible: Alasan permohonan wajib diisi.
- inputText: Jadwal praktikum bertabrakan.
- hideKeyboard
- tapOn:
    id: shared-dialog-validation-light-submit
- assertVisible: Permohonan berhasil diajukan kepada tutor.
- assertNotVisible:
    id: shared-dialog-validation-light-panel
- openLink: zyx-native-parity://shared-ui/shared-dialog-long-dark
- assertVisible:
    id: shared-dialog-long-dark-reason
- tapOn:
    id: shared-dialog-long-dark-panel-close
- openLink: zyx-native-parity://shared-ui/shared-sheet-closed-light
- tapOn:
    id: shared-sheet-closed-light-trigger
- tapOn:
    id: shared-sheet-closed-light-chapter-2
- assertVisible:
    id: shared-sheet-closed-light-chapter
    text: Representasi dan tipe data
- openLink: zyx-native-parity://shared-ui/shared-sheet-outline-light
- tapOn:
    id: shared-sheet-outline-light-chapter-3
- assertVisible:
    id: shared-sheet-outline-light-chapter
    text: Percabangan dan perulangan
- openLink: zyx-native-parity://shared-ui/shared-sheet-back-dark
- assertVisible:
    id: shared-sheet-back-dark-panel
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: shared-sheet-back-dark-panel-close
- assertNotVisible:
    id: shared-sheet-back-dark-panel
- assertVisible:
    id: shared-sheet-back-dark-trigger
- openLink: zyx-native-parity://shared-ui/shared-popover-closed-light
- tapOn:
    id: shared-popover-closed-light-trigger
- tapOn:
    point: 50%,75%
- assertNotVisible:
    id: shared-popover-closed-light-panel
- assertVisible:
    id: shared-popover-closed-light-trigger
- openLink: zyx-native-parity://shared-ui/shared-popover-filters-light
- tapOn:
    id: shared-popover-filters-light-option-2
- assertVisible:
    id: shared-popover-filters-light-selection
    text: Minggu
- openLink: zyx-native-parity://shared-ui/shared-popover-long-dark
- tapOn:
    id: shared-popover-long-dark-option-2
- assertVisible:
    id: shared-popover-long-dark-selection
    text: Dasar Pemrograman dan Penyelesaian Masalah
