appId: com.zyx.academy.nativeparity
name: Shared toolbar actions, wrapping and pending state
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://shared-ui/shared-ui-toolbar-compact
- tapOn:
    id: shared-ui-toolbar-compact-channel
- assertVisible: Kanal Fisika
- tapOn:
    id: shared-ui-toolbar-compact-search-trigger
- assertVisible:
    id: shared-ui-toolbar-compact-search-input
    focused: true
- assertNotVisible:
    id: shared-ui-toolbar-compact-create
- tapOn:
    id: shared-ui-toolbar-compact-search-close
- tapOn:
    id: shared-ui-toolbar-compact-create
- assertVisible: Siap membuat pertanyaan
- openLink: zyx-native-parity://shared-ui/shared-ui-toolbar-wrap
- tapOn:
    id: shared-ui-toolbar-wrap-level
- assertVisible: Tingkat menengah
- tapOn:
    id: shared-ui-toolbar-wrap-size
- assertVisible: 50 soal per halaman
- tapOn:
    id: shared-ui-toolbar-wrap-export
- assertVisible: Laporan siap diekspor
- openLink: zyx-native-parity://shared-ui/shared-ui-toolbar-pending
- assertVisible:
    id: shared-ui-toolbar-pending-refresh
    enabled: false
- assertVisible:
    id: shared-ui-toolbar-pending-create
    enabled: false
- assertVisible:
    id: shared-ui-toolbar-pending-channel
    enabled: true
