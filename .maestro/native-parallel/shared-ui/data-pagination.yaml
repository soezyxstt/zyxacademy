appId: com.zyx.academy.nativeparity
name: Shared pagination boundaries and pending state
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://shared-ui/shared-ui-pagination-first
- assertVisible: 1 / 3
- assertVisible:
    id: shared-ui-pagination-first-previous
    enabled: false
- tapOn:
    id: shared-ui-pagination-first-next
- assertVisible: 2 / 3
- tapOn:
    id: shared-ui-pagination-first-next
- assertVisible: 3 / 3
- assertVisible:
    id: shared-ui-pagination-first-next
    enabled: false
- openLink: zyx-native-parity://shared-ui/shared-ui-pagination-middle
- assertVisible: 2 / 5
- tapOn:
    id: shared-ui-pagination-middle-previous
- assertVisible: 1 / 5
- openLink: zyx-native-parity://shared-ui/shared-ui-pagination-pending
- assertVisible: Memuat halaman…
- assertVisible:
    id: shared-ui-pagination-pending-previous
    enabled: false
- assertVisible:
    id: shared-ui-pagination-pending-next
    enabled: false
- tapOn:
    id: shared-ui-pagination-pending-next
- assertVisible: 2 / 5
