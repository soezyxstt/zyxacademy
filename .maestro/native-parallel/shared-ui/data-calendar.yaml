appId: com.zyx.academy.nativeparity
name: Shared calendar range, date and event selection
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- openLink: zyx-native-parity://shared-ui/shared-ui-calendar-empty
- assertVisible: Tidak ada jadwal pada tanggal ini\.
- assertVisible:
    id: shared-ui-calendar-empty-previous
    enabled: false
- tapOn:
    id: shared-ui-calendar-empty-next
- assertVisible: 9–15 Mar 2026
- assertVisible:
    id: shared-ui-calendar-empty-next
    enabled: false
- tapOn:
    id: shared-ui-calendar-empty-previous
- assertVisible: 2–8 Mar 2026
- openLink: zyx-native-parity://shared-ui/shared-ui-calendar-available
- assertVisible:
    id: shared-ui-calendar-available-event-momentum
- tapOn:
    id: shared-ui-calendar-available-date-2026-03-05
- assertVisible: Tidak ada jadwal pada tanggal ini\.
- tapOn:
    id: shared-ui-calendar-available-date-2026-03-04
- tapOn:
    id: shared-ui-calendar-available-event-momentum
- assertVisible: Tinjau hukum kekekalan momentum dan contoh tumbukan\.
- openLink: zyx-native-parity://shared-ui/shared-ui-calendar-selected
- assertVisible: Tinjau hukum kekekalan momentum dan contoh tumbukan\.
- tapOn:
    id: shared-ui-calendar-selected-event-momentum
- assertNotVisible: Tinjau hukum kekekalan momentum dan contoh tumbukan\.
