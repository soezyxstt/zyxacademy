appId: com.zyx.academy.nativeparity
name: Student Zyra renders and recovers an interactive canvas
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=zyra-course&theme=light&locale=en&path=%2Fcourses%2Fmatematika-1"
- extendedWaitUntil:
    visible:
      id: student-zyra-open
    timeout: 30000
- tapOn:
    id: student-zyra-open
- extendedWaitUntil:
    visible:
      id: student-zyra-question
    timeout: 30000
- tapOn:
    id: student-zyra-question
- inputText: Explain the limit
- tapOn:
    id: student-zyra-send
- hideKeyboard
- extendedWaitUntil:
    visible: Parameters
    timeout: 20000
- tapOn: Parameters
- scrollUntilVisible:
    element:
      id: student-zyra-preset-a--2
    direction: DOWN
- tapOn:
    id: student-zyra-preset-a--2
- assertVisible:
    id: student-zyra-parameter-a
    text: "Coefficient: -2"
- scrollUntilVisible:
    element:
      text: History
    direction: UP
- tapOn: History
- tapOn:
    id: student-zyra-session-fixture-conversation
- extendedWaitUntil:
    visible: Parameters
    timeout: 20000
- tapOn:
    id: student-zyra-question
- inputText: Explain continuity
- tapOn:
    id: student-zyra-send
- hideKeyboard
- extendedWaitUntil:
    visible: "Your question may have been saved.*"
    timeout: 20000
- assertNotVisible: "A saved reply about continuity."
- tapOn: Check history
- extendedWaitUntil:
    visible: Parameters
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "A saved reply about continuity."
    direction: UP
- assertNotVisible: "A partial reply."
