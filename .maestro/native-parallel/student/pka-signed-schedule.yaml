appId: com.zyx.academy.nativeparity
name: Student signed Tutorial PKA schedule
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=pka-signed-member&theme=light&locale=id&path=%2Fcourses%2Ftutorial-pka%2Fjadwal"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Diskusi limit PKA$'
    timeout: 25000
- assertVisible: '^Diskusi limit PKA$'
- assertVisible: '^Jadwal Live Tutorial$'
- assertVisible: '^Gabung Meet$'
- takeScreenshot: student-pka-schedule-member
