appId: com.zyx.academy.nativeparity
name: Student course unenrolled fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=unenrolled"
- extendedWaitUntil:
    visible:
      id: student-course-matematika-1
    timeout: 30000
- takeScreenshot: student-unenrolled-dashboard
- tapOn:
    id: student-course-matematika-1
- tapOn:
    id: student-course-tabs-documents
- scrollUntilVisible:
    element:
      id: student-documents-chapter-bab-2
    direction: DOWN
    timeout: 30000
- tapOn:
    id: student-documents-chapter-bab-2
- scrollUntilVisible:
    element:
      id: student-material-catatan-fungsi
    direction: DOWN
    timeout: 30000
- tapOn:
    id: student-material-catatan-fungsi
- assertVisible:
    id: student-material-locked
- takeScreenshot: student-unenrolled-locked
