appId: com.zyx.academy.nativeparity
name: Student opens their own weekly reflection archive
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&path=/profile/reflections&theme=light&locale=id"
- extendedWaitUntil:
    visible: '^(?:23 Nov(?:ember)?(?:,)? 2026)$'
    timeout: 30000
- tapOn: '^(?:23 Nov(?:ember)?(?:,)? 2026)$'
- assertVisible:
    id: student-fixture-id-light
- assertVisible: '^Kuis 2 · Flashcard 12 · Materi 3$'
- assertVisible: '^Pertumbuhan penguasaan 12$'
- takeScreenshot: student-reflections-owned-id-light
- openLink: "zyx-native-parity://student-fixture?scenario=empty&path=/profile/reflections&theme=light&locale=id"
- extendedWaitUntil:
    visible: '^Belum ada refleksi mingguan\.$'
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- assertVisible: '^Belum ada refleksi mingguan\.$'
- assertNotVisible: '^(?:23 Nov(?:ember)?(?:,)? 2026)$'
- takeScreenshot: student-reflections-empty-id-light
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&path=/profile/reflections&theme=dark&locale=en"
- extendedWaitUntil:
    visible: '^(?:23 Nov(?:ember)?(?:,)? 2026)$'
    timeout: 30000
- tapOn: '^(?:23 Nov(?:ember)?(?:,)? 2026)$'
- assertVisible:
    id: student-fixture-en-dark
- assertVisible: '^Quizzes 2 · Flashcards 12 · Materials 3$'
- assertVisible: '^Mastery growth 12$'
- takeScreenshot: student-reflections-owned-en-dark
