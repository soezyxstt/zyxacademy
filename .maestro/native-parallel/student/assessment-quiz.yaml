appId: com.zyx.academy.nativeparity
name: Student quiz saves and restores its draft
---
- launchApp:
    clearState: true
- openLink: "zyx-native-parity://student-fixture?scenario=populated&path=%2Fcourses%2Fnative-assessment-course%2Fquiz"
- extendedWaitUntil:
    visible:
      id: student-assessment-native-quiz
    timeout: 30000
- tapOn:
    id: student-assessment-native-quiz
- tapOn:
    id: student-assessment-start
- extendedWaitUntil:
    visible:
      id: student-assessment-option-1
    timeout: 30000
- tapOn:
    id: student-assessment-option-1
- assertVisible: "1/3 Sudah diisi"
- tapOn:
    id: student.back
- tapOn:
    id: student-assessment-native-quiz
- tapOn:
    id: student-assessment-resume
- assertVisible: "1/3 Sudah diisi"
- takeScreenshot: student-assessment-quiz-player
