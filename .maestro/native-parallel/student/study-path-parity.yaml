appId: com.zyx.academy.nativeparity
name: Student study path roadmap and day plan
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=enrolled&theme=light&locale=id&path=%2Fcourses%2Fmatematika-1%2Fpath"
- extendedWaitUntil:
    visible: Lanjutkan belajar
    timeout: 30000
- assertVisible: "Alur belajar: Kalkulus Dasar"
- assertVisible: Lanjutkan belajar
- assertVisible: '.*Perlu diulang, sekitar 8 menit.*'
- assertVisible: '.*Kekontinuan.*'
- assertVisible: '.*Prasyarat: Limit fungsi.*'
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-study-path-roadmap
- tapOn:
    text: Target selesai dalam
    index: 1
- inputText: "7"
- hideKeyboard
- tapOn: Buat rencana
- extendedWaitUntil:
    visible: '.*Hari 1.*'
    timeout: 30000
- assertVisible: '.*Hari 1.*'
- assertVisible: '.*8 menit.*'
- assertVisible: Lihat roadmap
- assertNotVisible: '.*Kekontinuan.*'
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-study-path-plan
- tapOn: Lihat roadmap
- extendedWaitUntil:
    visible: Lanjutkan belajar
    timeout: 30000
- assertVisible: '.*Kekontinuan.*'

- openLink: "zyx-native-parity://student-fixture?scenario=empty&theme=light&locale=id&path=%2Fcourses%2Fmatematika-1%2Fpath"
- extendedWaitUntil:
    visible: 'Alur belajar akan tersedia setelah konten kelas diproses\.'
    timeout: 30000
- assertVisible: "Alur belajar: Kalkulus Dasar"
- assertVisible: 'Alur belajar akan tersedia setelah konten kelas diproses\.'
- assertNotVisible: Buat rencana
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-study-path-empty
