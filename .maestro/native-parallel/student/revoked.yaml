appId: com.zyx.academy.nativeparity
name: Student course revoked fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=revoked"
- extendedWaitUntil:
    visible:
      id: student-course-matematika-1
    timeout: 30000
- tapOn:
    id: student-course-matematika-1
- tapOn:
    id: student-course-open-materials
- assertVisible:
    id: student-material-pengantar
- tapOn:
    id: student-material-catatan-fungsi
- assertVisible:
    id: student-material-locked
- takeScreenshot: student-revoked-locked
