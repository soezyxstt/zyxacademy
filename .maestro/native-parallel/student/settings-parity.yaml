appId: com.zyx.academy.nativeparity
name: Student settings language selection states
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&theme=light&locale=id&path=%2Fsettings"
- extendedWaitUntil:
    visible: Pengaturan
    timeout: 30000
- assertVisible: '^Pengaturan$'
- assertVisible:
    text: '^Umum$'
    selected: true
- assertVisible: '^Bahasa$'
- assertVisible:
    text: '^Bahasa Indonesia$'
    selected: true
- assertVisible:
    text: '^English$'
    selected: false
- takeScreenshot: student-settings-id-light
- tapOn: '^English$'
- extendedWaitUntil:
    visible: 'Bahasa tersimpan\.'
    timeout: 30000
- assertVisible:
    text: '^English$'
    selected: true
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&theme=light&locale=en&path=%2Fsettings"
- extendedWaitUntil:
    visible: '^Settings$'
    timeout: 30000
- assertVisible: '^Settings$'
- assertVisible:
    text: '^General$'
    selected: true
- assertVisible: '^Language$'
- assertVisible:
    text: '^English$'
    selected: true
- assertVisible:
    text: '^Bahasa Indonesia$'
    selected: false
- takeScreenshot: student-settings-en-light
- tapOn: '^Bahasa Indonesia$'
- extendedWaitUntil:
    visible: 'Language saved\.'
    timeout: 30000
- assertVisible:
    text: '^Bahasa Indonesia$'
    selected: true
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&theme=dark&locale=id&path=%2Fsettings"
- extendedWaitUntil:
    visible: Pengaturan
    timeout: 30000
- assertVisible: '^Pengaturan$'
- assertVisible:
    text: '^Umum$'
    selected: true
- assertVisible: '^Bahasa$'
- assertVisible:
    text: '^Bahasa Indonesia$'
    selected: true
- assertVisible:
    text: '^English$'
    selected: false
- takeScreenshot: student-settings-id-dark
- tapOn: '^Tampilan$'
- extendedWaitUntil:
    visible: 'Tema mengikuti pengaturan perangkat\.'
    timeout: 30000
- assertVisible:
    text: '^Tampilan$'
    selected: true
