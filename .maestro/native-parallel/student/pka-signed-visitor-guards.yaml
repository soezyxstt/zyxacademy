appId: com.zyx.academy.nativeparity
name: Student signed Tutorial PKA visitor guards
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000

- openLink: "zyx-native-parity://student-fixture?scenario=pka-signed-visitor&theme=light&locale=id&path=%2Fcourses%2Ftutorial-pka"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Pendaftaran ditutup$'
    timeout: 25000
- assertVisible: '^Bergabung dengan Tutorial PKA$'
- assertNotVisible: '^Persiapan sesi Matematika$'

- openLink: "zyx-native-parity://student-fixture?scenario=pka-signed-visitor&theme=light&locale=id&path=%2Fcourses%2Ftutorial-pka%2Fjadwal"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Pendaftaran ditutup$'
    timeout: 25000
- assertVisible: '^Bergabung dengan Tutorial PKA$'
- assertNotVisible: '^Diskusi limit PKA$'

- openLink: "zyx-native-parity://student-fixture?scenario=pka-signed-visitor&theme=light&locale=id&path=%2Fcourses%2Ftutorial-pka%2Flaporan"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Pendaftaran ditutup$'
    timeout: 25000
- assertVisible: '^Bergabung dengan Tutorial PKA$'
- assertNotVisible: '^Skor terbaik: 85%$'
