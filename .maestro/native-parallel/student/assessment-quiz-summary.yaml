appId: com.zyx.academy.nativeparity
name: Student quiz summaries show released and pending results
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=assessment-signed-results&locale=id&theme=light&path=%2Fcourses%2Fassessment-evidence-mathematics%2Fquiz%2Fassessment-evidence-limit-quiz%2Fsummary%2Fassessment-evidence-quiz-finished"
- extendedWaitUntil:
    visible: 'Ringkasan hasil'
    timeout: 30000
- assertVisible: 'Ringkasan hasil'
- assertVisible: '85%'
- assertVisible: '1/2'
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-assessment-quiz-summary-released
- openLink: "zyx-native-parity://student-fixture?scenario=assessment-signed-results&locale=id&theme=light&path=%2Fcourses%2Fassessment-evidence-mathematics%2Fquiz%2Fassessment-evidence-limit-quiz%2Fsummary%2Fassessment-evidence-quiz-diagnosis-unavailable"
- extendedWaitUntil:
    visible: 'Diagnosis belum tersedia'
    timeout: 30000
- assertVisible: 'Diagnosis belum tersedia'
- assertNotVisible: 'Ringkasan hasil'
- assertNotVisible: '85%'
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-assessment-quiz-summary-analytics-unavailable
- openLink: "zyx-native-parity://student-fixture?scenario=assessment-signed-results&locale=id&theme=light&path=%2Fcourses%2Fassessment-evidence-mathematics%2Fquiz%2Fassessment-evidence-limit-quiz%2Fsummary%2Fassessment-evidence-quiz-grading-pending"
- extendedWaitUntil:
    visible: 'Menunggu penilaian'
    timeout: 30000
- assertVisible: 'Menunggu penilaian'
- assertNotVisible: 'Ringkasan hasil'
- assertNotVisible: '85%'
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-assessment-quiz-summary-grading-pending
