- assertVisible: Dashboard Siswa
- assertVisible: Kelas aktif
- assertVisible: Aktivasi kelas
- assertVisible:
    id: student-course-matematika-1
- assertVisible: Spaced repetition
- assertVisible: Semua kartu tuntas
