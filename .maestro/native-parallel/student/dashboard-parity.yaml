- takeScreenshot: student-dashboard-enrolled
- openLink: "zyx-native-parity://student-fixture?scenario=dashboard-parity-unenrolled"
- extendedWaitUntil:
    visible:
      id: student-dashboard-first-chapter-matematika-1
    timeout: 30000
- assertVisible:
    id: student-dashboard-case-unenrolled
- assertVisible: Dashboard Siswa
- assertVisible: Course untukmu
- assertVisible: Paket Free
- assertVisible: Mulai bab 1
- assertVisible: 0/1 materi
- assertVisible: Sistem bilangan real
- assertVisible: Yang tersedia di Free
- assertNotVisible: Kelas aktif
- assertNotVisible:
