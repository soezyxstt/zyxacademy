appId: com.zyx.academy.nativeparity
name: Student course enrolled fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=enrolled"
- extendedWaitUntil:
    visible:
      id: student-course-matematika-1
    timeout: 30000
- takeScreenshot: student-enrolled-dashboard
- tapOn:
    id: student-course-matematika-1
- tapOn:
    id: student-course-tabs-documents
- extendedWaitUntil:
    visible:
      id: student-material-pengantar
    timeout: 30000
- takeScreenshot: student-enrolled-materials
- assertNotVisible:
    id: student-material-catatan-fungsi
- runFlow:
    when:
      notVisible:
        id: student-documents-tabs-diktat
    commands:
      - tapOn:
          id: student-documents-tabs-more
      - tapOn:
          id: student-documents-tabs-overflow-diktat
- runFlow:
    when:
      visible:
        id: student-documents-tabs-diktat
    commands:
      - tapOn:
          id: student-documents-tabs-diktat
- assertVisible:
    id: student-material-diktat-fungsi
- assertNotVisible:
    id: student-material-pengantar
- runFlow:
    when:
      notVisible:
        id: student-documents-tabs-pdf
    commands:
      - tapOn:
          id: student-documents-tabs-more
      - tapOn:
          id: student-documents-tabs-overflow-pdf
- runFlow:
    when:
      visible:
        id: student-documents-tabs-pdf
    commands:
      - tapOn:
          id: student-documents-tabs-pdf
- assertVisible: 'Dokumen tidak ditemukan'
- tapOn:
    id: student-documents-tabs-all
- assertVisible:
    id: student-material-pengantar
