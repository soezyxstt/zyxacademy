appId: com.zyx.academy.nativeparity
name: Student course enrolled fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=enrolled"
- extendedWaitUntil:
    visible:
      id: student-course-matematika-1
    timeout: 30000
- takeScreenshot: student-enrolled-dashboard
- tapOn:
    id: student-course-matematika-1
- tapOn:
    id: student-course-open-materials
- assertVisible:
    id: student-material-pengantar
- takeScreenshot: student-enrolled-materials
