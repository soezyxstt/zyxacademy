appId: com.zyx.academy.nativeparity
name: Community ranking scope and academic class
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&path=%2Fleaderboard"
- extendedWaitUntil:
    visible:
      id: student-ranking-tab-rank
    timeout: 30000
- tapOn:
    id: student-ranking-filter
- assertVisible: "Global"
- tapOn: "Tutup"
- tapOn:
    id: student-ranking-tab-academic
- assertVisible: "Semua kelas"
- assertVisible: "Matematika I"
- takeScreenshot: student-ranking-academic
