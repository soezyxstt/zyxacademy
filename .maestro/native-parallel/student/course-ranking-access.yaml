appId: com.zyx.academy.nativeparity
name: Student course ranking denied access recovers through course activation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=ranking-parity&theme=light&locale=id&path=%2Fcourses%2Fmatematika-1%2Fleaderboard"
- extendedWaitUntil:
    visible: 5 dari 5
    timeout: 30000
- assertVisible: '.*Nara Putri.*'
- openLink: "zyx-native-parity://student-fixture?scenario=unenrolled&theme=light&locale=id&path=%2Fcourses%2Fmatematika-1%2Fleaderboard"
- extendedWaitUntil:
    visible: 'Konten tidak tersedia atau akses berubah\.'
    timeout: 30000
- assertNotVisible: '.*Nara Putri.*'
- assertNotVisible: '.*Raisa Dewi.*'
- assertNotVisible: '.*Gilang Pratama.*'
- assertNotVisible: Peringkat Anda
- assertNotVisible: 5 dari 5
- assertNotVisible: Coba lagi
- tapOn: Aktifkan kelas
- extendedWaitUntil:
    visible:
      id: student-course-tabs-documents
    timeout: 30000
- assertVisible: Materi artikel, diktat, dan kuis bab pertama terbuka gratis\. Masukkan token kelas untuk membuka seluruh materi, tryout ujian, dan flashcard\.
- openLink: "zyx-native-parity://student-fixture?scenario=unavailable&theme=light&locale=id&path=%2Fcourses%2Fmatematika-1%2Fleaderboard"
- extendedWaitUntil:
    visible: 'Koneksi bermasalah\. Coba lagi\.'
    timeout: 30000
- assertNotVisible: Aktifkan kelas
- tapOn: Coba lagi
- extendedWaitUntil:
    visible: 5 dari 5
    timeout: 30000
