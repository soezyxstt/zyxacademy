appId: com.zyx.academy.nativeparity
name: Student separates participation from academic scores and recovers a failed load
---
- launchApp:
    clearState: true
- openLink: "zyx-native-parity://student-fixture?scenario=unavailable&path=%2Fleaderboard"
- extendedWaitUntil:
    visible: "Coba lagi"
    timeout: 30000
- takeScreenshot: student-community-ranking-recovery
- tapOn: "Coba lagi"
- extendedWaitUntil:
    visible: "#1 Nara Putri"
    timeout: 30000
- assertVisible: "165 XP"
- takeScreenshot: student-community-participation
- tapOn: "Akademik"
- extendedWaitUntil:
    visible: "#1 Nara Putri"
    timeout: 30000
- assertVisible: "94,5"
- assertNotVisible: "165 XP"
- takeScreenshot: student-community-academic
