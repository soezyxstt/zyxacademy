appId: com.zyx.academy.nativeparity
name: Student course offline recovery fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=offline"
- extendedWaitUntil:
    visible:
      id: student-learning-retry
    timeout: 30000
- takeScreenshot: student-offline-error
- tapOn:
    id: student-learning-retry
- assertVisible:
    id: student-course-matematika-1
- takeScreenshot: student-offline-recovered
