appId: com.zyx.academy.nativeparity
name: Student quiz list publication and access states
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=populated&theme=light&locale=id&path=%2Fcourses%2Fnative-assessment-course%2Fquiz"
- extendedWaitUntil:
    visible: 'Latihan kuis: Kalkulus dasar'
    timeout: 30000
- assertVisible:
    id: student-assessment-native-quiz
    text: 'Fungsi, limit, dan turunan, 3 soal · 15 menit · Gratis · Nilai 80%, Mulai'
- assertNotVisible: Aktivasi token kelas
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-quiz-list-published
- openLink: "zyx-native-parity://student-fixture?scenario=locked&theme=light&locale=id&path=%2Fcourses%2Fnative-assessment-course%2Fquiz"
- extendedWaitUntil:
    visible: 'Latihan kuis: Kalkulus dasar'
    timeout: 30000
- assertVisible:
    id: student-assessment-native-quiz
    text: 'Fungsi, limit, dan turunan, 3 soal · 15 menit · Nilai 80%, Terkunci'
- assertVisible: Aktivasi token kelas
- assertVisible: Aktifkan akses
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-quiz-list-locked
- openLink: "zyx-native-parity://student-fixture?scenario=empty&theme=light&locale=id&path=%2Fcourses%2Fnative-assessment-course%2Fquiz"
- extendedWaitUntil:
    visible: 'Latihan kuis: Kalkulus dasar'
    timeout: 30000
- assertVisible: 'Belum ada kuis'
- assertVisible: 'Kuis untuk mata kuliah ini belum tersedia\.'
- assertNotVisible:
    id: student-assessment-native-quiz
- assertVisible:
    id: student-fixture-id-light
- takeScreenshot: student-quiz-list-empty
