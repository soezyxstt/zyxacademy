appId: com.zyx.academy.nativeparity
name: Student course long material list fixture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=long-content"
- extendedWaitUntil:
    visible:
      id: student-course-matematika-1
    timeout: 30000
- tapOn:
    id: student-course-matematika-1
- tapOn:
    id: student-course-tabs-documents
- scrollUntilVisible:
    element:
      id: student-documents-chapter-bab-24
    direction: DOWN
    timeout: 30000
- tapOn:
    id: student-documents-chapter-bab-24
- scrollUntilVisible:
    element:
      id: student-material-bab-24
    direction: DOWN
    timeout: 30000
- takeScreenshot: student-long-content
- tapOn:
    id: student-material-bab-24
- assertVisible: "24. Menentukan domain fungsi komposisi dan menjelaskan syarat pada setiap tahap perhitungan"
- tapOn:
    id: student-learning-back
- extendedWaitUntil:
    visible:
      id: student-material-bab-24
    timeout: 30000
- takeScreenshot: student-long-content-restored
