appId: com.zyx.academy.nativeparity
name: Student signed Tutorial PKA home
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=pka-signed-member&theme=light&locale=id&path=%2Fcourses%2Ftutorial-pka"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Persiapan sesi Matematika$'
    timeout: 25000
- assertVisible: '^Persiapan sesi Matematika$'
- assertVisible: '^Tutorial PKA$'
- assertVisible: '^Disematkan$'
- takeScreenshot: student-pka-home-member
