appId: com.zyx.academy.nativeparity
name: Student dashboard discussion list thread and empty states
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: separator
    timeout: 30000
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&theme=light&locale=id&path=/dashboard/discussions"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Limit kiri dan kanan pada fungsi potongan(?:,.*)?$'
    timeout: 30000
- assertVisible: '^Limit kiri dan kanan pada fungsi potongan(?:,.*)?$'
- assertVisible:
    text: '^Semua kanal$'
    selected: true
- takeScreenshot: student-dashboard-discussions-list
- openLink: "zyx-native-parity://student-fixture?scenario=loaded&theme=light&locale=id&path=/dashboard/discussions&query_channel=channel-math&query_thread=thread-limit&query_message=message-limit"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Pesan yang dibuka$'
    timeout: 30000
- assertVisible: '^Pesan yang dibuka$'
- assertVisible: '^Limit kiri dan kanan pada fungsi potongan$'
- assertVisible: '^Bagaimana cara menentukan limit kiri dan kanan jika nilai fungsi pada titik sambung berbeda\?$'
- takeScreenshot: student-dashboard-discussions-thread
- tapOn: '^Kembali ke diskusi$'
- extendedWaitUntil:
    visible: '^Cari diskusi$'
    timeout: 30000
- assertNotVisible: '^Pesan yang dibuka$'
- openLink: "zyx-native-parity://student-fixture?scenario=empty&theme=light&locale=id&path=/dashboard/discussions"
- extendedWaitUntil:
    visible:
      id: student-fixture-id-light
    timeout: 30000
- assertVisible:
    id: student-fixture-id-light
- extendedWaitUntil:
    visible: '^Belum ada diskusi\.$'
    timeout: 30000
- assertVisible: '^Belum ada diskusi\.$'
- assertVisible:
    text: '^Semua kanal$'
    selected: true
- assertNotVisible: '^Limit kiri dan kanan pada fungsi potongan$'
- takeScreenshot: student-dashboard-discussions-empty
