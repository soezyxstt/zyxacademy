appId: com.zyx.academy.nativeparity
name: Verified Student browser handoff and protected library
---
- launchApp:
    clearState: true
- openLink: "zyx-native-parity://sign-in?next=%2Foffline&locale=id"
- extendedWaitUntil:
    visible: "(Masuk dengan Google|Sign in with Google)"
    timeout: 30000
- tapOn: "(Masuk dengan Google|Sign in with Google)"
- tapOn:
    text: "(Accept & continue|Accept and continue)"
    optional: true
- tapOn:
    text: "(Use without an account|Continue without an account|No thanks)"
    optional: true
- tapOn:
    text: "(Got it|No thanks)"
    optional: true
- extendedWaitUntil:
    visible: Native Preview Sign-in
    timeout: 30000
- tapOn: Runner code
- inputText: ${PREVIEW_CLAIM}
- hideKeyboard
- tapOn: Continue as preview student
- extendedWaitUntil:
    visible:
      id: offline-library-list
    timeout: 45000
- openLink: "zyx-native-parity://sign-out?locale=id"
- extendedWaitUntil:
    visible: '(Kamu sudah keluar\.|You are signed out\.)'
    timeout: 30000
- openLink: "zyx-native-parity://offline?locale=id"
- extendedWaitUntil:
    visible: "(Masuk untuk melihat bacaan Anda|Sign in to see your readings|Hubungkan ke internet untuk memeriksa akses materi Anda.|Connect to the internet to check your access to these materials.)"
    timeout: 30000
- assertNotVisible:
    id: offline-library-list
