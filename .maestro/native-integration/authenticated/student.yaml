appId: com.zyx.academy.nativeparity
name: Verified Student dashboard, inbox acknowledgement and logout
---
- launchApp:
    clearState: true
- openLink: "zyx-native-parity://sign-in?next=%2Fdashboard&locale=id"
- extendedWaitUntil:
    visible:
      id: native-auth-google
    timeout: 30000
- tapOn:
    id: native-auth-google
    enabled: true
- extendedWaitUntil:
    visible: Native Preview Sign-in
    timeout: 30000
- tapOn: Runner code
- inputText: ${PREVIEW_CLAIM}
- tapOn: Continue as preview student
- extendedWaitUntil:
    visible:
      id: student-dashboard-preview
    timeout: 45000
- extendedWaitUntil:
    visible: "(Notifikasi, 1 belum dibaca|Notifications, 1 unread)"
    timeout: 20000
- tapOn:
    id: student-inbox
- extendedWaitUntil:
    visible:
      id: ${PREVIEW_INBOX_ROW}
    timeout: 20000
- assertNotVisible: ".*Private preview update.*"
- tapOn:
    id: ${PREVIEW_INBOX_ROW}
- extendedWaitUntil:
    notVisible:
      id: student-inbox-title
    timeout: 20000
- tapOn:
    id: student-inbox
- extendedWaitUntil:
    visible:
      id: ${PREVIEW_INBOX_ROW}
    timeout: 20000
- assertNotVisible:
    id: student-inbox-mark-all
- tapOn:
    id: student-inbox-close
- runFlow: student-reminders.yaml
- runFlow: student-video.yaml
- openLink: "zyx-native-parity://dashboard"
- extendedWaitUntil:
    visible:
      id: student-navbar-account
    timeout: 30000
- tapOn:
    id: student-navbar-account
- assertVisible: Expo Preview Student
- assertVisible:
    id: role-account-profile
- assertVisible:
    id: role-account-preferences
- assertNotVisible:
    id: role-account-adminPanel
- tapOn:
    id: role-account-sign-out
- extendedWaitUntil:
    visible: '(Kamu sudah keluar\.|You are signed out\.)'
    timeout: 30000
- openLink: "zyx-native-parity://dashboard"
- extendedWaitUntil:
    visible: "(Masuk dengan Google|Sign in with Google)"
    timeout: 30000
- assertNotVisible:
    id: student-inbox
