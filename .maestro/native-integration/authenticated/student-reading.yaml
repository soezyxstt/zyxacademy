appId: com.zyx.academy.nativeparity
name: Student reads a published Article and registered PKA Diktat
---
- openLink: "zyx-native-parity://courses/native-preview-reading-course/material/native-preview-reading-article?section=pembahasan"
- extendedWaitUntil:
    visible: Artikel verifikasi kanonis
    timeout: 30000
- scrollUntilVisible:
    element:
      id: student-open-native-reading
- tapOn:
    id: student-open-native-reading
- extendedWaitUntil:
    visible: ".*Isi artikel kanonis versi tiga.*"
    timeout: 30000
- assertVisible:
    id: student-native-reading-screen
- tapOn: "(Kembali|Back)"
- openLink: "zyx-native-parity://courses/tutorial-pka/material/native-preview-reading-pka-diktat"
- extendedWaitUntil:
    visible: Diktat verifikasi PKA
    timeout: 30000
- scrollUntilVisible:
    element:
      id: student-open-native-reading
- tapOn:
    id: student-open-native-reading
- extendedWaitUntil:
    visible: ".*Isi diktat PKA versi tiga.*"
    timeout: 30000
- tapOn: "(Kembali|Back)"
- runFlow: student-pdf-controls.yaml
