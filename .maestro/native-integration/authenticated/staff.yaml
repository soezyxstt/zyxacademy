appId: com.zyx.academy.nativeparity
name: Sign in as a staff role and open its protected record
---
- launchApp:
    clearState: true
- openLink: "${PREVIEW_SIGN_IN_URL}"
- extendedWaitUntil:
    visible:
      id: native-auth-google
    timeout: 30000
- tapOn:
    id: native-auth-google
    enabled: true
- runFlow: browser-claim.yaml
- runFlow: browser-return.yaml
- extendedWaitUntil:
    visible: ".*${PREVIEW_RECORD}.*"
    timeout: 45000
