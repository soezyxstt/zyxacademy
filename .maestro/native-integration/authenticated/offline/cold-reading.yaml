appId: com.zyx.academy.nativeparity
name: Cold start shows the saved reading while disconnected
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: offline-library-list
    timeout: 30000
- assertVisible: Offline
- assertVisible: "(Hapus|Remove) Diktat verifikasi offline"
- tapOn: "(Buka|Open) Diktat verifikasi offline"
- extendedWaitUntil:
    visible: ".*Materi sintetis untuk verifikasi penyimpanan lokal.*"
    timeout: 30000
