appId: com.zyx.academy.nativeparity
name: Product launch and warm protected links require sign-in
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 30000
- takeScreenshot: guest-product-sign-in
- openLink: zyx-native-parity://sign-up?locale=en
- runFlow:
    when:
      platform: iOS
    file: helpers/accept-ios-private-link.yaml
    env:
      EXPECTED: Sign up with Google
- assertVisible: "Sign up with Google"
- openLink: zyx-native-parity://murid
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 20000
- takeScreenshot: guest-murid
- openLink: zyx-native-parity://sign-up?locale=en
- assertVisible: "Sign up with Google"
- openLink: zyx-native-parity://dashboard
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 20000
- takeScreenshot: guest-dashboard
- openLink: zyx-native-parity://sign-up?locale=en
- assertVisible: "Sign up with Google"
- openLink: zyx-native-parity://courses
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 20000
- takeScreenshot: guest-courses
- openLink: zyx-native-parity://sign-up?locale=en
- assertVisible: "Sign up with Google"
- openLink: zyx-native-parity://tutor
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 20000
- takeScreenshot: guest-tutor
- openLink: zyx-native-parity://sign-up?locale=en
- assertVisible: "Sign up with Google"
- openLink: zyx-native-parity://admin
- extendedWaitUntil:
    visible: "(Sign in with Google|Masuk dengan Google)"
    timeout: 20000
- takeScreenshot: guest-admin
