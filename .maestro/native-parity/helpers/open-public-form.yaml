appId: com.zyx.academy.nativeparity
---
- runFlow:
    when:
      platform: iOS
    file: open-capture.yaml
    env:
      TARGET_ID: parity-capture-public-forms-${CASE_ID}
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: zyx-native-parity://internal/public-forms/${CASE_ID}?frame=1
