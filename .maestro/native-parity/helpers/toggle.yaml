appId: com.zyx.academy.nativeparity
---
# Both platforms expose the fixture value through the control's test ID.
- assertVisible:
    id: ${CONTROL}-unchecked-light-control-off
    text: ${CONTROL_NAME}
    enabled: true
- assertVisible:
    id: ${CONTROL}-checked-light-control-on
    enabled: true
- assertVisible:
    id: ${CONTROL}-disabled-dark-control-on
    enabled: false
- tapOn:
    id: ${CONTROL}-disabled-dark-control-on
- assertVisible:
    id: ${CONTROL}-disabled-dark-control-on
    enabled: false
- tapOn:
    id: ${CONTROL}-unchecked-light-control-off
- assertVisible:
    id: ${CONTROL}-unchecked-light-control-on
- tapOn:
    id: ${CONTROL}-checked-light-control-on
- assertVisible:
    id: ${CONTROL}-checked-light-control-off
# Check the platform's accessibility state separately from the fixture state IDs.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ${CONTROL}-unchecked-light-control-on
          checked: true
      - assertVisible:
          id: ${CONTROL}-checked-light-control-off
          checked: false
      - assertVisible:
          id: ${CONTROL}-disabled-dark-control-on
          checked: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: ${CONTROL}-unchecked-light-control-on
          text: ${IOS_CHECKED_VALUE}
      - assertVisible:
          id: ${CONTROL}-checked-light-control-off
          text: ${IOS_UNCHECKED_VALUE}
      - assertVisible:
          id: ${CONTROL}-disabled-dark-control-on
          text: ${IOS_CHECKED_VALUE}
