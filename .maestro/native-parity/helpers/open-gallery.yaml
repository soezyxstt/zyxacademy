appId: com.zyx.academy.nativeparity
---
- runFlow:
    when:
      platform: iOS
    file: open-capture.yaml
    env:
      TARGET_ID: parity-capture-gallery-${COMPONENT}
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: separator
          timeout: 20000
      - openLink: zyx-native-parity://gallery/${COMPONENT}
