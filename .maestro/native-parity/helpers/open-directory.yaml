appId: com.zyx.academy.nativeparity
---
- runFlow:
    when:
      platform: iOS
    file: open-capture.yaml
    env:
      TARGET_ID: parity-capture-directory-${CASE_ID}
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: zyx-native-parity://internal/public-links/${CASE_ID}
