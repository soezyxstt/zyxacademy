appId: com.zyx.academy.nativeparity
name: Public and short form capture states and accessible controls
---
- launchApp
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: forms-ready
- assertVisible: Pendaftaran tutorial
- assertVisible: Nama peserta
- assertNotVisible:
    id: shared-ui-back
- assertVisible:
    id: public-form-field-0
- assertVisible:
    id: public-form-next
- assertVisible: Bagian 1 / 1
- assertVisible: "0%"
- assertVisible:
    text: Kembali
    enabled: false
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: public-form-exit
      - tapOn:
          id: public-form-exit
      - extendedWaitUntil:
          visible: separator
          timeout: 20000
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: forms-closed
- assertVisible: .*Formulir ditutup.*
- assertVisible: Pendaftaran tutorial
- assertVisible: .*Pendaftaran sesi ini telah berakhir.*
- assertVisible:
    id: public-form-home
- assertNotVisible:
    id: public-form-recheck
- assertNotVisible:
    id: shared-ui-back
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: forms-missing
- assertVisible: .*Formulir tidak ditemukan.*
- assertVisible: Kembali ke beranda
- assertNotVisible:
    id: shared-ui-back
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: short-collision
- assertVisible: Pendaftaran tutorial
- assertVisible: Nama peserta
- assertNotVisible: Gabung Google Meet
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: short-meeting
- assertVisible: Google Meet
- assertVisible: Gabung Google Meet
- runFlow:
    file: helpers/open-public-form.yaml
    env:
      CASE_ID: short-missing
- assertVisible: .*Formulir tidak ditemukan.*
- assertVisible: Kembali ke beranda
- tapOn:
    id: public-form-home
- extendedWaitUntil:
    visible: separator
    timeout: 20000
- runFlow:
    when:
      platform: Android
    file: helpers/public-form-question-flow.yaml
