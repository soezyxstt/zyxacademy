appId: com.zyx.academy.nativeparity
name: Avatar photo, image error and initials
---
- runFlow:
    file: helpers/open-gallery.yaml
    env:
      COMPONENT: avatar
- extendedWaitUntil:
    visible:
      id: avatar-image-light-loaded
      text: Foto profil Adi
    timeout: 10000
- assertVisible:
    id: avatar-error-light-error
    text: Foto profil Bima
- assertVisible:
    id: avatar-initials-dark-idle
    text: Foto profil Dita Putri Sari
