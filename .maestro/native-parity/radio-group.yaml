appId: com.zyx.academy.nativeparity
name: Radio group selection and disabled state
---
- runFlow:
    file: helpers/open-gallery.yaml
    env:
      COMPONENT: radio-group
- assertVisible:
    id: radio-group-unchecked-light-standard-off
    text: Standar
    enabled: true
- assertVisible:
    id: radio-group-unchecked-light-exam-off
    text: Ketik jawaban
    enabled: true
- tapOn:
    id: radio-group-unchecked-light-standard-off
- assertVisible:
    id: radio-group-unchecked-light-standard-on
- tapOn:
    id: radio-group-unchecked-light-standard-on
- assertVisible:
    id: radio-group-unchecked-light-standard-on
- assertVisible:
    id: radio-group-checked-light-standard-on
- tapOn:
    id: radio-group-checked-light-exam-off
- assertVisible:
    id: radio-group-checked-light-standard-off
- assertVisible:
    id: radio-group-checked-light-exam-on
- assertVisible:
    id: radio-group-disabled-dark-standard-on
    enabled: false
- assertVisible:
    id: radio-group-disabled-dark-exam-off
    enabled: false
- tapOn:
    id: radio-group-disabled-dark-exam-off
- assertVisible:
    id: radio-group-disabled-dark-standard-on
- assertVisible:
    id: radio-group-disabled-dark-exam-off
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: radio-group-checked-light-standard-off
          checked: false
      - assertVisible:
          id: radio-group-checked-light-exam-on
          checked: true
      - assertVisible:
          id: radio-group-disabled-dark-standard-on
          checked: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: radio-group-checked-light-standard-off
          text: radio button, unchecked
      - assertVisible:
          id: radio-group-checked-light-exam-on
          text: radio button, checked
      - assertVisible:
          id: radio-group-disabled-dark-standard-on
          text: radio button, checked
