name = "zyx-vector-api"
main = "index.ts"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

[observability.traces]
enabled = true

# Production environment. Keep the legacy 1024-dimensional binding for rollback
# while the 768-dimensional canonical and search indexes are provisioned.
[[vectorize]]
binding = "VECTORIZE"
index_name = "zyx-edu"

[[vectorize]]
binding = "VECTORIZE_V2"
index_name = "zyx-vectors-production-v2"

[[vectorize]]
binding = "VECTORIZE_SEARCH"
index_name = "zyx-site-search-production"

# Staging environment
# Deploy via: npx wrangler deploy --env staging
# Secret via: npx wrangler secret put SHARED_SECRET --env staging
[env.staging]
name = "zyx-vector-api-staging"

[env.staging.vars]
RESTRICTED_SOLUTION_CAPABILITY = "read:published_solutions"

[[env.staging.vectorize]]
binding = "VECTORIZE_V2"
index_name = "zyx-vectors-staging-v2"

[[env.staging.vectorize]]
binding = "VECTORIZE_SEARCH"
index_name = "zyx-site-search-staging"

# Background execution uses a separate credential; the live web endpoint is unchanged.
[env.background]
name = "zyx-vector-api-background"
account_id = "06d62d8a9335fed189a6a59fda0a4f48"

[[env.background.vectorize]]
binding = "VECTORIZE_V2"
index_name = "zyx-vectors-production-v2"

[[env.background.vectorize]]
binding = "VECTORIZE_SEARCH"
index_name = "zyx-site-search-production"
