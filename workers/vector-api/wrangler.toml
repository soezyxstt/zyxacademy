name = "zyx-vector-api"
main = "index.ts"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

# Production environment (Default)
# Deploy via: npx wrangler deploy
[[vectorize]]
binding = "VECTORIZE"
index_name = "zyx-edu"

# Staging environment
# Deploy via: npx wrangler deploy --env staging
# Secret via: npx wrangler secret put SHARED_SECRET --env staging
[env.staging]
name = "zyx-vector-api-staging"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "zyx-edu-staging"

