name = "zyx-vector-api"
main = "index.ts"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

# Staging environment
# Deploy via: npx wrangler deploy --env staging
# Secret via: npx wrangler secret put SHARED_SECRET --env staging
[env.staging]
name = "zyx-vector-api-staging"

[env.staging.vars]
RESTRICTED_SOLUTION_CAPABILITY = "read:published_solutions"

[[env.staging.vectorize]]
binding = "VECTORIZE_V2"
index_name = "zyx-vectors-staging-v2"


