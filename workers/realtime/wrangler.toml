name = "zyxrealtime"
main = "src/index.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

[observability.traces]
enabled = true

[[durable_objects.bindings]]
name = "LIVE_QUIZ_ROOM"
class_name = "LiveQuizRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveQuizRoom"]

# LIVE_HMAC_SECRET must be configured with Wrangler's secret store:
#   wrangler secret put LIVE_HMAC_SECRET
[vars]
NEXT_APP_URL = "https://www.zyxacademy.com"
