<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Denah museum</title><style>:root { color-scheme: light; --background: #fff; --foreground: #172f29; --primary: #176955; --primary-foreground: #fff; --muted: #e1eee6; --muted-foreground: #65776d; --border: #c9d6ce; --accent: #c88127; }
:root[data-theme="dark"] { color-scheme: dark; --background: #17231f; --foreground: #e4eee8; --primary: #86d5b6; --primary-foreground: #17352b; --muted: #30473d; --muted-foreground: #a9beb1; --border: #52675b; --accent: #e8ac5e; }
* { box-sizing: border-box; } body { margin: 0; background: transparent; color: var(--foreground); font: 14px/1.4 system-ui, sans-serif; } main { padding: 8px; max-width: 900px; margin: 0 auto; } svg { display: block; width: 100%; max-width: 620px; height: auto; margin: auto; fill: var(--foreground); } svg text { font-size: 16px; font-family: system-ui, sans-serif; } svg [role="button"] { cursor: pointer; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; } svg [role="button"]:focus-visible rect { stroke: var(--accent); stroke-width: 5; } .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; } label { display: inline-flex; align-items: center; gap: 6px; } input[type="range"] { width: 105px; accent-color: var(--primary); } button, select { color: inherit; background: var(--background); border: 1px solid var(--border); border-radius: 5px; padding: 6px 9px; font: inherit; } button:disabled { opacity: .5; } p { margin: 8px 0 0; }
main[data-mechanics] p, main[data-sampling-fixture] p { font-size: 16px; }
main[data-mechanics] input, main[data-sampling-fixture] input { font: inherit; }
.fbd-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,380px),1fr)); gap: 8px; margin-top: 12px; } [data-formula], [data-definitions] { overflow-x: auto; line-height: 2; }

[data-room] text { font-size: 22px; }
[data-sampling] text { font-size: 21px; }
@media print {
  main { max-width: 740px; padding: 12px; }
  button, input, select, .controls label, [data-reduced-notice] { display: none !important; }
  [role="button"] { pointer-events: none; }
  .fbd-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  details > :not(summary) { display: block !important; }
  details > summary { display: none; }
  [data-formula], [data-definitions] { font-size: 13px; }
}
</style></head><body><main></main><script>"use strict";
(() => {
  // tests/visual/fixtures/rich-documents/shared.js
  function setup() {
    const root = document.querySelector("main");
    let last = 0, queued = false, frame = 0;
    const send = () => {
      queued = false;
      const height = Math.ceil(root.getBoundingClientRect().height);
      if (height !== last) {
        last = height;
        parent.postMessage({ type: "zyx:resize", height }, "*");
      }
    };
    const observer = new ResizeObserver(() => {
      if (!queued) {
        queued = true;
        frame = requestAnimationFrame(send);
      }
    });
    observer.observe(root);
    addEventListener("pagehide", () => {
      observer.disconnect();
      cancelAnimationFrame(frame);
    }, { once: true });
    addEventListener("message", (event) => {
      if (event.source !== parent || event.data?.type !== "zyx:preferences") return;
      if (event.data.theme === "light" || event.data.theme === "dark") document.documentElement.dataset.theme = event.data.theme;
      if (typeof event.data.reducedMotion === "boolean") document.documentElement.dataset.reducedMotion = String(event.data.reducedMotion);
    });
  }

  // tests/visual/fixtures/rich-documents/models.js
  var edges = [[1, 2], [1, 3], [2, 3], [2, 4], [3, 4], [3, 5], [4, 7], [5, 6], [6, 7]];
  var linked = (a, b) => edges.some(([x, y]) => x === a && y === b || x === b && y === a);
  var rotorStations = { damper: 1 / 4, beamCenter: 1 / 2, machine: 1 };

  // tests/visual/fixtures/rich-documents/museum.js
  setup();
  var rects = { 1: [60, 30, 120, 70], 2: [60, 100, 120, 190], 3: [180, 30, 120, 160], 4: [180, 190, 120, 100], 5: [300, 30, 120, 100], 6: [300, 130, 120, 75], 7: [300, 205, 120, 85] };
  var centers = { 1: [120, 65], 2: [120, 220], 3: [240, 110], 4: [240, 240], 5: [360, 80], 6: [360, 167], 7: [360, 248] };
  var doors = { "1-2": [120, 100, "h"], "1-3": [180, 65, "v"], "2-3": [180, 145, "v"], "2-4": [180, 235, "v"], "3-4": [240, 190, "h"], "3-5": [300, 70, "v"], "4-7": [300, 235, "v"], "5-6": [360, 130, "h"], "6-7": [360, 205, "h"] };
  var main = document.querySelector("main");
  var path = [2];
  var message = "";
  main.innerHTML = '<svg viewBox="0 0 500 315" aria-label="Denah museum dengan pintu dan jejak" role="group"></svg><div class="controls"><button data-undo>Mundur</button><button data-reset>Ulangi</button><span data-path></span></div><p role="status" aria-live="polite"></p>';
  var svg = main.querySelector("svg");
  var undo = main.querySelector("[data-undo]");
  var status = main.querySelector('[role="status"]');
  function draw(focus) {
    const current = path.at(-1), available = edges.filter((e) => e.includes(current)).map((e) => e[0] === current ? e[1] : e[0]).filter((n) => !path.includes(n));
    let shapes = Object.entries(rects).map(([n, [x, y, w, h]]) => `<g role="button" tabindex="0" data-room="${n}" ${+n === current ? 'aria-current="location"' : ""} aria-label="Ruang ${n}${+n === current ? ", posisi sekarang" : path.includes(+n) ? ", sudah dilalui" : ""}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${+n === current ? "var(--primary)" : path.includes(+n) ? "var(--muted)" : "var(--background)"}" stroke="var(--foreground)" stroke-width="2"/><text x="${x + 20}" y="${y + 29}" fill="${+n === current ? "var(--primary-foreground)" : "var(--foreground)"}">${n}</text></g>`).join("");
    shapes += edges.map(([a, b]) => {
      const [x, y, d] = doors[`${a}-${b}`];
      return `<line x1="${x - (d === "h" ? 15 : 0)}" y1="${y - (d === "v" ? 15 : 0)}" x2="${x + (d === "h" ? 15 : 0)}" y2="${y + (d === "v" ? 15 : 0)}" stroke="var(--background)" stroke-width="7"/>`;
    }).join("");
    shapes += path.slice(1).map((n, i) => {
      const prev = path[i], door = doors[[Math.min(prev, n), Math.max(prev, n)].join("-")];
      return `<polyline points="${centers[prev]} ${door[0]},${door[1]} ${centers[n]}" fill="none" stroke="var(--accent)" stroke-width="6" pointer-events="none"/>`;
    }).join("");
    shapes += `<line x1="60" y1="205" x2="60" y2="240" stroke="var(--background)" stroke-width="7"/><line x1="420" y1="64" x2="420" y2="96" stroke="var(--background)" stroke-width="7"/><text x="0" y="235" font-size="20">Masuk</text><text x="425" y="85" font-size="20">Keluar</text>`;
    svg.innerHTML = shapes;
    undo.disabled = path.length === 1;
    main.querySelector("[data-path]").textContent = path.join(" > ");
    status.textContent = message || (path.length === 7 ? current === 5 ? "Semua ruang dilalui satu kali hingga pintu keluar." : `Semua ruang dilalui, tetapi ruang ${current} bukan pintu keluar. Pintu keluar berada di ruang 5.` : available.length ? `Pintu berikutnya: ${available.join(", ")}.` : "Tidak ada ruang baru yang dapat dicapai.");
    if (focus) main.querySelector(focus === "[data-undo]" && undo.disabled ? `[data-room="${current}"]` : focus)?.focus();
  }
  function select(n) {
    const prev = path.at(-1);
    if (path.includes(n)) message = `Ruang ${n} sudah dilalui.`;
    else if (!linked(prev, n)) message = `Tidak ada pintu dari ruang ${prev} ke ruang ${n}.`;
    else {
      path.push(n);
      message = "";
    }
    draw(`[data-room="${n}"]`);
  }
  main.addEventListener("click", (e) => {
    const room = e.target.closest("[data-room]");
    if (room) select(+room.dataset.room);
    else if (e.target.closest("[data-undo]")) {
      if (path.length > 1) path.pop();
      message = "";
      draw("[data-undo]");
    } else if (e.target.closest("[data-reset]")) {
      path = [2];
      message = "";
      draw("[data-reset]");
    }
  });
  main.addEventListener("keydown", (e) => {
    const room = e.target.closest("[data-room]");
    if (room && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      select(+room.dataset.room);
    }
  });
  draw();
})();
</script></body></html>
