<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mesin susu</title><style>:root { color-scheme: light; --background: #fff; --foreground: #172f29; --primary: #176955; --primary-foreground: #fff; --muted: #e1eee6; --muted-foreground: #65776d; --border: #c9d6ce; --accent: #c88127; }
:root[data-theme="dark"] { color-scheme: dark; --background: #17231f; --foreground: #e4eee8; --primary: #86d5b6; --primary-foreground: #17352b; --muted: #30473d; --muted-foreground: #a9beb1; --border: #52675b; --accent: #e8ac5e; }
* { box-sizing: border-box; } body { margin: 0; background: transparent; color: var(--foreground); font: 14px/1.4 system-ui, sans-serif; } main { padding: 8px; max-width: 900px; margin: 0 auto; } svg { display: block; width: 100%; max-width: 620px; height: auto; margin: auto; fill: var(--foreground); } svg text { font-size: 16px; font-family: system-ui, sans-serif; } svg [role="button"] { cursor: pointer; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; } svg [role="button"]:focus-visible rect { stroke: var(--accent); stroke-width: 5; } .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; } label { display: inline-flex; align-items: center; gap: 6px; } input[type="range"] { width: 105px; accent-color: var(--primary); } button, select { color: inherit; background: var(--background); border: 1px solid var(--border); border-radius: 5px; padding: 6px 9px; font: inherit; } button:disabled { opacity: .5; } p { margin: 8px 0 0; }
main[data-mechanics] p, main[data-sampling-fixture] p { font-size: 16px; }
main[data-mechanics] input, main[data-sampling-fixture] input { font: inherit; }
.fbd-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,380px),1fr)); gap: 8px; margin-top: 12px; } [data-formula], [data-definitions] { overflow-x: auto; line-height: 2; }

[data-room] text { font-size: 22px; }
[data-sampling] text { font-size: 21px; }
@media print {
  main { max-width: 740px; padding: 12px; }
  button, input, select, .controls label, [data-reduced-notice] { display: none !important; }
  [role="button"] { pointer-events: none; }
  .fbd-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  details > :not(summary) { display: block !important; }
  details > summary { display: none; }
  [data-formula], [data-definitions] { font-size: 13px; }
}
</style></head><body><main></main><script>"use strict";
(() => {
  // tests/visual/fixtures/rich-documents/shared.js
  function setup() {
    const root = document.querySelector("main");
    let last = 0, queued = false, frame = 0;
    const send = () => {
      queued = false;
      const height = Math.ceil(root.getBoundingClientRect().height);
      if (height !== last) {
        last = height;
        parent.postMessage({ type: "zyx:resize", height }, "*");
      }
    };
    const observer2 = new ResizeObserver(() => {
      if (!queued) {
        queued = true;
        frame = requestAnimationFrame(send);
      }
    });
    observer2.observe(root);
    addEventListener("pagehide", () => {
      observer2.disconnect();
      cancelAnimationFrame(frame);
    }, { once: true });
    addEventListener("message", (event) => {
      if (event.source !== parent || event.data?.type !== "zyx:preferences") return;
      if (event.data.theme === "light" || event.data.theme === "dark") document.documentElement.dataset.theme = event.data.theme;
      if (typeof event.data.reducedMotion === "boolean") document.documentElement.dataset.reducedMotion = String(event.data.reducedMotion);
    });
  }

  // tests/visual/fixtures/rich-documents/models.js
  var milkMachine = (a2, b2) => !(a2 || b2);
  var rotorStations = { damper: 1 / 4, beamCenter: 1 / 2, machine: 1 };

  // tests/visual/fixtures/rich-documents/milk.js
  setup();
  var main = document.querySelector("main");
  var a = false;
  var b = false;
  var width = 0;
  var word = (v) => v ? "Putih" : "Cokelat";
  var color = (v) => v ? "#fff2c4" : "#9c663e";
  var pipe = (d, v) => `<path d="${d}" fill="none" stroke="var(--muted-foreground)" stroke-width="13" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${color(v)}" stroke-width="8" stroke-linejoin="round"/>`;
  var machine = (x, y, label) => `<rect x="${x - 42}" y="${y}" width="84" height="52" rx="8" fill="var(--muted)" stroke="var(--foreground)"/><text x="${x}" y="${y + 21}" text-anchor="middle" style="font-size:13px"><tspan x="${x}">Mesin</tspan><tspan x="${x}" dy="17">${label}</tspan></text>`;
  var input = (x, id, value, label) => `<g role="button" tabindex="0" data-milk="${id}" aria-label="Susu masukan ${label}: ${word(value)}. Ganti warna" aria-pressed="${value}"><rect x="${x - 46}" y="3" width="92" height="32" rx="6" fill="${color(value)}" stroke="var(--foreground)" stroke-width="2"/><text x="${x - 8}" y="24" text-anchor="middle" style="font-size:13px" fill="${value ? "#22332d" : "white"}">${word(value)}</text><path data-change-icon d="M${x + 25} 13h12l-4 -4m4 4l-4 4 M${x + 37} 25h-12l4 -4m-4 4l4 4" fill="none" stroke="${value ? "#22332d" : "white"}" stroke-width="1.5" pointer-events="none"/></g>`;
  main.innerHTML = `<style>@media print{[data-change-icon]{display:none} [data-milk] text{transform:translateX(8px)}}</style><svg role="group" aria-label="Dua masukan susu bercabang ke mesin atas lalu ke mesin akhir"></svg><div class="controls"><button data-reset>Ulangi</button></div><p>Setiap mesin menghasilkan putih jika kedua masukannya cokelat. Pasangan lainnya menghasilkan cokelat.</p><p role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)"></p>`;
  var svg = main.querySelector("svg");
  var status = main.querySelector('[role="status"]');
  function draw(focus) {
    if (!width) return;
    const left = 48, right = width - 48, center = width / 2, l = milkMachine(a, a), r = milkMachine(b, b), out = milkMachine(l, r);
    svg.setAttribute("viewBox", `0 0 ${width} 336`);
    svg.innerHTML = `${pipe(`M${left} 35V62H${left - 20}V86`, a)}${pipe(`M${left} 62H${left + 20}V86`, a)}${pipe(`M${right} 35V62H${right - 20}V86`, b)}${pipe(`M${right} 62H${right + 20}V86`, b)}${machine(left, 86, "kiri")}${machine(right, 86, "kanan")}${pipe(`M${left} 138V162H${center - 20}V217`, l)}${pipe(`M${right} 138V162H${center + 20}V217`, r)}<text x="${left}" y="190" text-anchor="middle" style="font-size:13px">${word(l)}</text><text x="${right}" y="190" text-anchor="middle" style="font-size:13px">${word(r)}</text>${machine(center, 217, "akhir")}${pipe(`M${center} 269V290`, out)}<rect x="${center - 46}" y="290" width="92" height="36" rx="6" fill="${color(out)}" stroke="var(--foreground)"/><text x="${center}" y="313" text-anchor="middle" style="font-size:13px" fill="${out ? "#22332d" : "white"}">${word(out)}</text>${input(left, "a", a, "kiri")}${input(right, "b", b, "kanan")}`;
    status.textContent = `Masukan kiri ${word(a)}, kanan ${word(b)}. Mesin kiri ${word(l)}, kanan ${word(r)}. Hasil akhir ${word(out)}.`;
    if (focus) main.querySelector(focus)?.focus();
  }
  function toggle(id) {
    if (id === "a") a = !a;
    else b = !b;
    draw(`[data-milk="${id}"]`);
  }
  main.addEventListener("click", (e) => {
    const target = e.target.closest("[data-milk]");
    if (target) toggle(target.dataset.milk);
    else if (e.target.closest("[data-reset]")) {
      a = false;
      b = false;
      draw("[data-reset]");
    }
  });
  main.addEventListener("keydown", (e) => {
    const target = e.target.closest("[data-milk]");
    if (target && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      toggle(target.dataset.milk);
    }
  });
  var observer = new ResizeObserver((entries) => {
    const next = Math.min(620, entries[0].contentRect.width);
    if (next > 0 && next !== width) {
      const focused = document.activeElement?.dataset.milk;
      width = next;
      draw(focused ? `[data-milk="${focused}"]` : void 0);
    }
  });
  observer.observe(main);
  addEventListener("pagehide", () => observer.disconnect(), { once: true });
})();
</script></body></html>
