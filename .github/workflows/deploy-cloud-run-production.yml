name: Deploy production web to Cloud Run

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect production, build a candidate, promote, or roll back
        required: true
        type: choice
        default: candidate
        options: [inventory, inspect-runtime, candidate, promote, rollback]
      revision:
        description: Exact verified revision for promote or rollback
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/main' && inputs.operation == 'inventory'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect production Vercel control plane without mutation
        env:
          CONTROL_PLANE_OPERATION: ${{ inputs.operation }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 .github/scripts/production_control_plane.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-control-plane-inventory
          path: artifacts/cloud-run-production/control-plane-*.json
          retention-days: 7

  queue-inventory:
    if: github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/main' && inputs.operation == 'inventory'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: zyx-academy
          workload_identity_provider: projects/307641710075/locations/global/workloadIdentityPools/zyx-web-production/providers/github
          service_account: zyx-production-web-ci@zyx-academy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 520.0.0'
      - name: Inspect production queues and Scheduler without mutation
        shell: bash
        run: |
          set -euo pipefail
          gcloud_args=(--quiet --project zyx-academy --location asia-southeast1)
          failed=0
          for queue in zyx-production-default zyx-production-pdf; do
            printf 'Queue %s\n' "$queue"
            if ! gcloud tasks queues describe "$queue" "${gcloud_args[@]}" --format='json(state,retryConfig.maxAttempts)' 2>/dev/null; then
              printf 'QUEUE_READ_FAILED\n'
              failed=1
              continue
            fi
            if ! gcloud tasks list --queue "$queue" "${gcloud_args[@]}" --limit=100 \
              --format='json(dispatchCount,responseCount,lastAttempt.responseStatus.code)' 2>/dev/null | jq 'group_by([.dispatchCount // 0,.responseCount // 0,.lastAttempt.responseStatus.code // null]) | map({count:length,dispatches:(.[0].dispatchCount // 0),responses:(.[0].responseCount // 0),code:(.[0].lastAttempt.responseStatus.code // null)})'; then
              printf 'TASK_STATUS_READ_FAILED\n'
              failed=1
            fi
          done
          if ! gcloud scheduler jobs describe zyx-production-dispatcher "${gcloud_args[@]}" --format='json(state,schedule,status.code)' 2>/dev/null; then
            printf 'SCHEDULER_READ_FAILED\n'
            failed=1
          fi
          exit "$failed"

  release:
    if: github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/main' && (inputs.operation == 'inspect-runtime' || inputs.operation == 'candidate' || inputs.operation == 'promote' || inputs.operation == 'rollback')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_ENVIRONMENT: production
      CLOUD_RUN_OPERATION: ${{ inputs.operation }}
      CLOUD_RUN_REVISION: ${{ inputs.revision }}
      CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER: projects/307641710075/locations/global/workloadIdentityPools/zyx-web-production/providers/github
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check release contracts
        env:
          CLOUD_RUN_ENVIRONMENT: staging
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test deploy/cloud-run/*.test.mjs workers/staging-web-edge/index.test.mjs
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: zyx-academy
          workload_identity_provider: ${{ env.CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: zyx-production-web-ci@zyx-academy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 520.0.0'
      - name: Prepare production runtime and public build configuration
        if: inputs.operation == 'candidate' || inputs.operation == 'inspect-runtime'
        env:
          GITHUB_RUNTIME_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_RUNTIME_VARS: ${{ toJSON(vars) }}
        run: python3 .github/scripts/prepare_cloud_run_production.py
      - name: Validate dispatch and production origin
        if: inputs.operation == 'candidate'
        run: |
          export CLOUD_RUN_PUBLIC_CONFIG="$(cat "$RUNNER_TEMP/cloud-run-public.json")"
          python3 .github/scripts/deploy_cloud_run_staging.py preflight
      - name: Build and smoke-test production image
        if: inputs.operation == 'candidate'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          image="zyx-production-web:$GITHUB_SHA"
          build_secrets=(--secret "id=public_config,src=$RUNNER_TEMP/cloud-run-public.json")
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            build_secrets+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi
          docker build --platform linux/amd64 --file Dockerfile.cloud-run \
            --build-arg CLOUD_RUN_BUILD_ENVIRONMENT=production \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "CLOUD_RUN_BUILD_ID=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${build_secrets[@]}" --tag "$image" .
          bash .github/scripts/smoke-cloud-run.sh "$image"
      - name: Release only to verified production service
        if: inputs.operation != 'inspect-runtime'
        run: |
          if [[ "$CLOUD_RUN_OPERATION" == candidate ]]; then
            export CLOUD_RUN_PUBLIC_CONFIG="$(cat "$RUNNER_TEMP/cloud-run-public.json")"
          fi
          python3 .github/scripts/deploy_cloud_run_staging.py release
      - name: Remove private runner configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-run-runtime.json" "$RUNNER_TEMP/cloud-run-spec.json" "$RUNNER_TEMP/cloud-run-secret-refs.txt" "$RUNNER_TEMP/cloud-run-public.json"
