name: Desktop native checks

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Compile and test desktop Rust code
        working-directory: apps/desktop/src-tauri
        run: cargo +stable test --locked --lib
