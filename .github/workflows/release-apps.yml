name: Release Apps (Desktop & Mobile)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (nightly -> staging.zyxacademy.com, stable -> www.zyxacademy.com)"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - stable
      version:
        description: "Optional version override (nightly auto-increments as 0.1.0-alpha.<run_number>; stable defaults to apps/desktop/package.json)"
        required: false
        type: string
      stable_operation:
        description: "Stable only: build a private candidate or publish a verified candidate"
        required: true
        type: choice
        default: candidate
        options: [candidate, publish]
      stable_candidate_run_id:
        description: "Stable publish only: successful candidate workflow run ID"
        type: string
      stable_candidate_checksums_sha256:
        description: "Stable publish only: SHA-256 of the tested candidate SHA256SUMS.txt"
        type: string
      stable_runtime_smoke_passed:
        description: "Stable publish only: exact candidate APK and EXE installed and launched successfully"
        type: boolean
        default: false
      android_candidate:
        description: "Build only an Android APK artifact without publishing a release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-apps-${{ github.ref }}-${{ inputs.channel || 'auto' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      default_url: ${{ steps.meta.outputs.default_url }}
      file_prefix: ${{ steps.meta.outputs.file_prefix }}
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          STABLE_OPERATION: ${{ inputs.stable_operation }}
          STABLE_CANDIDATE_RUN_ID: ${{ inputs.stable_candidate_run_id }}
          STABLE_CANDIDATE_CHECKSUMS_SHA256: ${{ inputs.stable_candidate_checksums_sha256 }}
          STABLE_RUNTIME_SMOKE_PASSED: ${{ inputs.stable_runtime_smoke_passed }}
          ANDROID_CANDIDATE: ${{ inputs.android_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          CORE_VERSION="${PKG_VERSION%%-*}"
          DATE_STAMP=$(date -u +%Y%m%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="${INPUT_CHANNEL:-nightly}"
            if [[ -n "$INPUT_VERSION" ]]; then
              VERSION="$INPUT_VERSION"
            elif [[ "$CHANNEL" == "nightly" ]]; then
              VERSION="${CORE_VERSION}-alpha.${RUN_NUMBER}"
            else
              VERSION="$PKG_VERSION"
            fi
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            CHANNEL="stable"
            VERSION="$PKG_VERSION"
          else
            CHANNEL="nightly"
            VERSION="${CORE_VERSION}-alpha.${RUN_NUMBER}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$CHANNEL" == "nightly" && "$GITHUB_REF" != "refs/heads/staging" ]]; then
            echo "::error::Nightly releases must be built from staging."
            exit 1
          fi
          if [[ "$CHANNEL" == "nightly" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Enter a valid release version."
            exit 1
          fi

          if [[ "$CHANNEL" == "stable" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || "$ANDROID_CANDIDATE" == "true" ]]; then
              echo "::error::Stable releases must use the full candidate flow on main."
              exit 1
            fi
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Stable requires a non-prerelease semantic version, e.g. 0.1.0."
              exit 1
            fi
            if [[ "$STABLE_OPERATION" == "publish" ]]; then
              if [[ "$STABLE_RUNTIME_SMOKE_PASSED" != "true" ]]; then
                echo "::error::Confirm Android and Windows install/launch smoke on the exact candidate before publication."
                exit 1
              fi
              if [[ ! "$STABLE_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$STABLE_CANDIDATE_CHECKSUMS_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
                echo "::error::Publishing requires the candidate run ID and the tested candidate checksums file SHA-256."
                exit 1
              fi
            elif [[ -n "$STABLE_CANDIDATE_RUN_ID" || -n "$STABLE_CANDIDATE_CHECKSUMS_SHA256" || "$STABLE_RUNTIME_SMOKE_PASSED" == "true" ]]; then
              echo "::error::Candidate run ID, checksums digest and runtime smoke confirmation are publish-only inputs."
              exit 1
            fi
          fi

          if [[ "$CHANNEL" == "nightly" ]]; then
            TAG="app-v${VERSION}-nightly.${DATE_STAMP}.${SHORT_SHA}"
            RELEASE_TITLE="Zyx Academy Nightly v${VERSION} (${DATE_STAMP})"
            PRERELEASE="true"
            DEFAULT_URL="https://staging.zyxacademy.com"
            FILE_PREFIX="zyx-academy-nightly-${VERSION}-${DATE_STAMP}"
            BUILD_ID="${SHORT_SHA}"
          else
            BASE_TAG="app-v${VERSION}"
            if gh release view "$BASE_TAG" >/dev/null 2>&1; then
              echo "::error::This stable version already has a release. Choose a higher version."
              exit 1
            fi
            TAG="$BASE_TAG"
            RELEASE_TITLE="Zyx Academy v${VERSION}"
            FILE_PREFIX="zyx-academy-${VERSION}"
            BUILD_ID="b${RUN_NUMBER}"
            PRERELEASE="false"
            DEFAULT_URL="https://www.zyxacademy.com"
          fi

          {
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "release_title=${RELEASE_TITLE}"
            echo "prerelease=${PRERELEASE}"
            echo "default_url=${DEFAULT_URL}"
            echo "file_prefix=${FILE_PREFIX}"
            echo "build_id=${BUILD_ID}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved release: channel=${CHANNEL}, version=${VERSION}, tag=${TAG}, build_id=${BUILD_ID}, title=${RELEASE_TITLE}"

  build-desktop:
    if: inputs.android_candidate != true && !(inputs.channel == 'stable' && inputs.stable_operation == 'publish')
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            arch: aarch64
          - platform: windows
            os: windows-latest
            arch: x64
          - platform: linux
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Build Tauri desktop bundle (${{ needs.prepare.outputs.channel }})
        working-directory: apps/desktop
        env:
          ZYX_APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ZYX_APP_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ZYX_APP_CHANNEL" == stable && ( -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_UPDATER_PUBKEY" ) ]]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY
            echo "::notice::Signed desktop updater is not configured; building installer fallback only."
          fi
          npm run "build:$ZYX_APP_CHANNEL"

      - name: Collect desktop installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          PREFIX="${{ needs.prepare.outputs.file_prefix }}-${{ matrix.platform }}-${{ matrix.arch }}"

          copy_first() {
            local pattern="$1"
            local ext="$2"
            local found
            found=$(find "$BUNDLE_DIR" -type f -name "$pattern" | head -n 1 || true)
            if [[ -n "$found" ]]; then
              cp "$found" "release-artifacts/${PREFIX}.${ext}"
              echo "Packaged: release-artifacts/${PREFIX}.${ext}"
            fi
          }

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            copy_first "*.exe" "exe"
            copy_first "*.exe.sig" "exe.sig"
            copy_first "*.msi" "msi"
            copy_first "*.nsis.zip" "nsis.zip"
            copy_first "*.nsis.zip.sig" "nsis.zip.sig"
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            copy_first "*.dmg" "dmg"
            copy_first "*.app.tar.gz" "app.tar.gz"
            copy_first "*.app.tar.gz.sig" "app.tar.gz.sig"
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            copy_first "*.AppImage" "AppImage"
            copy_first "*.AppImage.sig" "AppImage.sig"
            copy_first "*.AppImage.tar.gz" "AppImage.tar.gz"
            copy_first "*.AppImage.tar.gz.sig" "AppImage.tar.gz.sig"
            copy_first "*.deb" "deb"
            if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
              copy_first "*.deb.sig" "deb.sig"
            fi
          fi

          ls -lh release-artifacts

      - name: Bundle Windows patch target
        if: matrix.platform == 'windows' && needs.prepare.outputs.channel == 'nightly'
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        env:
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        run: |
          set -euo pipefail
          node scripts/tauri-channel.mjs bundle nightly --bundles nsis --config src-tauri/tauri.delta-windows.conf.json
          original="src-tauri/target/release/bundle/nsis"
          package=$(find "$original" -maxdepth 1 -type f -name '*.exe' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/native-patch-inputs"
          temp_file="$RUNNER_TEMP/native-patch-inputs/${FILE_PREFIX}-windows-x64.exe.delta-target"
          cp "$package" "$temp_file.tmp"
          mv "$temp_file.tmp" "$temp_file"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows' && needs.prepare.outputs.channel == 'nightly'
        continue-on-error: true
        with:
          name: native-patch-inputs
          path: ${{ runner.temp }}/native-patch-inputs/*.delta-target
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  build-android:
    if: ${{ !(inputs.channel == 'stable' && inputs.stable_operation == 'publish') }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci || npm install

      - name: Sync Capacitor Android (${{ needs.prepare.outputs.channel }})
        working-directory: apps/mobile
        env:
          ZYX_APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ZYX_APP_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run sync:android:${{ needs.prepare.outputs.channel }}

      - name: Configure Android Firebase
        env:
          APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GOOGLE_SERVICES_JSON: ${{ needs.prepare.outputs.channel == 'nightly' && secrets.FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON || secrets.FIREBASE_STABLE_GOOGLE_SERVICES_JSON }}
        run: python3 apps/scripts/configure-android-firebase.py

      - name: Decode Android signing keystore (if configured)
        id: signing
        shell: bash
        env:
          APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('ANDROID_{0}_KEYSTORE_BASE64', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('ANDROID_{0}_KEY_ALIAS', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEY_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/zyx-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android release signing secrets are required for the selected channel. Debug signing is not allowed."
            exit 1
          fi

      - name: Build Android APK (${{ needs.prepare.outputs.channel }})
        working-directory: apps/mobile/android
        env:
          ZYX_ANDROID_VERSION_CODE: ${{ github.run_number }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          ZYX_ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/zyx-release.jks', runner.temp) || '' }}
          ZYX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ZYX_ANDROID_KEY_ALIAS: ${{ secrets[format('ANDROID_{0}_KEY_ALIAS', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ZYX_ANDROID_KEY_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEY_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
        run: |
          chmod +x gradlew
          if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
            ./gradlew assembleNightlyRelease -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
          else
            ./gradlew assembleStableRelease -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
          fi

      - name: Remove temporary Android keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/zyx-release.jks"

      - name: Collect Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          FLAVOR="${{ needs.prepare.outputs.channel }}"
          BUILD_TYPE="${{ steps.signing.outputs.build_type }}"
          APK=$(find "apps/mobile/android/app/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}" -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1 || true)
          if [[ -z "$APK" ]]; then
            echo "No signed APK found for flavor ${FLAVOR} (${BUILD_TYPE})"
            exit 1
          fi
          TARGET="release-artifacts/${{ needs.prepare.outputs.file_prefix }}-android.apk"
          cp "$APK" "$TARGET"
          ls -lh "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: release-artifacts/*
          if-no-files-found: error

  verify-stable-windows:
    if: needs.prepare.outputs.channel == 'stable' && inputs.stable_operation == 'candidate'
    needs: [prepare, build-desktop]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-artifacts
      - name: Install exact stable Windows installer and launch
        shell: pwsh
        env:
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "release-artifacts/$($env:FILE_PREFIX)-windows-x64.exe").Path
          Get-FileHash -Algorithm SHA256 $installer
          $target = Join-Path $env:RUNNER_TEMP "zyx-stable-smoke-$env:GITHUB_RUN_ID"
          if ($target -match '\s' -or (Test-Path $target)) { throw 'Expected a unique, space-free smoke install path.' }
          # NSIS /D= must be the final unquoted argument.
          $install = Start-Process -FilePath $installer -ArgumentList "/S /D=$target" -PassThru
          if (!$install.WaitForExit(180000)) {
            $install.Kill()
            throw 'Silent NSIS install timed out.'
          }
          if ($install.ExitCode -ne 0) { throw "NSIS install failed with exit code $($install.ExitCode)." }
          $executable = Get-ChildItem $target -Recurse -File -Filter 'zyx-academy-desktop.exe'
          if (@($executable).Count -ne 1) { throw 'Expected exactly one installed Zyx desktop binary.' }
          $app = Start-Process -FilePath $executable.FullName -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited during startup: $($app.ExitCode)." }
            } while ($app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.MainWindowHandle -eq 0) { throw 'Installed app has no visible main window.' }
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw 'Installed app did not stay running.' }
            Write-Output 'Stable Windows installer installed and its app opened a window.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Verify stable Windows installer signatures
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_STABLE_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_SIGNER_THUMBPRINT
          $installer = "release-artifacts/$($env:FILE_PREFIX)-windows-x64.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($expected) {
            if ($expected -notmatch '^[0-9a-fA-F]{40}$' -or $signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $expected) {
              throw "Windows Authenticode verification failed: $($signature.Status)."
            }
            Write-Output 'Windows Authenticode: valid, matches approved certificate.'
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "Windows Authenticode returned $($signature.Status) without an approved thumbprint."
          } else {
            Write-Output '::warning::Windows installer is not Authenticode-signed; SmartScreen may warn.'
          }
          if (!(Test-Path "$installer.sig") -and !(Test-Path "release-artifacts/$($env:FILE_PREFIX)-windows-x64.nsis.zip.sig")) {
            Write-Output '::notice::No detached Tauri updater signature for Windows.'
          }
          Get-FileHash -Algorithm SHA256 $installer

  verify-stable-android-signing:
    if: needs.prepare.outputs.channel == 'stable' && inputs.stable_operation == 'candidate'
    needs: [prepare, build-android]
    # Match the live Digital Asset Links trust used by Android. No production credentials or writes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: release-artifacts
      - name: Verify stable Android APK
        shell: bash
        env:
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="release-artifacts/$FILE_PREFIX-android.apk"
          sdk=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          apksigner=$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          apksig_jar="$(dirname "$apksigner")/lib/apksigner.jar"
          test -f "$apksig_jar"
          # Read the verified signer from Android's verifier API, not CLI display formatting.
          cat > "$RUNNER_TEMP/VerifyStableSigner.java" <<'JAVAVERIFY'
          import com.android.apksig.ApkVerifier;
          import java.io.File;
          import java.security.MessageDigest;
          import java.security.cert.X509Certificate;
          import java.util.HexFormat;
          import java.util.List;

          public class VerifyStableSigner {
              public static void main(String[] args) throws Exception {
                  ApkVerifier.Result result = new ApkVerifier.Builder(new File(args[0])).build().verify();
                  if (!result.isVerified()) {
                      throw new IllegalStateException("APK cryptographic signature did not verify.");
                  }
                  List<X509Certificate> signers = result.getSignerCertificates();
                  if (signers.size() != 1) {
                      throw new IllegalStateException("Expected exactly one verified APK signer.");
                  }
                  byte[] cert = signers.get(0).getEncoded();
                  System.out.print(HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert)));
              }
          }
          JAVAVERIFY
          actual=$(java -cp "$apksig_jar" "$RUNNER_TEMP/VerifyStableSigner.java" "$apk")
          export APK_CERT_SHA256="$actual"
          export APP_LINKS_FILE="$RUNNER_TEMP/zyx-stable-app-links.json"
          curl --fail --silent --show-error --max-time 25 \
            https://www.zyxacademy.com/.well-known/assetlinks.json -o "$APP_LINKS_FILE"
          python3 - <<'PYVERIFY'
          import json, os, re, sys
          actual = os.environ.get("APK_CERT_SHA256", "").strip().lower()
          with open(os.environ["APP_LINKS_FILE"], encoding="utf-8") as f:
              links = json.load(f)
          known = {
              value.lower().replace(":", "")
              for entry in links
              if entry.get("target", {}).get("namespace") == "android_app"
              and entry["target"].get("package_name") == "com.zyx.academy"
              and "delegate_permission/common.handle_all_urls" in entry.get("relation", [])
              for value in entry["target"].get("sha256_cert_fingerprints", [])
              if re.fullmatch(r"[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}", value)
          }
          if not known:
              sys.exit("Production Digital Asset Links publishes no valid stable Android fingerprints.")
          if not re.fullmatch(r"[0-9a-f]{64}", actual):
              sys.exit("Expected exactly one valid APK signing certificate SHA-256 digest.")
          if actual not in known:
              sys.exit("Stable APK signer did not match the configured production App Links set.")
          print("Stable APK signing certificate matches the approved production App Links set.")
          PYVERIFY
          badging=$("$(dirname "$apksigner")/aapt" dump badging "$apk")
          grep -F "package: name='com.zyx.academy' " <<< "$badging" | grep -F "versionName='$APP_VERSION'"
          if grep -Fx 'application-debuggable' <<< "$badging"; then
            echo "::error::Stable Android APK is debuggable."
            exit 1
          fi
          sha256sum "$apk"

  smoke-stable-android:
    if: needs.prepare.outputs.channel == 'stable' && inputs.stable_operation == 'candidate'
    needs: [prepare, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: release-artifacts
      - name: Prepare the exact APK smoke test and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          cat > "$RUNNER_TEMP/zyx-android-smoke.sh" <<'TESTAPK'
          set -euo pipefail
          adb="${ANDROID_HOME}/platform-tools/adb"
          export ANDROID_SERIAL="emulator-${EMULATOR_PORT:-5554}"
          apk="release-artifacts/$FILE_PREFIX-android.apk"
          sha256sum "$apk"
          "$adb" install "$apk"
          package=com.zyx.academy
          launch=$("$adb" shell am start -W -n "$package/.MainActivity")
          printf '%s\n' "$launch"
          grep -Fq 'Status: ok' <<< "$launch"
          sleep 5
          test -n "$("$adb" shell pidof "$package")"
          resumed=$("$adb" shell dumpsys activity activities)
          grep -E 'mResumedActivity|topResumedActivity' <<< "$resumed" | grep -F "$package/"
          echo "Stable Android APK installed and MainActivity resumed."
          TESTAPK
          bash -n "$RUNNER_TEMP/zyx-android-smoke.sh"
      - name: Install and launch exact stable APK on Android 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: bash "$RUNNER_TEMP/zyx-android-smoke.sh"

  publish-release:
    if: needs.prepare.outputs.channel == 'nightly' && inputs.android_candidate != true
    needs: [prepare, build-desktop, build-android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: "{desktop-*,mobile-android}"
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.channel == 'nightly'
        continue-on-error: true
        with:
          name: native-patch-inputs
          path: native-patch-inputs

      - name: Generate Nightly delta assets
        continue-on-error: true
        if: needs.prepare.outputs.channel == 'nightly' && github.ref == 'refs/heads/staging'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sudo apt-get install -y bsdiff 7zip
          node --test tests/native-delta.test.mjs
          patch_dir=$(mktemp -d)
          trap 'rm -rf "$patch_dir"' EXIT
          cp dist-artifacts/* "$patch_dir/"
          if [[ -d native-patch-inputs ]]; then
            cp native-patch-inputs/*.delta-target "$patch_dir/"
          fi
          node apps/scripts/generate-nightly-deltas.mjs "$patch_dir" "$RELEASE_TAG"
          shopt -s nullglob
          patches=("$patch_dir"/*.zyxdelta "$patch_dir"/*.zyxdelta-apk.gz "$patch_dir"/*.zyxdesktop.gz)
          if (( ${#patches[@]} )); then
            cp "${patches[@]}" dist-artifacts/
          fi

      - name: Generate updater manifest, checksums, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TITLE="${{ needs.prepare.outputs.release_title }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          DEFAULT_URL="${{ needs.prepare.outputs.default_url }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"

          node apps/desktop/scripts/generate-updater-manifest.mjs \
            --dir dist-artifacts \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --tag "$TAG" \
            --notes "$TITLE"

          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

          NOTES=$(cat <<EOF
          ## ${TITLE}

          - **Channel:** \`${CHANNEL}\`
          - **Default server:** ${DEFAULT_URL}
          - **Commit:** \`${GITHUB_SHA::7}\`

          ### Downloads
          - **Android:** \`*.apk\` (installable side-by-side between Nightly and Stable)
          - **Windows:** \`*.exe\` (NSIS installer)
          - **macOS (Apple Silicon):** \`*.dmg\`
          - **Linux:** \`*.AppImage\` or \`*.deb\`

          > Note: iOS builds are distributed via TestFlight/Xcode rather than unsigned GitHub Release artifacts.
          EOF
          )

          EXTRA_FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" * \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"


  package-stable-candidate:
    if: needs.prepare.outputs.channel == 'stable' && inputs.stable_operation == 'candidate'
    needs: [prepare, build-desktop, build-android, verify-stable-windows, verify-stable-android-signing, smoke-stable-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: "{desktop-*,mobile-android}"
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind updater metadata and checksums to the candidate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.release_title }}
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/generate-updater-manifest.mjs \
            --dir dist-artifacts --channel stable --version "$VERSION" --tag "$TAG" --notes "$TITLE"
          cd dist-artifacts
          test -s "$FILE_PREFIX-android.apk"
          test -s "$FILE_PREFIX-windows-x64.exe"
          updater_mode=manual
          if [[ -e latest.json ]]; then
            jq -e --arg version "$VERSION" '.version == $version and (.platforms["windows-x86_64"].signature | length > 0)' latest.json
            updater_mode=signed
          elif compgen -G '*.sig' >/dev/null; then
            echo "::error::Detached signatures are present but the updater manifest is missing."
            exit 1
          fi
          jq -n --arg sha "$GITHUB_SHA" --arg version "$VERSION" --arg tag "$TAG" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg updater "$updater_mode" \
            '{sha:$sha, version:$version, tag:$tag, run:$run, attempt:$attempt, updater:$updater}' > stable-candidate.json
          sha256sum -- * > SHA256SUMS.txt
          digest=$(sha256sum SHA256SUMS.txt | cut -d ' ' -f 1)
          printf '### Stable release candidate (not published)\n\nCommit: `%s`\n\nRun: `%s`\n\nDesktop updater: `%s`\n\nSHA256SUMS.txt SHA-256: `%s`\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$updater_mode" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-candidate-${{ github.run_attempt }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish-stable-candidate:
    if: needs.prepare.outputs.channel == 'stable' && inputs.stable_operation == 'publish'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify candidate workflow provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.stable_candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          expected_workflow_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-apps.yml" --jq .id)
          run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
          attempt=$(jq -er --arg sha "$GITHUB_SHA" --argjson workflow "$expected_workflow_id" '
            select(.workflow_id == $workflow and .head_sha == $sha and .head_branch == "main"
                   and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")
            | .run_attempt' <<< "$run")
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: stable-candidate-${{ steps.provenance.outputs.attempt }}
          path: dist-artifacts
          run-id: ${{ inputs.stable_candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify tested artifacts and publish without rebuilding
        working-directory: dist-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.stable_candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ steps.provenance.outputs.attempt }}
          EXPECTED_CHECKSUMS_SHA256: ${{ inputs.stable_candidate_checksums_sha256 }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.release_title }}
        run: |
          set -euo pipefail
          printf '%s  SHA256SUMS.txt\n' "$EXPECTED_CHECKSUMS_SHA256" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
          # Ensure there are no extra files outside the candidate manifest before uploading.
          diff -u <(LC_ALL=C sort <(cut -c 67- SHA256SUMS.txt)) <(printf '%s\n' * | grep -vx SHA256SUMS.txt | LC_ALL=C sort)
          updater_mode=manual
          if [[ -e latest.json ]]; then
            jq -e --arg version "$VERSION" '.version == $version and (.platforms["windows-x86_64"].signature | length > 0)' latest.json
            updater_mode=signed
          elif compgen -G '*.sig' >/dev/null; then
            echo "::error::Detached signatures are present but the updater manifest is missing."
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" --arg version "$VERSION" --arg tag "$TAG" --arg run "$CANDIDATE_RUN" --arg attempt "$CANDIDATE_ATTEMPT" --arg updater "$updater_mode" \
            '. == {sha:$sha, version:$version, tag:$tag, run:$run, attempt:$attempt, updater:$updater}' stable-candidate.json
          updater_note="Desktop signed updater manifest included."
          if [[ "$updater_mode" == manual ]]; then
            # Do not displace an existing signed stable manifest at GitHub's /releases/latest/download/latest.json.
            existing_signed=$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .assets[]? | select(.name == "latest.json") | .name')
            [[ -z "$existing_signed" ]] || { echo "::error::Manual-only release would displace an existing stable signed updater."; exit 1; }
            updater_note="Desktop is a manual installer download. No signed in-app desktop auto-update is included."
          fi
          # Create the release only for the exact main commit bound to the candidate.
          # Refuse an existing tag so GitHub cannot reuse one pointing to another commit.
          main_sha=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "::error::Main moved; build and test a new candidate."; exit 1; }
          existing_tags=$(gh api "/repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name')
          if grep -Fxq "$TAG" <<< "$existing_tags"; then
            echo "::error::Stable tag already exists."
            exit 1
          fi
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --generate-notes \
            --notes "Stable release built in verified candidate run $CANDIDATE_RUN. Default server: https://www.zyxacademy.com. $updater_note"
