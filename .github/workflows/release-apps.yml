name: Release Apps (Desktop & Mobile)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (nightly -> staging.zyxacademy.com, stable -> www.zyxacademy.com)"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - stable
      version:
        description: "Optional version override (nightly auto-increments as 0.1.0-alpha.<run_number>; stable defaults to apps/desktop/package.json)"
        required: false
        type: string
      android_candidate:
        description: "Build only an Android APK artifact without publishing a release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-apps-${{ github.ref }}-${{ inputs.channel || 'auto' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      default_url: ${{ steps.meta.outputs.default_url }}
      file_prefix: ${{ steps.meta.outputs.file_prefix }}
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          CORE_VERSION="${PKG_VERSION%%-*}"
          DATE_STAMP=$(date -u +%Y%m%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="${INPUT_CHANNEL:-nightly}"
            if [[ -n "$INPUT_VERSION" ]]; then
              VERSION="$INPUT_VERSION"
            elif [[ "$CHANNEL" == "nightly" ]]; then
              VERSION="${CORE_VERSION}-alpha.${RUN_NUMBER}"
            else
              VERSION="$PKG_VERSION"
            fi
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            CHANNEL="stable"
            VERSION="$PKG_VERSION"
          else
            CHANNEL="nightly"
            VERSION="${CORE_VERSION}-alpha.${RUN_NUMBER}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$CHANNEL" == "nightly" && "$GITHUB_REF" != "refs/heads/staging" ]]; then
            echo "::error::Nightly releases must be built from staging."
            exit 1
          fi
          if [[ "$CHANNEL" == "nightly" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Enter a valid release version."
            exit 1
          fi

          if [[ "$CHANNEL" == "nightly" ]]; then
            TAG="app-v${VERSION}-nightly.${DATE_STAMP}.${SHORT_SHA}"
            RELEASE_TITLE="Zyx Academy Nightly v${VERSION} (${DATE_STAMP})"
            PRERELEASE="true"
            DEFAULT_URL="https://staging.zyxacademy.com"
            FILE_PREFIX="zyx-academy-nightly-${VERSION}-${DATE_STAMP}"
            BUILD_ID="${SHORT_SHA}"
          else
            BASE_TAG="app-v${VERSION}"
            if gh release view "$BASE_TAG" >/dev/null 2>&1; then
              TAG="${BASE_TAG}-b${RUN_NUMBER}"
              RELEASE_TITLE="Zyx Academy v${VERSION} (build ${RUN_NUMBER})"
              FILE_PREFIX="zyx-academy-${VERSION}-b${RUN_NUMBER}"
              BUILD_ID="b${RUN_NUMBER}"
            else
              TAG="${BASE_TAG}"
              RELEASE_TITLE="Zyx Academy v${VERSION}"
              FILE_PREFIX="zyx-academy-${VERSION}"
              BUILD_ID="b0"
            fi

            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            DEFAULT_URL="https://www.zyxacademy.com"
          fi

          {
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "release_title=${RELEASE_TITLE}"
            echo "prerelease=${PRERELEASE}"
            echo "default_url=${DEFAULT_URL}"
            echo "file_prefix=${FILE_PREFIX}"
            echo "build_id=${BUILD_ID}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved release: channel=${CHANNEL}, version=${VERSION}, tag=${TAG}, build_id=${BUILD_ID}, title=${RELEASE_TITLE}"

  build-offline-shell:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install shared browser build dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build local offline shell from shared source
        env:
          ZYX_APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: bun scripts/build-native-offline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-offline-shell-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/mobile/www/offline-shell.js
            apps/mobile/www/offline-shell.css
            apps/mobile/www/offline-origin.js
            apps/mobile/www/vendor/fonts/
            apps/desktop/dist/offline-shell.js
            apps/desktop/dist/offline-shell.css
            apps/desktop/dist/offline-origin.js
            apps/desktop/dist/vendor/fonts/

  build-desktop:
    if: inputs.android_candidate != true
    needs: [prepare, build-offline-shell]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            arch: aarch64
          - platform: windows
            os: windows-latest
            arch: x64
          - platform: linux
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore shared offline shell
        uses: actions/download-artifact@v4
        with:
          name: native-offline-shell-${{ github.sha }}
          path: apps

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Build Tauri desktop bundle (${{ needs.prepare.outputs.channel }})
        working-directory: apps/desktop
        env:
          ZYX_APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ZYX_APP_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run build:${{ needs.prepare.outputs.channel }}

      - name: Collect desktop installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          PREFIX="${{ needs.prepare.outputs.file_prefix }}-${{ matrix.platform }}-${{ matrix.arch }}"

          copy_first() {
            local pattern="$1"
            local ext="$2"
            local found
            found=$(find "$BUNDLE_DIR" -type f -name "$pattern" | head -n 1 || true)
            if [[ -n "$found" ]]; then
              cp "$found" "release-artifacts/${PREFIX}.${ext}"
              echo "Packaged: release-artifacts/${PREFIX}.${ext}"
            fi
          }

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            copy_first "*.exe" "exe"
            copy_first "*.exe.sig" "exe.sig"
            copy_first "*.msi" "msi"
            copy_first "*.nsis.zip" "nsis.zip"
            copy_first "*.nsis.zip.sig" "nsis.zip.sig"
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            copy_first "*.dmg" "dmg"
            copy_first "*.app.tar.gz" "app.tar.gz"
            copy_first "*.app.tar.gz.sig" "app.tar.gz.sig"
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            copy_first "*.AppImage" "AppImage"
            copy_first "*.AppImage.sig" "AppImage.sig"
            copy_first "*.AppImage.tar.gz" "AppImage.tar.gz"
            copy_first "*.AppImage.tar.gz.sig" "AppImage.tar.gz.sig"
            copy_first "*.deb" "deb"
            if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
              copy_first "*.deb.sig" "deb.sig"
            fi
          fi

          ls -lh release-artifacts

      - name: Bundle Windows patch target
        if: matrix.platform == 'windows'
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        env:
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          FILE_PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        run: |
          set -euo pipefail
          node scripts/tauri-channel.mjs bundle ${{ needs.prepare.outputs.channel }} --bundles nsis --config src-tauri/tauri.delta-windows.conf.json
          original="src-tauri/target/release/bundle/nsis"
          package=$(find "$original" -maxdepth 1 -type f -name '*.exe' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/native-patch-inputs"
          temp_file="$RUNNER_TEMP/native-patch-inputs/${FILE_PREFIX}-windows-x64.exe.delta-target"
          cp "$package" "$temp_file.tmp"
          mv "$temp_file.tmp" "$temp_file"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        continue-on-error: true
        with:
          name: native-patch-inputs
          path: ${{ runner.temp }}/native-patch-inputs/*.delta-target
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  build-android:
    needs: [prepare, build-offline-shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore shared offline shell
        uses: actions/download-artifact@v4
        with:
          name: native-offline-shell-${{ github.sha }}
          path: apps

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci || npm install

      - name: Sync Capacitor Android (${{ needs.prepare.outputs.channel }})
        working-directory: apps/mobile
        env:
          ZYX_APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ZYX_APP_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run sync:android:${{ needs.prepare.outputs.channel }}

      - name: Configure Android Firebase
        env:
          APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GOOGLE_SERVICES_JSON: ${{ needs.prepare.outputs.channel == 'nightly' && secrets.FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON || secrets.FIREBASE_STABLE_GOOGLE_SERVICES_JSON }}
        run: python3 apps/scripts/configure-android-firebase.py

      - name: Decode Android signing keystore (if configured)
        id: signing
        shell: bash
        env:
          APP_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('ANDROID_{0}_KEYSTORE_BASE64', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('ANDROID_{0}_KEY_ALIAS', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEY_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/zyx-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          elif [[ "$APP_CHANNEL" == "nightly" ]]; then
            echo "::error::Nightly Android updates require the existing release signing key."
            exit 1
          else
            echo "::notice::Android release signing secrets are not configured; building with ephemeral debug keystore. Configure the selected channel ANDROID_NIGHTLY_* or ANDROID_STABLE_* signing secrets to enable seamless in-place APK updates."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK (${{ needs.prepare.outputs.channel }})
        working-directory: apps/mobile/android
        env:
          ZYX_ANDROID_VERSION_CODE: ${{ github.run_number }}
          ZYX_APP_VERSION: ${{ needs.prepare.outputs.version }}
          ZYX_ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/zyx-release.jks', runner.temp) || '' }}
          ZYX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ZYX_ANDROID_KEY_ALIAS: ${{ secrets[format('ANDROID_{0}_KEY_ALIAS', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
          ZYX_ANDROID_KEY_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEY_PASSWORD', needs.prepare.outputs.channel == 'nightly' && 'NIGHTLY' || 'STABLE')] }}
        run: |
          chmod +x gradlew
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
              ./gradlew assembleNightlyRelease -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
            else
              ./gradlew assembleStableRelease -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
            fi
          else
            if [[ "${{ needs.prepare.outputs.channel }}" == "nightly" ]]; then
              ./gradlew assembleNightlyDebug -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
            else
              ./gradlew assembleStableDebug -PzyxVersionCode="${{ github.run_number }}" -PzyxVersionName="${{ needs.prepare.outputs.version }}"
            fi
          fi

      - name: Remove temporary Android keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/zyx-release.jks"

      - name: Collect Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          FLAVOR="${{ needs.prepare.outputs.channel }}"
          BUILD_TYPE="${{ steps.signing.outputs.build_type }}"
          APK=$(find "apps/mobile/android/app/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}" -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1 || true)
          if [[ -z "$APK" ]]; then
            echo "No signed APK found for flavor ${FLAVOR} (${BUILD_TYPE})"
            exit 1
          fi
          TARGET="release-artifacts/${{ needs.prepare.outputs.file_prefix }}-android.apk"
          cp "$APK" "$TARGET"
          ls -lh "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    if: inputs.android_candidate != true
    needs: [prepare, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: "{desktop-*,mobile-android}"
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-patch-inputs
          path: native-patch-inputs

      - name: Generate delta assets
        continue-on-error: true
        if: (needs.prepare.outputs.channel == 'nightly' && github.ref == 'refs/heads/staging') || (needs.prepare.outputs.channel == 'stable' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y bsdiff 7zip
          node --test tests/native-delta.test.mjs
          patch_dir=$(mktemp -d)
          trap 'rm -rf "$patch_dir"' EXIT
          cp dist-artifacts/* "$patch_dir/"
          if [[ -d native-patch-inputs ]]; then
            cp native-patch-inputs/*.delta-target "$patch_dir/"
          fi
          node apps/scripts/generate-nightly-deltas.mjs "$patch_dir" "$RELEASE_TAG"
          shopt -s nullglob
          desktop_patches=("$patch_dir"/*.zyxdesktop.gz)
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] && (( ${#desktop_patches[@]} )); then
            (cd apps/desktop && (npm ci || npm install))
            for patch in "${desktop_patches[@]}"; do
              (cd apps/desktop && npx tauri signer sign "$patch")
            done
          fi
          patches=("$patch_dir"/*.zyxdelta "$patch_dir"/*.zyxdelta-apk.gz "$patch_dir"/*.zyxdesktop.gz "$patch_dir"/*.zyxdesktop.gz.sig)
          if (( ${#patches[@]} )); then
            cp "${patches[@]}" dist-artifacts/
          fi

      - name: Generate updater manifest, checksums, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TITLE="${{ needs.prepare.outputs.release_title }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          DEFAULT_URL="${{ needs.prepare.outputs.default_url }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"

          node apps/desktop/scripts/generate-updater-manifest.mjs \
            --dir dist-artifacts \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --tag "$TAG" \
            --notes "$TITLE"

          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

          NOTES=$(cat <<EOF
          ## ${TITLE}

          - **Channel:** \`${CHANNEL}\`
          - **Default server:** ${DEFAULT_URL}
          - **Commit:** \`${GITHUB_SHA::7}\`

          ### Downloads
          - **Android:** \`*.apk\` (installable side-by-side between Nightly and Stable)
          - **Windows:** \`*.exe\` (NSIS installer)
          - **macOS (Apple Silicon):** \`*.dmg\`
          - **Linux:** \`*.AppImage\` or \`*.deb\`

          > Note: iOS builds are distributed via TestFlight/Xcode rather than unsigned GitHub Release artifacts.
          EOF
          )

          EXTRA_FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" * \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"
