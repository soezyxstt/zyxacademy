name: Notification visual review

on:
  pull_request:
    paths:
      - 'components/notifications/**'
      - 'app/(student)/settings/**'
      - 'messages/*/student.json'
      - 'tests/visual/settings-preferences.spec.ts'
      - 'tests/visual/fixtures/settings-preferences*'
      - '.github/workflows/notification-visual-review.yml'

permissions:
  contents: read

concurrency:
  group: notification-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Mobile and desktop notification screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://preferences.fixture.test
      NEXT_TELEMETRY_DISABLED: '1'
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Capture actual settings components in both viewports
        run: bunx playwright test tests/visual/settings-preferences.spec.ts --grep 'notification activity preferences and permission dialog review' --project=mobile-380 --project=laptop-fhd-125
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-preferences-mobile-desktop
          path: |
            artifacts/visual-quality/results/**/*.png
            artifacts/visual-quality/report/
          if-no-files-found: error
          retention-days: 30
