name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pending pushes may be superseded; compare against the last successful release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Plan affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      web: ${{ steps.plan.outputs.web }}
      worker: ${{ steps.plan.outputs.worker }}
      v4: ${{ steps.plan.outputs.v4 }}
      authoring: ${{ steps.plan.outputs.authoring }}
      schedule: ${{ steps.plan.outputs.schedule }}
      plugin: ${{ steps.plan.outputs.plugin }}
      ci: ${{ steps.plan.outputs.ci }}
      quality: ${{ steps.plan.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release-base
        name: Find last successful push release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_base.py
      - id: plan
        name: Compare base and head dependency graphs
        env:
          CI_BASE_SHA: ${{ github.event_name == 'push' && steps.release-base.outputs.base || github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/plan.py
      - name: Test planner and deployment contracts
        if: steps.plan.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci/plan.json
          retention-days: 1

  quality:
    name: Affected code checks
    needs: impact
    if: needs.impact.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      BETTER_AUTH_SECRET: ci-contract-tests-only-not-a-real-secret
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: artifacts/ci/
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Restore compiler and lint metadata
        uses: actions/cache@v4
        with:
          path: |
            .cache/typecheck/
            .cache/eslint/
          key: ${{ runner.os }}-checks-v1-${{ hashFiles('bun.lock', 'tsconfig*.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-checks-v1-${{ hashFiles('bun.lock', 'tsconfig*.json', 'eslint.config.mjs') }}-
      - name: Run affected checks
        run: python3 scripts/ci/check.py

  authoring:
    needs: impact
    if: needs.impact.outputs.authoring == 'true'
    uses: ./.github/workflows/authoring-skills.yml

  schedule:
    needs: impact
    if: needs.impact.outputs.schedule == 'true'
    uses: ./.github/workflows/schedule-regressions.yml

  plugin:
    needs: impact
    if: needs.impact.outputs.plugin == 'true'
    uses: ./.github/workflows/sync-plugin.yml

  worker-check:
    name: Background worker checks
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit worker imports without installing packages
        run: node --experimental-strip-types scripts/audit-worker-dependencies.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-v2-${{ hashFiles('deno.lock', 'deno.json', 'workers/deno-background/deno.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-deno-v2-${{ hashFiles('deno.lock', 'deno.json', 'workers/deno-background/deno.json') }}-
      - run: deno check workers/deno-background/main.ts
      - name: Verify Diktat runtime assets
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
        run: deno run --allow-read --allow-env --config workers/deno-background/deno.json workers/deno-background/diktat-assets-smoke.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build Neon archive and enforce runtime size limits
        env:
          ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/authoring/prepare-web-verification.ts
          node scripts/neon/build-worker.mjs

  gate:
    name: CI gate
    needs: [impact, quality, authoring, schedule, plugin, worker-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          outputs = results['impact'].get('outputs', {})
          selected = {'quality': 'quality', 'authoring': 'authoring', 'schedule': 'schedule', 'plugin': 'plugin'}
          for job, output in selected.items():
              if outputs.get(output) == 'true' and results[job]['result'] != 'success':
                  failed.append(job)
          if os.environ['EVENT_NAME'] == 'pull_request' and outputs.get('worker') == 'true' and results['worker-check']['result'] != 'success':
              failed.append('worker-check')
          if results['impact']['result'] != 'success' or failed:
              raise SystemExit('CI failed: ' + ', '.join(failed))
          PY
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - name: Reject a superseded release before deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_base.py --ensure-current

  deploy-web:
    needs: [impact, gate, deploy-worker]
    if: ${{ !cancelled() && needs.impact.result == 'success' && needs.gate.result == 'success' && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') && github.event_name == 'push' && needs.impact.outputs.web == 'true' }}
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  deploy-worker:
    needs: [impact, gate]
    if: ${{ !cancelled() && needs.impact.result == 'success' && needs.gate.result == 'success' && github.event_name == 'push' && (needs.impact.outputs.worker == 'true' || needs.impact.outputs.v4 == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      check_worker: ${{ needs.impact.outputs.worker == 'true' }}
    secrets: inherit
