name: Release Expo Android (Staging)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver preview version (leave empty for <app.json version>-preview.<run_number>)"
        required: false
        default: ""
        type: string
      architectures:
        description: "Android ABIs to compile"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - "arm64-v8a"
          - "arm64-v8a,armeabi-v7a"
      publish_release:
        description: "Publish GitHub pre-release for in-app Expo updater (expo-android-v<version>-b<versionCode>)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-expo-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Expo Android staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == "true" && "$GITHUB_REF" != "refs/heads/staging" ]]; then
            echo "::error::Publishing an Expo Android staging pre-release requires running from the staging branch."
            exit 1
          fi
          BASE_VERSION=$(node -p "require('./apps/mobile-native/app.json').expo.version")
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${BASE_VERSION}-preview.${VERSION_CODE}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Use semver such as 0.1.0-preview.1"
            exit 1
          fi
          TAG="expo-android-v${VERSION}-b${VERSION_CODE}"
          APK_NAME="zyx-academy-expo-android-${VERSION}-b${VERSION_CODE}.apk"
          if [[ ${#TAG} -gt 90 || ${#VERSION} -gt 60 ]]; then
            echo "::error::Tag or version exceeds Expo updater limits."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "tag=${TAG}"
            echo "apk_name=${APK_NAME}"
            echo "short_sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared ${TAG} (${APK_NAME})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/mobile-native/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Expo dependencies
        working-directory: apps/mobile-native
        run: npm ci

      - name: Decode Nightly Android signing keystore and extract App Links SHA-256
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_NIGHTLY_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::ANDROID_NIGHTLY_KEYSTORE_BASE64, ANDROID_NIGHTLY_KEYSTORE_PASSWORD, ANDROID_NIGHTLY_KEY_ALIAS, and ANDROID_NIGHTLY_KEY_PASSWORD secrets are required."
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/zyx-expo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          SHA256=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk '/SHA256:/ {print $2; exit}')
          if ! [[ "$SHA256" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "::error::Could not extract SHA-256 certificate fingerprint from keystore."
            exit 1
          fi
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Extracted release keystore SHA-256 fingerprint for staging App Links."

      - name: Configure Expo Android staging Firebase (if nativeparity client is present)
        id: firebase
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_JSON" ]]; then
            echo "::notice::FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON is not set; building without native FCM and Credential Manager (system browser Google sign-in remains active)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { validateStagingFirebase, ANDROID_PACKAGE } = require("./apps/mobile-native/plugins/staging-firebase-config");
          const raw = process.env.FIREBASE_JSON || "";
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            try {
              parsed = JSON.parse(Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8"));
            } catch {
              console.log("::warning::FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON could not be parsed as JSON or base64 JSON; skipping native Firebase config.");
              process.exit(0);
            }
          }
          const normalized = JSON.stringify(parsed);
          const clients = Array.isArray(parsed?.client) ? parsed.client : [];
          const hasExpoClient = clients.some(c => c?.client_info?.android_client_info?.package_name === ANDROID_PACKAGE);
          if (!hasExpoClient) {
            console.log(`::notice::FIREBASE_NIGHTLY_GOOGLE_SERVICES_JSON does not yet include Android app ${ANDROID_PACKAGE}. Add ${ANDROID_PACKAGE} in Firebase project zyx-academy-staging and update the secret to enable native FCM and Google Credential Manager. System browser Google sign-in remains active.`);
            process.exit(0);
          }
          validateStagingFirebase(normalized, ANDROID_PACKAGE);
          const dest = path.resolve("apps/mobile-native/google-services.json");
          fs.writeFileSync(dest, normalized, { mode: 0o600 });
          console.log(`Configured staging Firebase client for ${ANDROID_PACKAGE}.`);
          NODE
          if [[ -f apps/mobile-native/google-services.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prebuild Expo Android project for staging
        working-directory: apps/mobile-native
        env:
          ZYX_ENVIRONMENT: staging
          BETTER_AUTH_URL: https://staging.zyxacademy.com
          NEXT_PUBLIC_APP_URL: https://staging.zyxacademy.com
          EXPO_ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version }}
          EXPO_ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ANDROID_APP_LINKS_EXPO_STAGING_SHA256_FINGERPRINTS: ${{ steps.signing.outputs.sha256 }}
        run: npx --no-install expo prebuild --platform android --no-install

      - name: Wire release signing config into generated Gradle project
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          gradle_path = Path("apps/mobile-native/android/app/build.gradle")
          content = gradle_path.read_text(encoding="utf-8")

          release_signing = """        release {
            storeFile file(System.getenv("ZYX_EXPO_KEYSTORE_PATH"))
            storePassword System.getenv("ZYX_EXPO_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ZYX_EXPO_KEY_ALIAS")
            keyPassword System.getenv("ZYX_EXPO_KEY_PASSWORD")
        }
"""
          marker = "    signingConfigs {"
          if marker not in content:
              raise SystemExit("Expected signingConfigs block in generated android/app/build.gradle")
          if "ZYX_EXPO_KEYSTORE_PATH" not in content:
              content = content.replace(marker + "\n", marker + "\n" + release_signing, 1)

          target = "        release {\n            // Caution! In production, you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.debug"
          replacement = "        release {\n            signingConfig signingConfigs.release"
          if target in content:
              content = content.replace(target, replacement, 1)
          else:
              import re
              updated, count = re.subn(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug",
                  r"\1signingConfig signingConfigs.release",
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not switch release buildType to signingConfigs.release")
              content = updated

          gradle_path.write_text(content, encoding="utf-8")
          print("Configured release signingConfig in android/app/build.gradle")
          PYTHON

      - name: Compile signed Expo Android release APK
        working-directory: apps/mobile-native/android
        env:
          ZYX_EXPO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ZYX_EXPO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_PASSWORD }}
          ZYX_EXPO_KEY_ALIAS: ${{ secrets.ANDROID_NIGHTLY_KEY_ALIAS }}
          ZYX_EXPO_KEY_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          assemble() {
            ./gradlew :app:assembleRelease -PreactNativeArchitectures="${{ inputs.architectures }}" --max-workers=2
          }
          if ! assemble 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            if ! grep -Fq "could not resolve plugin artifact" "$RUNNER_TEMP/gradle.log"; then
              exit 1
            fi
            echo "Retrying once after transient Gradle plugin resolution failure."
            sleep 5
            assemble
          fi
          rm -f "$RUNNER_TEMP/gradle.log"

      - name: Verify signed APK metadata and package constraints
        shell: bash
        env:
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          EXPECTED_SHA256: ${{ steps.signing.outputs.sha256 }}
        run: |
          set -euo pipefail
          SOURCE_APK="apps/mobile-native/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "::error::Expected release APK at ${SOURCE_APK}"
            exit 1
          fi
          mkdir -p release-artifacts
          TARGET_APK="release-artifacts/${APK_NAME}"
          cp "$SOURCE_APK" "$TARGET_APK"

          BYTES=$(stat -c%s "$TARGET_APK")
          MAX_BYTES=$((256 * 1024 * 1024))
          if (( BYTES <= 0 || BYTES > MAX_BYTES )); then
            echo "::error::APK size ${BYTES} exceeds limit ${MAX_BYTES}."
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "$TARGET_APK" | head -n 5)
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.zyx.academy.nativeparity'"
          echo "$BADGING" | grep -Fq "versionCode='${EXPECTED_VERSION_CODE}'"
          echo "$BADGING" | grep -Fq "versionName='${EXPECTED_VERSION}'"

          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$TARGET_APK" | tee "$RUNNER_TEMP/apksigner.log"
          NORMALIZED_EXPECTED=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          grep -qi "$NORMALIZED_EXPECTED" "$RUNNER_TEMP/apksigner.log"
          rm -f "$RUNNER_TEMP/apksigner.log"
          ls -lh "$TARGET_APK"

      - name: Clean up temporary keystore and Firebase config
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/zyx-expo-release.jks" "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/apksigner.log"
          rm -f apps/mobile-native/google-services.json

      - name: Upload Expo Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-android-staging-apk
          path: release-artifacts/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Pre-release for Expo Android staging
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          FIREBASE_ENABLED: ${{ steps.firebase.outputs.enabled }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Expo Android staging preview build from \`staging\` (\`${SHORT_SHA}\`).

          - Package: \`com.zyx.academy.nativeparity\`
          - Server origin: \`https://staging.zyxacademy.com\`
          - Version: \`${VERSION}\` (versionCode \`${VERSION_CODE}\`)
          - Architectures: \`${ARCHITECTURES}\`
          - Native Firebase / Credential Manager bundled: \`${FIREBASE_ENABLED}\`
          EOF
          )
          gh release create "$TAG" "release-artifacts/${APK_NAME}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Zyx Academy Expo Android v${VERSION} (b${VERSION_CODE})" \
            --notes "$NOTES"
