name: Native component parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile-native/**'
      - 'packages/**'
      - 'app/globals.css'
      - 'components/ui/**'
      - 'tests/visual/ui-parity-web/**'
      - 'tests/unit/progress-parity.test.ts'
      - 'tests/unit/avatar-parity.test.ts'
      - 'tests/visual/fixtures/fonts/**'
      - 'scripts/native-parity/**'
      - 'scripts/native-readiness/**'
      - 'public/founders/adi.jpeg'
      - '.maestro/native-parity/**'
      - '.github/workflows/native-parity.yml'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'lib/native/haptics.ts'
      - 'lib/native/runtime.ts'
      - 'lib/utils.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.head_ref || github.ref }}
  # Let the current device evidence finish while newer revisions share one pending slot.
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  PARITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/native-readiness -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/native-parity -p 'test_*.py'
      - name: Inventory product page dependencies
        run: python3 scripts/native-readiness/scan.py --all --max-depth 2 > "$RUNNER_TEMP/page-dependencies.json"
      - uses: actions/upload-artifact@v4
        with:
          name: page-dependencies
          path: ${{ runner.temp }}/page-dependencies.json
          retention-days: 7

  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
        working-directory: apps/mobile-native
      - run: npx --no-install tsc --noEmit
        working-directory: apps/mobile-native
      - name: Check session, transport and offline contracts
        run: |
          bun test tests/unit/expo-native-*.test.ts tests/unit/expo-offline-*.test.ts \
            tests/unit/native-authenticated-transport.test.ts tests/unit/native-browser-login.test.ts \
            tests/unit/native-account-context.test.ts tests/unit/native-zyra-stream.test.ts

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit/progress-parity.test.ts tests/unit/avatar-parity.test.ts
      - run: bun scripts/native-parity/generate-tokens.ts --check
      - run: bunx playwright install --with-deps chromium
      - name: Capture the Next.js component
        run: |
          node node_modules/next/dist/bin/next dev tests/visual/ui-parity-web --port 3210 > "$RUNNER_TEMP/parity-next.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/parity-next.log"' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:3210/ >/dev/null
          PARITY_DPR=1 bun tests/visual/ui-parity-web/capture.ts
          PARITY_DPR=3 bun tests/visual/ui-parity-web/capture.ts
      - uses: actions/upload-artifact@v4
        with:
          name: next-reference
          path: artifacts/native-parity/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: reference-manifests
          path: artifacts/native-parity/web/dpr*/cases.json
          if-no-files-found: error

      - name: Export the mobile WebView reference
        run: PARITY_WEBVIEW_EXPORT=1 node node_modules/next/dist/bin/next build tests/visual/ui-parity-web
      - uses: actions/upload-artifact@v4
        with:
          name: next-mobile-webview-site
          path: tests/visual/ui-parity-web/out
          if-no-files-found: error
          retention-days: 7

  device:
    needs: [reference, native-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      EXPO_PUBLIC_PARITY_WEBVIEW: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: next-reference
          path: artifacts/native-parity/web
      - uses: actions/download-artifact@v4
        with:
          name: next-mobile-webview-site
          path: artifacts/native-parity/webview-site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - run: npm ci
        working-directory: apps/mobile-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'ios'
        run: bash scripts/native-parity/capture-ios.sh
      - if: matrix.platform == 'android'
        name: Build emulator APK
        working-directory: apps/mobile-native
        run: |
          npx --no-install expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2
      - if: matrix.platform == 'android'
        run: sudo chmod a+rw /dev/kvm
      - if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/native-parity/capture-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-parity
          path: artifacts/native-parity/${{ matrix.platform }}
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-measurements
          path: |
            artifacts/native-parity/${{ matrix.platform }}/result-*.json
            artifacts/native-parity/${{ matrix.platform }}/native-vs-webview/result-*.json
          retention-days: 7

  visual-summary:
    needs: [reference, device]
    if: ${{ always() && !cancelled() && needs.reference.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '{reference-manifests,android-measurements,ios-measurements}'
          path: ${{ runner.temp }}/parity-results
      - run: python3 scripts/native-parity/summarize.py "$RUNNER_TEMP/parity-results" "$PARITY_HEAD_SHA" "$GITHUB_SHA"
