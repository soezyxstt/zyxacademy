name: Native component parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile-native/**'
      - 'packages/**'
      - 'app/globals.css'
      - 'components/ui/separator.tsx'
      - 'tests/visual/ui-parity-web/**'
      - 'scripts/native-parity/**'
      - '.github/workflows/native-parity.yml'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun scripts/native-parity/generate-tokens.ts --check
      - run: bunx playwright install --with-deps chromium
      - name: Capture the Next.js component
        run: |
          node node_modules/next/dist/bin/next dev tests/visual/ui-parity-web --port 3210 > "$RUNNER_TEMP/parity-next.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/parity-next.log"' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:3210/ >/dev/null
          PARITY_DPR=1 bun tests/visual/ui-parity-web/capture.ts
          PARITY_DPR=3 bun tests/visual/ui-parity-web/capture.ts
      - uses: actions/upload-artifact@v4
        with:
          name: next-reference
          path: artifacts/native-parity/web
          if-no-files-found: error

  device:
    needs: reference
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: next-reference
          path: artifacts/native-parity/web
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - run: npm ci
        working-directory: apps/mobile-native
      - run: npx --no-install tsc --noEmit
        working-directory: apps/mobile-native
      - if: matrix.platform == 'ios'
        run: bash scripts/native-parity/capture-ios.sh
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'android'
        name: Build emulator APK
        working-directory: apps/mobile-native
        run: |
          npx --no-install expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2
      - if: matrix.platform == 'android'
        run: sudo chmod a+rw /dev/kvm
      - if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/native-parity/capture-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-parity
          path: artifacts/native-parity/${{ matrix.platform }}
          retention-days: 7
