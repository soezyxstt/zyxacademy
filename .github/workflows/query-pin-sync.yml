name: Final Query dependency pin

on:
  push:
    branches: ['refactor/query-data-layer']
    paths: ['.github/workflows/query-pin-sync.yml']

permissions:
  contents: write

jobs:
  pin:
    if: github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/refactor/query-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify the reviewed starting point
        run: test "$(git rev-parse HEAD^)" = '94d2ca3db780ef7a2c13b0f051a8f9f5e394ab7e'
      - name: Pin the verified release
        run: |
          bun install --frozen-lockfile
          bun add --exact @tanstack/react-query@5.108.0
          bun add --dev --exact @tanstack/eslint-plugin-query@5.108.0
          test "$(git hash-object package.json)" = '75eab41a0bbae19ac3063baa7c288e7e7966272c'
          test "$(git hash-object bun.lock)" = 'ab1aebba8f5bca7882423b7f2abd7b27e702b50d'
          bun install --frozen-lockfile
          bun test tests/unit/query-data-layer.test.ts tests/unit/student-today-query.test.ts
      - name: Save the pin and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/query-pin-sync.yml
          git add package.json bun.lock
          git diff --cached --check
          git commit -m 'chore: pin TanStack Query and lint rules to 5.108.0'
          git push origin HEAD:refs/heads/refactor/query-data-layer
