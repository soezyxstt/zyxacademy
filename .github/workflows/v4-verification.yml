name: Operate V4 verification

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      action:
        type: choice
        options: [inspect, retry, evidence, cancel]
        default: inspect
        required: true
      revision:
        description: Exact bundle checksum from the inspect operation
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: (inputs.environment == 'production' && github.ref == 'refs/heads/main') || (inputs.environment == 'staging' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      QUEUE_PROVIDER: ${{ vars.QUEUE_PROVIDER || 'inngest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/authoring/prepare-web-verification.ts
      - name: Authenticate the selected Cloud Tasks target
        if: env.QUEUE_PROVIDER == 'cloud-tasks'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.CLOUD_TASKS_WORKLOAD_IDENTITY_PROVIDER || (inputs.environment == 'staging' && vars.CLOUD_RUN_STAGING_WORKLOAD_IDENTITY_PROVIDER) }}
          service_account: ${{ vars.CLOUD_TASKS_SERVICE_ACCOUNT || (inputs.environment == 'staging' && 'zyx-staging-web-ci@zyx-academy.iam.gserviceaccount.com') }}
      - name: Operate exact staged revision
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: '1'
          ZYX_ENVIRONMENT: ${{ inputs.environment }}
          NEXT_PUBLIC_APP_URL: ${{ inputs.environment == 'production' && 'https://www.zyxacademy.com' || 'https://staging.zyxacademy.com' }}
          AUTHORING_VERIFICATION_BROWSER_PROVIDER: ${{ vars.AUTHORING_VERIFICATION_BROWSER_PROVIDER || secrets.AUTHORING_VERIFICATION_BROWSER_PROVIDER || 'cloudflare' }}
          AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION: ${{ vars.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION || secrets.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION }}
          V4_OPERATION: ${{ inputs.action }}
          V4_REVISION: ${{ inputs.revision }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
          STORAGE_PROVIDER_MODE: neon
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 || secrets.AWS_ENDPOINT_URL_S3 }}
          NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET || secrets.NEON_STORAGE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bun --conditions=react-server scripts/authoring/operate-v4-verification.ts
      - uses: actions/upload-artifact@v4
        if: success() && inputs.action == 'evidence'
        with:
          name: v4-verification-evidence
          path: artifacts/v4-operations/
          retention-days: 3
