name: Operate V4 verification

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      action:
        type: choice
        options: [inspect, retry, evidence, cancel, prepare-fixture]
        default: inspect
        required: true
      revision:
        description: Exact bundle checksum from the inspect operation
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: inputs.action != 'prepare-fixture' && ((inputs.environment == 'production' && github.ref == 'refs/heads/main') || (inputs.environment == 'staging' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/authoring/prepare-web-verification.ts
      - uses: denoland/setup-deno@v2
        if: inputs.action == 'inspect' && inputs.environment == 'staging'
        with:
          deno-version: v2.x
      - name: Inspect staging worker variable contexts without values
        if: inputs.action == 'inspect' && inputs.environment == 'staging'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ]; then
            echo "Deno context metadata unavailable: deployment token is not provided to this workflow."
            exit 0
          fi
          umask 077
          trap 'rm -f .v4-worker-env.json' EXIT
          deno run -A jsr:@deno/deploy@0.0.9904 env list --json --org soezyxst --app zyx-background-staging --non-interactive > .v4-worker-env.json
          python - <<'PYTHON'
          import json
          data = json.load(open('.v4-worker-env.json'))
          if isinstance(data, dict):
              data = data.get('data', data.get('result', data))
          if not isinstance(data, list):
              raise SystemExit('VERIFICATION_WORKER_ENV_METADATA_INVALID')
          keys = {'BETTER_AUTH_SECRET', 'STEEL_API_KEY', 'AUTHORING_VERIFICATION_BROWSER_PROVIDER', 'AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION', 'INNGEST_SIGNING_KEY', 'NEXT_PUBLIC_APP_URL'}
          print(json.dumps({'worker': 'zyx-background-staging', 'variables': [{'key': item['key'], 'contexts': item.get('contexts')} for item in data if item.get('key') in keys]}))
          PYTHON
      - name: Operate exact staged revision
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: '1'
          ZYX_ENVIRONMENT: ${{ inputs.environment }}
          NEXT_PUBLIC_APP_URL: ${{ inputs.environment == 'production' && 'https://www.zyxacademy.com' || 'https://staging.zyxacademy.com' }}
          AUTHORING_VERIFICATION_BROWSER_PROVIDER: ${{ vars.AUTHORING_VERIFICATION_BROWSER_PROVIDER || secrets.AUTHORING_VERIFICATION_BROWSER_PROVIDER || 'cloudflare' }}
          AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION: ${{ vars.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION || secrets.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION }}
          V4_OPERATION: ${{ inputs.action }}
          V4_REVISION: ${{ inputs.revision }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
          STORAGE_PROVIDER_MODE: r2
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CF_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: bun scripts/authoring/operate-v4-verification.ts
      - uses: actions/upload-artifact@v4
        if: success() && inputs.action == 'evidence'
        with:
          name: v4-verification-evidence
          path: artifacts/v4-operations/
          retention-days: 3

  export-learning-content:
    if: inputs.action == 'prepare-fixture' && inputs.environment == 'staging' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read the exact production draft and learning dependencies
        env:
          V4_FIXTURE_MODE: export
          ZYX_ENVIRONMENT: production
          NEXT_PUBLIC_APP_URL: https://www.zyxacademy.com
          TURSO_DATABASE_URL: ${{ secrets.TURSO_CONNECTION_URL || secrets.DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CF_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: bun scripts/staging/prepare-v4-verification-fixture.ts
      - uses: actions/upload-artifact@v4
        with:
          name: v4-staging-learning-fixture
          path: artifacts/v4-fixture/
          retention-days: 1
    env: &a1
      NODE_ENV: production
      SKIP_ENV_VALIDATION: "1"
      STORAGE_PROVIDER_MODE: r2
      V4_REVISION: ${{ inputs.revision }}
  stage-and-verify:
    needs: export-learning-content
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: v4-staging-learning-fixture
          path: artifacts/v4-fixture/
      - run: bun scripts/authoring/prepare-web-verification.ts
      - name: Guard staging, insert missing learning dependencies, and request trusted verification
        env:
          V4_FIXTURE_MODE: import
          ZYX_ENVIRONMENT: staging
          ALLOW_STAGING_MUTATION: "1"
          BETTER_AUTH_URL: https://staging.zyxacademy.com
          NEXT_PUBLIC_APP_URL: https://staging.zyxacademy.com
          TURSO_DATABASE_URL: ${{ secrets.TURSO_CONNECTION_URL || secrets.DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          AUTHORING_VERIFICATION_BROWSER_PROVIDER: ${{ vars.AUTHORING_VERIFICATION_BROWSER_PROVIDER || secrets.AUTHORING_VERIFICATION_BROWSER_PROVIDER || 'cloudflare' }}
          AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION: ${{ vars.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION || secrets.AUTHORING_VERIFICATION_STEEL_BROWSER_VERSION }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CF_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: bun scripts/staging/prepare-v4-verification-fixture.ts
    env: *a1
