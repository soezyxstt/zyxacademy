name: Query lifecycle

on:
  pull_request:
    branches: [staging]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'tests/**'
      - 'messages/**'
      - 'package.json'
      - 'bun.lock'
      - 'playwright.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/query-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: query-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Query production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      BETTER_AUTH_SECRET: ci-contract-tests-only-not-a-real-secret
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - run: bun run build

  browser:
    name: Query lifecycle browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Each standalone fixture intercepts every request. Skip the Next server.
      PLAYWRIGHT_BASE_URL: http://query-lifecycle.invalid
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun run test:visual:install
      - name: Verify quiz, learning, and dashboard query flows
        run: >-
          bun run test:visual
          tests/visual/quiz-query.spec.ts
          tests/visual/learning-query.spec.ts
          tests/visual/dashboard-query.spec.ts
      - name: Upload report, screenshots, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-lifecycle-browser
          path: |
            artifacts/visual-quality/report/
            artifacts/visual-quality/results/
          if-no-files-found: warn
          retention-days: 7
