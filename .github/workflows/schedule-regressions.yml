name: Schedule Regression Suite

on:
  workflow_call:
  workflow_dispatch:

jobs:
  regression:
    name: Schedule regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: '1'
      BETTER_AUTH_SECRET: ci-contract-tests-only-not-a-real-secret
      DATABASE_URL: 'file::memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run schedule regression contracts
        run: >-
          bun test
          tests/contracts/tutorial-week-policy.test.ts
          tests/contracts/group-name-policy.test.ts
          tests/contracts/schedule-calendar-regressions.test.ts

      - name: Verify tutorial booking, refund, and read paths
        env:
          SKIP_ENV_VALIDATION: "1"
        run: |
          bun tests/integration/tutorial-booking-lifecycle.ts
          bun test tests/contracts/tutor-schedule-read-model.test.ts
          bun test tests/contracts/tutor-schedule-actions.test.ts -t 'charges only for a future WIB slot|preserves the original booking'
