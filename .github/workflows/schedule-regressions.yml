name: Schedule Regression Suite

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'app/(admin)/admin/(academic)/schedules/**'
      - 'app/(student)/dashboard/groups/**'
      - 'app/(student)/dashboard/schedule/**'
      - 'app/(tutor)/tutor/schedule/**'
      - 'components/admin/academic-schedules-dashboard.tsx'
      - 'components/dashboard/student-group-rename-panel.tsx'
      - 'components/schedule/**'
      - 'components/tutor/tutor-schedule-view.tsx'
      - 'db/schedule-extras.ts'
      - 'drizzle/0091_schedule_group_extras.sql'
      - 'drizzle/meta/_journal.json'
      - 'drizzle.config.ts'
      - 'lib/groups/group-name-policy.ts'
      - 'lib/schedule/week-policy.ts'
      - 'lib/schedule/tutor-policy.ts'
      - 'lib/schedule/tutor-read-model.ts'
      - 'tests/contracts/tutor-schedule-actions.test.ts'
      - 'tests/contracts/tutor-schedule-read-model.test.ts'
      - 'tests/integration/tutorial-booking-lifecycle.ts'
      - 'tests/contracts/group-name-policy.test.ts'
      - 'tests/contracts/schedule-calendar-regressions.test.ts'
      - 'tests/contracts/tutorial-week-policy.test.ts'
      - '.github/workflows/schedule-regressions.yml'
  workflow_dispatch:

concurrency:
  group: schedule-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Schedule regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run schedule regression contracts
        run: >-
          bun test
          tests/contracts/tutorial-week-policy.test.ts
          tests/contracts/group-name-policy.test.ts
          tests/contracts/schedule-calendar-regressions.test.ts

      - name: Verify tutorial booking, refund, and read paths
        env:
          SKIP_ENV_VALIDATION: "1"
        run: |
          bun tests/integration/tutorial-booking-lifecycle.ts
          bun test tests/contracts/tutor-schedule-read-model.test.ts
          bun test tests/contracts/tutor-schedule-actions.test.ts -t 'charges only for a future WIB slot|preserves the original booking'
