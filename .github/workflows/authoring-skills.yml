name: Validate MCP skills distribution

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Build and validate staging distribution
        run: bun run build:authoring-skills --environment staging
      - name: Validate catalog, protocol, digests, and importer limits
        run: bun test tests/contracts/authoring-skills.test.ts
      - name: Verify quiz authoring and playbook contracts
        env:
          SKIP_ENV_VALIDATION: '1'
          BETTER_AUTH_SECRET: 'ci-quiz-invariant-tests-only-not-a-real-secret'
        run: bun scripts/test-contracts.ts tests/contracts/authoring-mcp.test.ts tests/contracts/authoring-mcp-playbook.test.ts tests/contracts/question-authoring.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: authoring-skills-staging-${{ github.sha }}
          path: dist/skills/
          retention-days: 3
      - name: Build and validate production distribution
        run: |
          bun run build:authoring-skills --environment production
          bun test tests/contracts/authoring-skills.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: authoring-skills-production-${{ github.sha }}
          path: dist/skills/
          retention-days: 3
