name: Sonner Patch Once

on:
  push:
    branches:
      - fix/schedule-domain-calendar-tutor-shell

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-domain-calendar-tutor-shell
          fetch-depth: 0

      - name: Replace inline tutor feedback with Sonner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/tutor/tutor-schedule-view.tsx")
          text = path.read_text()

          if 'import { toast } from "sonner";' in text:
              print("Sonner patch already applied")
              raise SystemExit(0)

          replacements = [
              (
                  'import { useRouter } from "next/navigation";\n',
                  'import { useRouter } from "next/navigation";\nimport { toast } from "sonner";\n',
              ),
              (
                  '  CheckCircle2,\n  AlertCircle,\n',
                  '',
              ),
              (
                  '  const [feedback, setFeedback] = useState<{\n    type: "success" | "error";\n    message: string;\n  } | null>(null);\n',
                  '',
              ),
              (
                  '    setFeedback(null);\n',
                  '',
              ),
              (
                  '        setFeedback({ type: "success", message: "Slot ketersediaan berhasil ditambahkan." });\n',
                  '        toast.success("Slot ketersediaan berhasil ditambahkan.");\n',
              ),
              (
                  '        setFeedback({ type: "error", message: res.error || "Gagal menambahkan slot." });\n',
                  '        toast.error(res.error || "Gagal menambahkan slot.");\n',
              ),
              (
                  '        setFeedback({ type: "success", message: "Slot berhasil dihapus." });\n',
                  '        toast.success("Slot berhasil dihapus.");\n',
              ),
              (
                  '        setFeedback({ type: "error", message: res.error || "Gagal menghapus slot." });\n',
                  '        toast.error(res.error || "Gagal menghapus slot.");\n',
              ),
              (
                  '      setFeedback({ type: "error", message: "Harap pilih slot dan tanggal tujuan." });\n',
                  '      toast.error("Harap pilih slot dan tanggal tujuan.");\n',
              ),
              (
                  '        setFeedback({\n          type: "success",\n          message: res.movedDirectly\n            ? "Sesi berhasil dipindahkan."\n            : "Jadwal terkunci. Permohonan reschedule berhasil diajukan sebagai tiket.",\n        });\n',
                  '        if (res.movedDirectly) {\n          toast.success("Sesi berhasil dipindahkan.");\n        } else {\n          toast.info("Jadwal terkunci. Permohonan reschedule berhasil diajukan sebagai tiket.");\n        }\n',
              ),
              (
                  '        setFeedback({ type: "error", message: res.error || "Gagal memindahkan sesi." });\n',
                  '        toast.error(res.error || "Gagal memindahkan sesi.");\n',
              ),
              (
                  '        setFeedback({\n          type: "success",\n          message: `Tiket berhasil ${ticketDecision === "approved" ? "disetujui" : "ditolak"}.`,\n        });\n',
                  '        toast.success(`Tiket berhasil ${ticketDecision === "approved" ? "disetujui" : "ditolak"}.`);\n',
              ),
              (
                  '        setFeedback({ type: "error", message: res.error || "Gagal memproses tiket." });\n',
                  '        toast.error(res.error || "Gagal memproses tiket.");\n',
              ),
              (
                  '        setReplyText("");\n        router.refresh();\n',
                  '        setReplyText("");\n        toast.success("Balasan diskusi terkirim.");\n        router.refresh();\n',
              ),
              (
                  '        setFeedback({ type: "error", message: res.error || "Gagal mengirim pesan." });\n',
                  '        toast.error(res.error || "Gagal mengirim pesan.");\n',
              ),
              (
                  '        setFeedback({\n          type: "success",\n          message: `${result.createdCount} slot disalin dari pekan sebelumnya.${conflictMessage}`,\n        });\n',
                  '        toast.success(`${result.createdCount} slot disalin dari pekan sebelumnya.${conflictMessage}`);\n',
              ),
              (
                  '        setFeedback({ type: "error", message: result.error || "Gagal menyalin slot." });\n',
                  '        toast.error(result.error || "Gagal menyalin slot.");\n',
              ),
              (
                  '      {feedback && (\n        <div\n          className={`flex items-center gap-2 rounded-lg border p-2.5 text-body-sm ${\n            feedback.type === "success"\n              ? "border-status-success/20 bg-status-success/10 text-status-success"\n              : "border-status-error/20 bg-status-error/10 text-status-error"\n          }`}\n        >\n          {feedback.type === "success" ? <CheckCircle2 className="size-4 shrink-0" /> : <AlertCircle className="size-4 shrink-0" />}\n          <span>{feedback.message}</span>\n        </div>\n      )}\n\n',
                  '',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Sonner patch target not found:\n{old[:180]}")
              text = text.replace(old, new)

          if "setFeedback(" in text or "feedback &&" in text:
              raise SystemExit("Residual inline feedback state remains after Sonner patch")

          path.write_text(text)
          PY

      - name: Commit Sonner patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tutor/tutor-schedule-view.tsx
          git commit -m "fix(tutor): use Sonner for schedule feedback"
          git push origin HEAD:fix/schedule-domain-calendar-tutor-shell
