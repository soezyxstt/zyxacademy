name: Offline data checks

on:
  pull_request:
    paths:
      - 'lib/offline/**'
      - 'lib/native/**'
      - 'lib/query/**'
      - 'lib/date-utils.ts'
      - 'lib/student/navigation-query.ts'
      - 'lib/bundle/product-publication.ts'
      - 'lib/authoring/revision-service.ts'
      - 'lib/academic/course-canonical-sync.ts'
      - 'lib/migrasi/repository-kompatibilitas.ts'
      - 'components/offline/**'
      - 'components/navigation/student/student-mobile-destinations.ts'
      - 'components/navigation/student/student-mobile-hrefs.mjs'
      - 'components/providers/query-provider.tsx'
      - 'components/admin/offline-cache-settings.tsx'
      - 'components/course/structured-article-reader.tsx'
      - 'components/course/material-viewer.tsx'
      - 'app/offline/**'
      - 'app/api/offline/**'
      - 'app/api/admin/offline/**'
      - 'app/(admin)/admin/ops/offline/**'
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'db/schema.ts'
      - 'drizzle-postgres/**'
      - 'tests/**/*offline*'
      - 'messages/*/adminOps.json'
      - 'messages/*/admin.json'
      - 'scripts/build-native-offline.mjs'
      - '.github/workflows/offline-data-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Offline sync and cache tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      BETTER_AUTH_SECRET: ci-contract-tests-only-not-a-real-secret
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Check server transactions, scope and conditional reads
        run: bun test tests/contracts/offline-server-sync.test.ts
      - name: Check client races, recovery and native contracts
        run: bun test tests/unit/offline-versioned-client.test.ts tests/offline-shell-and-reader.test.ts tests/native-and-offline.test.ts tests/native-deeplinks-lifecycle.test.ts

  visuals:
    name: Native and admin visual review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://offline-native.fixture.test
      NEXT_TELEMETRY_DISABLED: '1'
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      ZYX_APP_CHANNEL: nightly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Exercise shipped native pages and real web components
        run: bunx playwright test tests/visual/offline- --project=mobile-380 --project=laptop-fhd-125
      - name: Upload final screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-data-mobile-desktop-${{ github.sha }}
          path: |
            artifacts/visual-quality/results/**/*.png
            artifacts/visual-quality/results/**/trace.zip
            artifacts/visual-quality/report/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android offline bridge compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZYX_APP_CHANNEL: nightly
      ZYX_APP_VERSION: 0.1.0-alpha.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: node scripts/build-native-offline.mjs
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Sync local assets and native plugins
        working-directory: apps/mobile
        run: npm run sync:android:nightly
      - name: Compile the unsigned debug bridge and run unit tests
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileNightlyDebugJavaWithJavac :app:testNightlyDebugUnitTest --stacktrace --no-daemon
