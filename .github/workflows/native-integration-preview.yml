      - 'lib/notifications/admin-broadcast-audience.ts'
      - 'jobs/admin-operations.ts'
      - 'tests/contracts/native-admin-broadcast-*.test.ts'
      - 'app/api/native/student/reading/**'
      - 'app/api/native/student/material-pdf/**'
      - 'lib/student/native-material-pdf*.ts'
      - 'tests/contracts/native-student-material-pdf.test.ts'
      - 'tests/unit/expo-material-pdf.test.ts'
      - 'lib/student/native-published-reading.ts'
      - 'lib/student/canonical-material-detail.ts'
      - 'tests/contracts/native-student-reading.test.ts'
      - 'tests/unit/expo-online-reading.test.ts'
      - 'tests/unit/expo-interactive-document.test.ts'
      - 'tests/unit/expo-assessment-visuals.test.ts'
