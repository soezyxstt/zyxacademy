      - 'tests/unit/expo-personal-account.test.ts'
      - 'components/gamification/zyra-*'
      - 'tests/unit/expo-pet-preview.test.ts'
      - 'app/api/native/academic/tutor-support/**'
      - 'app/api/tutor/analytics/refresh/**'
      - 'tests/contracts/tutor-downstream-bridge.test.ts'
      - 'tests/unit/expo-tutor-analytics.test.ts'
      - 'tests/contracts/native-tutor-discussion-mentions.test.ts'
