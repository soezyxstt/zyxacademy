name: Authoring access

on:
  pull_request:
    branches: [staging]
    paths:
      - 'lib/auth.ts'
      - 'lib/auth/**'
      - 'lib/authoring/mcp-auth.ts'
      - 'lib/authoring/mcp-oauth.ts'
      - 'lib/authoring/mcp-workflows.ts'
      - 'app/api/mcp/**'
      - 'app/mcp/authorize/**'
      - 'app/.well-known/oauth-authorization-server/**'
      - 'app/.well-known/oauth-protected-resource/**'
      - 'lib/auth-site-url.ts'
      - 'tests/integration/authoring-*.ts'
      - 'tests/contracts/mcp-*.test.*'
      - 'tests/contracts/authoring-mcp.test.ts'
      - 'scripts/staging/check-authoring-admin-roles.ts'
      - '.github/workflows/authoring-auth.yml'
  push:
    branches: [staging]
    paths:
      - 'lib/auth.ts'
      - 'lib/auth/authorization.ts'
      - 'lib/auth/peran.ts'
      - 'lib/authoring/mcp-auth.ts'
      - 'scripts/staging/check-authoring-admin-roles.ts'
      - '.github/workflows/authoring-auth.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Test admin roles, consent and token use
        env:
          SKIP_ENV_VALIDATION: '1'
        run: |
          bun tests/integration/authoring-admin-role.ts
          bun tests/integration/authoring-oauth-consent.ts
          bun scripts/test-contracts.ts tests/contracts/mcp-oauth-authorize-page.test.ts tests/contracts/mcp-consent.test.tsx tests/contracts/authoring-mcp.test.ts

  audit-staging-roles:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Count legacy admins without an active canonical role
        env:
          ZYX_ENVIRONMENT: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_EXPECTED_HOST: ${{ vars.NEON_EXPECTED_HOST }}
        run: bun scripts/staging/check-authoring-admin-roles.ts
