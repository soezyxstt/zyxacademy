name: Native authenticated preview

on:
  workflow_call:
    inputs:
      android:
        type: boolean
        default: false
      staff:
        type: boolean
        default: false
      offline:
        type: string
        default: ''
      probe:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-authenticated-preview-${{ github.event.pull_request.number || github.ref }}${{ inputs.staff && '-staff' || '' }}${{ inputs.offline == 'only' && '-offline' || '' }}${{ inputs.probe && '-chrome-probe' || '' }}
  cancel-in-progress: true

jobs:
  authenticated-routes:
    if: github.head_ref == 'soezyxst/react-native-monorepo' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'soezyxst/react-native-monorepo')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: native_preview
          POSTGRES_PASSWORD: native_preview
          POSTGRES_DB: native_preview
        ports:
          - 127.0.0.1:55453:5432
        options: >-
          --health-cmd "pg_isready -U native_preview -d native_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://native_preview:native_preview@127.0.0.1:55453/native_preview
      NATIVE_PRODUCT_AUTH_FIXTURE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: inputs.android || inputs.offline == 'only'
        uses: actions/download-artifact@v4
        with:
          name: mounted-product-sources
          path: ${{ runner.temp }}/product-source
      - if: inputs.android || inputs.offline == 'only'
        name: Restore the exact mounted product tree
        run: bash scripts/native-readiness/product-auth/restore-mounted.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Verify the authenticated Expo protocol over loopback HTTPS
        env:
          AUTH_STUDENT_PRODUCT: ${{ inputs.android }}
          AUTH_OFFLINE_PRODUCT: ${{ inputs.offline == 'only' }}
        run: |
          umask 077
          tls_dir="$(mktemp -d "${RUNNER_TEMP}/native-auth.XXXXXX")"
          trap 'rm -rf "$tls_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
            -keyout "$tls_dir/key.pem" -out "$tls_dir/cert.pem" 2>/dev/null
          bun --no-env-file scripts/native-readiness/product-auth/smoke.ts "$tls_dir/cert.pem" "$tls_dir/key.pem"

  authenticated-android:
    needs: authenticated-routes
    if: inputs.android || inputs.staff || inputs.offline == 'only' || inputs.probe
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: native_preview
          POSTGRES_PASSWORD: native_preview
          POSTGRES_DB: native_preview
        ports:
          - 127.0.0.1:55453:5432
        options: >-
          --health-cmd "pg_isready -U native_preview -d native_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://native_preview:native_preview@127.0.0.1:55453/native_preview
      NATIVE_PRODUCT_AUTH_FIXTURE: '1'
      NATIVE_PRODUCT_AUTH_STAFF: ${{ inputs.staff }}
      NATIVE_PRODUCT_AUTH_OFFLINE: ${{ inputs.offline }}
      NATIVE_PRODUCT_AUTH_CHROME_PROBE: ${{ inputs.probe }}
      EXPO_NO_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: inputs.probe == false
        uses: actions/download-artifact@v4
        with:
          name: mounted-product-sources
          path: ${{ runner.temp }}/product-source
      - if: inputs.probe == false
        name: Restore the exact mounted product tree
        run: bash scripts/native-readiness/product-auth/restore-mounted.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - if: inputs.probe == false
        run: npm ci
        working-directory: apps/mobile-native
      - if: inputs.probe == false
        name: Compile a disposable loopback APK
        run: bash scripts/native-readiness/product-auth/android-build.sh
      - if: inputs.probe
        name: Prepare only the runner-local Chrome trust certificate
        run: bash scripts/native-readiness/product-auth/android-tls.sh
      - run: sudo chmod a+rw /dev/kvm
      - name: Drive the real browser and authenticated Expo route
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: bash scripts/native-readiness/product-auth/android-run.sh
