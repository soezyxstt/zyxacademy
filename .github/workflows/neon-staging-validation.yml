name: Validate Neon migration build

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      demo_visual:
        description: Run the credential-free demo visual check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'migration/neon-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:authoring-skills
      - run: bun test scripts/neon/copy-storage.test.ts scripts/neon/storage-manifest.test.ts scripts/neon/import-core.test.ts scripts/neon/source-snapshot.test.ts scripts/neon/validate-production-target.test.ts
      - name: Run complete contract shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bun - <<'TS'
          import assert from "node:assert/strict";
          const shard = Number(process.env.SHARD);
          assert.ok(shard === 0 || shard === 1);
          const all = [...new Bun.Glob("tests/contracts/**/*.test.{ts,tsx}").scanSync()].sort();
          const files = all.filter((_, index) => index % 2 === shard);
          console.log(JSON.stringify({ shard, totalFiles: all.length, selectedFiles: files.length }));
          process.argv = [process.execPath, "scripts/test-contracts.ts", ...files];
          await import("./scripts/test-contracts.ts");
          TS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-contracts-${{ matrix.shard }}
          path: artifacts/test-contracts/
          retention-days: 7
  demo-visual:
    if: github.event_name == 'workflow_dispatch' && inputs.demo_visual
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run isolated demo visual checks
        run: |
          python3 scripts/visual/prepare-demo-harness.py
          cd artifacts/visual-quality/demo-harness
          env -i PATH="$PATH" HOME="$HOME" DEMO_VISUAL_DELAY_MS=6000 SKIP_ENV_VALIDATION=1 DATABASE_URL=postgresql://localhost:1/fixture BETTER_AUTH_SECRET=fixture-only-secret-not-used-for-auth NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000 bun run dev -- --hostname 127.0.0.1 > /tmp/demo-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd ../../..
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --output /dev/null http://127.0.0.1:3000/id/demo
          DEMO_STREAMING_VISUAL=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 bun run test:visual -- tests/visual/demo-streaming-focused.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-visual
          path: |
            artifacts/visual-quality/results/
            artifacts/visual-quality/report/
            /tmp/demo-visual-server.log
          retention-days: 7
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'migration/neon-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: placeholder
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_OUTPUT: standalone
      NODE_OPTIONS: --max-old-space-size=4096
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      BETTER_AUTH_SECRET: isolated-build-secret-with-no-external-access
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: disabled-build
      GOOGLE_CLIENT_SECRET: disabled-build
      RESEND_API_KEY: disabled-build
      GEMINI_API_KEY: disabled-build
      INNGEST_EVENT_KEY: disabled-build
      INNGEST_SIGNING_KEY: disabled-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Prepare disposable PostgreSQL build fixture
        run: |
          bun - <<'TS'
          import assert from "node:assert/strict";
          import { Client } from "pg";
          import { drizzle } from "drizzle-orm/node-postgres";
          import { migrate } from "drizzle-orm/node-postgres/migrator";
          const target = new URL(process.env.DATABASE_URL!);
          assert.equal(target.hostname, "127.0.0.1");
          assert.equal(target.pathname, "/placeholder");
          const client = new Client({ connectionString: target.href });
          try {
            await client.connect();
            await migrate(drizzle(client), { migrationsFolder: "drizzle-postgres" });
          } finally { await client.end(); }
          TS
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run worker:deno:audit
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: bun test tests/unit/form-presentation.test.ts tests/unit/form-studio-features.test.ts
      - run: bun run build
      - run: node --check .next/standalone/server.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-build-runtime
          path: lib/compute/product-v4-build-runtime.json
          retention-days: 7
