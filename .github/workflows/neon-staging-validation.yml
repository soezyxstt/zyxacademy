name: Validate Neon staging build

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'migration/neon-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_OUTPUT: standalone
      NODE_OPTIONS: --max-old-space-size=4096
      ZYX_POSTGRES_BUILD_PLACEHOLDER: '1'
      SKIP_ENV_VALIDATION: '1'
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      BETTER_AUTH_SECRET: isolated-build-secret-with-no-external-access
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: disabled-build
      GOOGLE_CLIENT_SECRET: disabled-build
      RESEND_API_KEY: disabled-build
      GEMINI_API_KEY: disabled-build
      INNGEST_EVENT_KEY: disabled-build
      INNGEST_SIGNING_KEY: disabled-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node --check .next/standalone/server.js
