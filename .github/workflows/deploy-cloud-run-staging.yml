name: Deploy staging web to Cloud Run

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Import required staging secrets, build a candidate, promote, or roll back
        required: true
        type: choice
        default: candidate
        options: [import-secrets, candidate, promote, rollback]
      revision:
        description: Exact revision from the workflow summary (promote or rollback)
        type: string
      reviewed:
        description: Confirm the migration, matching workers and revision acceptance gates in the Cloud Run runbook
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run-staging
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/staging' && inputs.operation != 'import-secrets'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      QUEUE_PROVIDER: ${{ vars.QUEUE_PROVIDER || 'inngest' }}
      CLOUD_RUN_OPERATION: ${{ inputs.operation }}
      CLOUD_RUN_REVISION: ${{ inputs.revision }}
      CLOUD_RUN_REVIEWED: ${{ inputs.reviewed }}
      CLOUD_RUN_PUBLIC_CONFIG: ${{ vars.CLOUD_RUN_STAGING_PUBLIC_CONFIG }}
      CLOUD_RUN_PREFLIGHT_DATABASE_VERSION: ${{ vars.CLOUD_RUN_STAGING_PREFLIGHT_DATABASE_VERSION }}
      CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CLOUD_RUN_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dispatch and staging configuration
        run: python3 .github/scripts/deploy_cloud_run_staging.py prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install preflight dependencies from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check release contracts
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test deploy/cloud-run/origin-gateway.test.mjs workers/staging-web-edge/index.test.mjs
      - name: Verify public media manifest
        if: inputs.operation == 'candidate'
        run: node scripts/cloud-run/publish-public-media.mjs
      - name: Build and test the isolated image
        if: inputs.operation == 'candidate'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          image="zyx-staging-web:$GITHUB_SHA"
          build_secrets=(--secret "id=public_config,src=$RUNNER_TEMP/cloud-run-public.json")
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            build_secrets+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi
          docker build --platform linux/amd64 --file Dockerfile.cloud-run \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "CLOUD_RUN_BUILD_ID=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${build_secrets[@]}" --tag "$image" .
          bash .github/scripts/smoke-cloud-run.sh "$image"
          printf 'Local image size: %s bytes\n' "$(docker image inspect --format '{{.Size}}' "$image")" >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: zyx-academy
          workload_identity_provider: ${{ vars.CLOUD_RUN_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: zyx-staging-web-ci@zyx-academy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 520.0.0'
      - name: Release only to the isolated Cloud Run staging service
        run: python3 .github/scripts/deploy_cloud_run_staging.py release

  import-secrets:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/staging' && inputs.operation == 'import-secrets'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: zyx-academy
          workload_identity_provider: ${{ vars.CLOUD_RUN_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: zyx-staging-web-ci@zyx-academy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 520.0.0'
      - name: Import allowlisted staging credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COMPUTE_SERVICE_SECRET: ${{ secrets.COMPUTE_SERVICE_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIKTAT_RENDERER_SECRET: ${{ secrets.DIKTAT_RENDERER_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 .github/scripts/import_cloud_run_staging_secrets.py
