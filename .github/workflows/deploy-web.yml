name: Build and deploy web

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so an older upload cannot overtake a newer release.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.HOLD_WEB_DEPLOYMENT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      # Non-secret IDs verified against the project's Vercel configuration.
      VERCEL_ORG_ID: team_rMFT8hSTCTObKzXirjJcbMFc
      VERCEL_PROJECT_ID: prj_9wDdc36VFIH5wJT45jEXIHGst2pb
      VERCEL_CLI_VERSION: '65.2.0'
      VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Validate production Neon target
        # Vercel pull substitutes [SENSITIVE] for production secrets.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER_MODE: ${{ vars.STORAGE_PROVIDER_MODE || secrets.STORAGE_PROVIDER_MODE }}
          NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET || secrets.NEON_STORAGE_BUCKET }}
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 || secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bun scripts/neon/validate-production-target.ts
      - name: Build and deploy production on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Public signing-certificate fingerprints served by /.well-known/assetlinks.json.
          ANDROID_APP_LINKS_SHA256_FINGERPRINTS: ${{ secrets.ANDROID_APP_LINKS_SHA256_FINGERPRINTS }}
        run: |
          set -euo pipefail
          runtime_env=()
          if [ -n "${ANDROID_APP_LINKS_SHA256_FINGERPRINTS:-}" ]; then
            runtime_env+=(--env "ANDROID_APP_LINKS_SHA256_FINGERPRINTS=$ANDROID_APP_LINKS_SHA256_FINGERPRINTS")
          fi
          vercel deploy --prod --yes --archive=tgz "${runtime_env[@]}" \
            --meta githubDeployment=1 \
            --meta githubCommitOrg=soezyxstt \
            --meta githubCommitRepo=zyxacademy \
            --meta "githubCommitRef=$GITHUB_REF_NAME" \
            --meta "githubCommitSha=$GITHUB_SHA" > "$RUNNER_TEMP/web-deployment-url.txt"
          printf 'Web deployment (%s): %s\n' "$VERCEL_ENVIRONMENT" \
            "$(cat "$RUNNER_TEMP/web-deployment-url.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove pulled environment files and build output
        if: always()
        run: rm -rf .vercel

  # Staging releases require an explicit dispatch, including while production is held.
  staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      # Non-secret IDs verified against the project's Vercel configuration.
      VERCEL_ORG_ID: team_rMFT8hSTCTObKzXirjJcbMFc
      VERCEL_PROJECT_ID: prj_9wDdc36VFIH5wJT45jEXIHGst2pb
      VERCEL_CLI_VERSION: '65.2.0'
      VERCEL_ENVIRONMENT: staging
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Validate and sync staging runtime configuration
        env:
          GITHUB_RUNTIME_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_RUNTIME_VARS: ${{ toJSON(vars) }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 .github/scripts/sync_vercel_staging.py
      - name: Build and deploy staging on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy --target=staging --yes --archive=tgz \
            --meta githubDeployment=1 \
            --meta githubCommitOrg=soezyxstt \
            --meta githubCommitRepo=zyxacademy \
            --meta "githubCommitRef=$GITHUB_REF_NAME" \
            --meta "githubCommitSha=$GITHUB_SHA" > "$RUNNER_TEMP/web-deployment-url.txt"
          printf 'Web deployment (%s): %s\n' "$VERCEL_ENVIRONMENT" \
            "$(cat "$RUNNER_TEMP/web-deployment-url.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove pulled environment files and build output
        if: always()
        run: rm -rf .vercel
