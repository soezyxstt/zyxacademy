name: Verify exact V4 product in CI

on:
  workflow_dispatch:
    inputs:
      importId:
        description: Exact production draft import ID
        type: string
        required: true
      runId:
        description: Existing authoring run ID for this draft
        type: string
        required: true
      expectedChecksum:
        description: Exact draft bundle checksum read before dispatch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: verify-product-v4-production-${{ inputs.importId }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'soezyxstt/zyxacademy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the repository-pinned local Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Prepare private production settings with existing target guards
        env:
          GITHUB_ENVIRONMENT_NAME: production
          GITHUB_RUNTIME_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_RUNTIME_VARS: ${{ toJSON(vars) }}
        run: |
          umask 077
          python3 .github/scripts/prepare_worker_runtime.py artifacts/v4-ci-private/.env.runtime.json
      - name: Execute and persist observed verification for the exact draft
        env:
          V4_IMPORT_ID: ${{ inputs.importId }}
          V4_RUN_ID: ${{ inputs.runId }}
          V4_EXPECTED_CHECKSUM: ${{ inputs.expectedChecksum }}
        run: bun scripts/authoring/verify-product-v4-ci.ts artifacts/v4-ci-private/.env.runtime.json
      - name: Remove private runtime settings
        if: always()
        run: rm -f artifacts/v4-ci-private/.env.runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-production-verification-evidence-${{ github.run_id }}
          path: artifacts/v4-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
