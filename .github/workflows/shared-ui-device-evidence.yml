name: Shared UI device evidence

on:
  pull_request:
    branches: [soezyxst/react-native-monorepo]
    paths:
      - 'apps/mobile-native/features/shared-ui/**'
      - 'packages/native-parity/shared-ui/**'
      - 'tests/visual/native-parallel/shared-ui/**'
      - '.maestro/native-parallel/shared-ui/**'
      - '.github/workflows/shared-ui-device-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devices:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'native-migration/shared-ui'
    name: Shared UI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    concurrency:
      group: shared-ui-evidence-${{ matrix.platform }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      SHARED_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
      SHARED_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_BUILD }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native and web test dependencies
        run: |
          set -euo pipefail
          mkdir -p "artifacts/native-parity/shared-ui/$SHARED_PLATFORM"
          test "$(git rev-parse HEAD)" = "$SHARED_BUILD"
          bun install --frozen-lockfile
          npm ci --prefix apps/mobile-native
          python -m pip install Pillow==12.2.0
          if [[ "$RUNNER_OS" == Linux ]]; then
            node_modules/.bin/playwright install --with-deps chromium
          else
            node_modules/.bin/playwright install chromium
          fi
      - name: Install verified Maestro CLI
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/shared-ui-maestro"
          cd "$RUNNER_TEMP/shared-ui-maestro"
          curl --fail --silent --show-error --location --retry 3 --max-time 300 \
            -o maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          echo '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  maestro.zip' | shasum -a 256 -c -
          unzip -q maestro.zip
          echo "$PWD/maestro/bin" >> "$GITHUB_PATH"
      - name: Prepare reference host and resolve gallery assets
        run: |
          set -euo pipefail
          output="artifacts/native-parity/shared-ui/$SHARED_PLATFORM"
          # The gallery imports JPEGs outside the npm-isolated app. Resolve Metro's
          # standard RN asset registry from the app for this test-only build.
          echo 'module.exports.transformer.assetRegistryPath = require.resolve("react-native/asset-registry");' >> apps/mobile-native/metro.config.js
          git diff -- apps/mobile-native/metro.config.js > "$output/test-build.patch"
          git rev-parse HEAD > "$output/checkout-sha.txt"
          node node_modules/next/dist/bin/next dev tests/visual/native-parallel/shared-ui --hostname 127.0.0.1 --port 3217 > "$output/next.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3217/shared-ui-shell-back-light -o /dev/null
      - if: matrix.platform == 'android'
        name: Build release APK for x86_64
        working-directory: apps/mobile-native
        run: |
          npx --no-install expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2
      - if: matrix.platform == 'android'
        run: sudo chmod a+rw /dev/kvm
      - if: matrix.platform == 'android'
        name: Verify Android phone and tablet cases
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/visual/native-parallel/shared-ui/device/ci-android.sh
      - if: matrix.platform == 'ios'
        name: Verify iPhone and iPad cases
        run: bash tests/visual/native-parallel/shared-ui/device/ci-ios.sh
      - name: Archive evidence and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-${{ matrix.platform }}-${{ env.SHARED_BUILD }}-attempt-${{ github.run_attempt }}
          path: artifacts/native-parity/shared-ui/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14
