name: Deploy Deno Background Worker

on:
  push:
    branches:
      - main
      - staging
    # Start cheaply on broad code areas, then decide from the actual worker
    # dependency graph whether a Deno deploy is needed.
    paths:
      - 'workers/deno-background/**'
      - 'jobs/**'
      - 'db/**'
      - 'lib/**'
      - 'prompts/**'
      - 'deno.json'
      - 'deno.lock'
      - 'package.json'
      - 'scripts/audit-worker-dependencies.ts'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - staging
    # PR validation stays broad so a new transitive worker dependency is checked
    # before it can be merged into staging.
    paths:
      - 'workers/deno-background/**'
      - 'jobs/**'
      - 'db/**'
      - 'lib/**'
      - 'prompts/**'
      - 'deno.json'
      - 'deno.lock'
      - 'package.json'
      - 'scripts/audit-worker-dependencies.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Validate Deno Worker Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Worker Dependency Graph
        run: >-
          deno run -A scripts/audit-worker-dependencies.ts
          --dependency-output=artifacts/deno-worker-dependencies.txt

      - name: Upload dependency graph on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deno-worker-dependency-audit
          path: artifacts/deno-worker-dependencies.txt
          retention-days: 1

  deploy:
    name: Deploy Background Worker (${{ github.ref_name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The impact gate compares github.event.before with the pushed commit.
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Worker Dependency Audit
        run: >-
          deno run -A scripts/audit-worker-dependencies.ts
          --dependency-output=artifacts/deno-worker-dependencies.txt

      - name: Detect Worker Impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Manual runs are explicit deploy requests.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow run: deploying worker."
            exit 0
          fi

          # A zero/empty before SHA can happen on the first push of a ref. Be
          # conservative and deploy instead of trying to infer an incomplete diff.
          if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "No usable before SHA: deploying worker."
            exit 0
          fi

          mkdir -p artifacts
          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | sort -u > artifacts/changed-files.txt

          echo "Changed files:"
          cat artifacts/changed-files.txt

          # These files affect worker resolution/deploy behavior even when they
          # are not regular source imports in the dependency graph.
          if grep -Eq '^(workers/deno-background/|deno\.json$|deno\.lock$|package\.json$|scripts/audit-worker-dependencies\.ts$|\.github/workflows/deploy\.yml$)' artifacts/changed-files.txt; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Worker runtime/configuration changed: deploying worker."
            exit 0
          fi

          # The dependency file is generated from the current deployed entrypoint,
          # so newly-added transitive imports are picked up automatically.
          if grep -Fxf artifacts/deno-worker-dependencies.txt artifacts/changed-files.txt >/dev/null 2>&1; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "A deployed worker dependency changed: deploying worker."
            exit 0
          fi

          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "No deployed worker dependency changed: skipping Deno deploy."

      - name: Worker Typecheck
        if: steps.impact.outputs.should_deploy == 'true'
        run: deno check workers/deno-background/main.ts

      - name: Configure Target Environment
        if: steps.impact.outputs.should_deploy == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_NAME=zyx-background" >> $GITHUB_ENV
            echo "APP_URL=https://zyx-background.soezyxst.deno.net" >> $GITHUB_ENV
          else
            echo "APP_NAME=zyx-background-staging" >> $GITHUB_ENV
            echo "APP_URL=https://zyx-background-staging.soezyxst.deno.net" >> $GITHUB_ENV
          fi

      - name: Provision Deno Deploy App (if not exists)
        if: steps.impact.outputs.should_deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deploy create --non-interactive \
            --org soezyxst \
            --app $APP_NAME \
            --source local \
            --do-not-use-detected-build-config \
            --runtime-mode dynamic \
            --entrypoint workers/deno-background/main.ts \
            --region us \
            || echo "App $APP_NAME already exists or initialized."

      - name: Sync Environment Variables to Deno Deploy
        if: steps.impact.outputs.should_deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SECRET_INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          SECRET_INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SECRET_GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SECRET_GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          SECRET_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SECRET_CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          SECRET_CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          SECRET_CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          SECRET_VECTORIZE_WORKER_URL: ${{ secrets.VECTORIZE_WORKER_URL }}
          SECRET_VECTORIZE_WORKER_SECRET: ${{ secrets.VECTORIZE_WORKER_SECRET }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_DIKTAT_RENDERER_URL: ${{ secrets.DIKTAT_RENDERER_URL }}
          SECRET_DIKTAT_RENDERER_SECRET: ${{ secrets.DIKTAT_RENDERER_SECRET }}
        run: |
          cat << EOF > .env.deploy
          DATABASE_URL=${SECRET_DATABASE_URL}
          TURSO_AUTH_TOKEN=${SECRET_TURSO_AUTH_TOKEN}
          INNGEST_EVENT_KEY=${SECRET_INNGEST_EVENT_KEY}
          INNGEST_SIGNING_KEY=${SECRET_INNGEST_SIGNING_KEY}
          INNGEST_SERVE_ORIGIN=${APP_URL}
          INNGEST_SERVE_PATH=/api/inngest
          GEMINI_API_KEY=${SECRET_GEMINI_API_KEY}
          GEMINI_API_KEY_2=${SECRET_GEMINI_API_KEY_2}
          GEMINI_API_KEY_3=${SECRET_GEMINI_API_KEY_3}
          GEMINI_API_KEY_4=${SECRET_GEMINI_API_KEY_4}
          CF_ACCOUNT_ID=${SECRET_CF_ACCOUNT_ID}
          CF_R2_ACCESS_KEY_ID=${SECRET_CF_R2_ACCESS_KEY_ID}
          CF_R2_SECRET_ACCESS_KEY=${SECRET_CF_R2_SECRET_ACCESS_KEY}
          CF_R2_BUCKET=${SECRET_CF_R2_BUCKET}
          VECTORIZE_WORKER_URL=${SECRET_VECTORIZE_WORKER_URL}
          VECTORIZE_WORKER_SECRET=${SECRET_VECTORIZE_WORKER_SECRET}
          RESEND_API_KEY=${SECRET_RESEND_API_KEY}
          DIKTAT_RENDERER_URL=${SECRET_DIKTAT_RENDERER_URL}
          DIKTAT_RENDERER_SECRET=${SECRET_DIKTAT_RENDERER_SECRET}
          EOF

          grep -v '=$' .env.deploy > .env.deploy.filtered || true

          if [ -s .env.deploy.filtered ]; then
            deno run -A jsr:@deno/deploy env load --replace .env.deploy.filtered --org soezyxst --app $APP_NAME --non-interactive
            echo "Environment variables successfully synced to $APP_NAME."
          else
            echo "No secrets found in repository/environment to sync."
          fi
          rm -f .env.deploy .env.deploy.filtered

      - name: Deploy Worker to Deno Deploy
        if: steps.impact.outputs.should_deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deploy --non-interactive --org soezyxst --app $APP_NAME --prod

      - name: Verify Worker Health Check
        if: steps.impact.outputs.should_deploy == 'true'
        run: |
          echo "Verifying healthcheck at $APP_URL/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed: $APP_URL is live and healthy."
              exit 0
            fi
            echo "Attempt $i: Status is $STATUS, waiting 5 seconds..."
            sleep 5
          done
          echo "Worker healthcheck failed with status $STATUS"
          exit 1

      - name: Automated Inngest App Sync
        if: steps.impact.outputs.should_deploy == 'true'
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
        run: |
          # App ID matches the Inngest client id in jobs/client.ts (zyx-academy).
          # Staging and production stay isolated via their Inngest environment
          # API keys stored per GitHub Environment. Signing key is still used
          # by the worker to verify requests, it is not used for sync.
          if [ -n "$INNGEST_API_KEY" ]; then
            echo "Triggering automated Inngest App Sync for $APP_URL/api/inngest..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.inngest.com/v2/apps/zyx-academy/syncs" \
              -H "Authorization: Bearer ${INNGEST_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"${APP_URL}/api/inngest\"}")
            echo "$RESPONSE"
          else
            echo "INNGEST_API_KEY not provided, skipping automated sync."
          fi
