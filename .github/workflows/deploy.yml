name: Deploy Deno Background Worker

on:
  push:
    branches:
      - main
      - staging
    paths:
      # Keep this list narrow. scripts/audit-worker-dependencies.ts verifies that
      # every transitive worker dependency is covered here.
      # BEGIN DENO_DEPLOY_PATHS
      - 'workers/deno-background/**'
      - 'jobs/admin-knowledge.ts'
      - 'jobs/analytics.ts'
      - 'jobs/assessment.ts'
      - 'jobs/audit.ts'
      - 'jobs/client.ts'
      - 'jobs/compute.ts'
      - 'jobs/diktat-pdf.ts'
      - 'jobs/feedback.ts'
      - 'jobs/generation.ts'
      - 'jobs/mastery.ts'
      - 'jobs/pdf.ts'
      - 'jobs/reflection.ts'
      - 'jobs/search-sync.ts'
      - 'jobs/vector-sync.ts'
      - 'db/index.ts'
      - 'db/schema.ts'
      - 'lib/admin-ops-ai/**'
      - 'lib/ai/**'
      - 'lib/authoring/**'
      - 'lib/bundle/**'
      - 'lib/compute/**'
      - 'lib/db/**'
      - 'lib/email-preferences/**'
      - 'lib/search/**'
      - 'lib/storage/**'
      - 'lib/student-quiz-analytics/**'
      - 'lib/vectorize/**'
      - 'lib/ai-router.ts'
      - 'lib/assessment-extractor.ts'
      - 'lib/cohort-analytics.ts'
      - 'lib/content-quality-auditor.ts'
      - 'lib/context-assembly.ts'
      - 'lib/date-utils.ts'
      - 'lib/document-filters.ts'
      - 'lib/flashcard-generator.ts'
      - 'lib/gemini.ts'
      - 'lib/generation-pipeline.ts'
      - 'lib/knowledge-service.ts'
      - 'lib/ko-utils.ts'
      - 'lib/kv-cache.ts'
      - 'lib/learning-context.ts'
      - 'lib/learning-events.ts'
      - 'lib/mastery-recompute.ts'
      - 'lib/mastery-store.ts'
      - 'lib/material-generator.ts'
      - 'lib/material-storage.ts'
      - 'lib/mistake-feedback.ts'
      - 'lib/ops-metrics.ts'
      - 'lib/option-stats.ts'
      - 'lib/prompt-executor.ts'
      - 'lib/question-generator.ts'
      - 'lib/reflection-service.ts'
      - 'lib/remediation.ts'
      - 'lib/streak-service.ts'
      - 'lib/vectorize-client.ts'
      - 'lib/zyra/runtime-env.ts'
      - 'deno.json'
      - 'deno.lock'
      - '.github/workflows/deploy.yml'
      # END DENO_DEPLOY_PATHS
  pull_request:
    branches:
      - staging
    # PR validation is intentionally broader than the deploy trigger. It is a
    # cheap static audit and catches newly-added worker dependencies before merge.
    paths:
      - 'workers/deno-background/**'
      - 'jobs/**'
      - 'db/**'
      - 'lib/**'
      - 'prompts/**'
      - 'deno.json'
      - 'deno.lock'
      - 'scripts/audit-worker-dependencies.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-path-audit:
    name: Validate Deno Dependency Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Worker Dependency Trigger Coverage
        run: >-
          deno run -A scripts/audit-worker-dependencies.ts
          --check-deploy-paths
          --dependency-output=artifacts/deno-worker-dependencies.txt

      - name: Upload dependency graph on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deno-worker-dependency-audit
          path: artifacts/deno-worker-dependencies.txt
          retention-days: 1

  deploy:
    name: Deploy Background Worker (${{ github.ref_name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Worker Dependency Audit
        run: deno run -A scripts/audit-worker-dependencies.ts --check-deploy-paths

      - name: Worker Typecheck
        run: deno check workers/deno-background/main.ts

      - name: Configure Target Environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_NAME=zyx-background" >> $GITHUB_ENV
            echo "APP_URL=https://zyx-background.soezyxst.deno.net" >> $GITHUB_ENV
          else
            echo "APP_NAME=zyx-background-staging" >> $GITHUB_ENV
            echo "APP_URL=https://zyx-background-staging.soezyxst.deno.net" >> $GITHUB_ENV
          fi

      - name: Provision Deno Deploy App (if not exists)
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deploy create --non-interactive \
            --org soezyxst \
            --app $APP_NAME \
            --source local \
            --do-not-use-detected-build-config \
            --runtime-mode dynamic \
            --entrypoint workers/deno-background/main.ts \
            --region us \
            || echo "App $APP_NAME already exists or initialized."

      - name: Sync Environment Variables to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SECRET_INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          SECRET_INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SECRET_GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SECRET_GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          SECRET_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SECRET_CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          SECRET_CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          SECRET_CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          SECRET_VECTORIZE_WORKER_URL: ${{ secrets.VECTORIZE_WORKER_URL }}
          SECRET_VECTORIZE_WORKER_SECRET: ${{ secrets.VECTORIZE_WORKER_SECRET }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat << EOF > .env.deploy
          DATABASE_URL=${SECRET_DATABASE_URL}
          TURSO_AUTH_TOKEN=${SECRET_TURSO_AUTH_TOKEN}
          INNGEST_EVENT_KEY=${SECRET_INNGEST_EVENT_KEY}
          INNGEST_SIGNING_KEY=${SECRET_INNGEST_SIGNING_KEY}
          INNGEST_SERVE_ORIGIN=${APP_URL}
          INNGEST_SERVE_PATH=/api/inngest
          GEMINI_API_KEY=${SECRET_GEMINI_API_KEY}
          GEMINI_API_KEY_2=${SECRET_GEMINI_API_KEY_2}
          GEMINI_API_KEY_3=${SECRET_GEMINI_API_KEY_3}
          GEMINI_API_KEY_4=${SECRET_GEMINI_API_KEY_4}
          CF_ACCOUNT_ID=${SECRET_CF_ACCOUNT_ID}
          CF_R2_ACCESS_KEY_ID=${SECRET_CF_R2_ACCESS_KEY_ID}
          CF_R2_SECRET_ACCESS_KEY=${SECRET_CF_R2_SECRET_ACCESS_KEY}
          CF_R2_BUCKET=${SECRET_CF_R2_BUCKET}
          VECTORIZE_WORKER_URL=${SECRET_VECTORIZE_WORKER_URL}
          VECTORIZE_WORKER_SECRET=${SECRET_VECTORIZE_WORKER_SECRET}
          RESEND_API_KEY=${SECRET_RESEND_API_KEY}
          EOF

          grep -v '=$' .env.deploy > .env.deploy.filtered || true

          if [ -s .env.deploy.filtered ]; then
            deno run -A jsr:@deno/deploy env load --replace .env.deploy.filtered --org soezyxst --app $APP_NAME --non-interactive
            echo "Environment variables successfully synced to $APP_NAME."
          else
            echo "No secrets found in repository/environment to sync."
          fi
          rm -f .env.deploy .env.deploy.filtered

      - name: Deploy Worker to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno run -A jsr:@deno/deploy --non-interactive --org soezyxst --app $APP_NAME --prod

      - name: Verify Worker Health Check
        run: |
          echo "Verifying healthcheck at $APP_URL/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed: $APP_URL is live and healthy."
              exit 0
            fi
            echo "Attempt $i: Status is $STATUS, waiting 5 seconds..."
            sleep 5
          done
          echo "Worker healthcheck failed with status $STATUS"
          exit 1

      - name: Automated Inngest App Sync
        env:
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
        run: |
          if [ -n "$INNGEST_SIGNING_KEY" ]; then
            echo "Triggering automated Inngest App Sync for $APP_URL/api/inngest..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT "https://api.inngest.com/v1/apps?url=${APP_URL}/api/inngest" \
              -H "Authorization: Bearer ${INNGEST_SIGNING_KEY}")
            echo "$RESPONSE"
          else
            echo "INNGEST_SIGNING_KEY not provided, skipping automated sync."
          fi
