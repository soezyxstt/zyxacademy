<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0ad"/><stop offset=".24" stop-color="#d5a84f"/><stop offset=".48" stop-color="#80551e"/><stop offset=".7" stop-color="#f4d47b"/><stop offset="1" stop-color="#a36f2c"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9df"/><stop offset=".35" stop-color="#a8bec2"/><stop offset=".6" stop-color="#e7e7d5"/><stop offset="1" stop-color="#64828a"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#244d63"/><stop offset=".5" stop-color="#0a2136"/><stop offset="1" stop-color="#102d43"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9f1eb"/><stop offset=".35" stop-color="#2a9aa9"/><stop offset=".7" stop-color="#12617e"/><stop offset="1" stop-color="#092b4a"/>
    </linearGradient>
    <mask id="aperture"><rect width="100" height="100" fill="white"/><circle cx="50" cy="50" r="35.5" fill="black"/></mask>
  </defs>
  <g mask="url(#aperture)" stroke-linejoin="round" stroke-linecap="round">
    <!-- The layered circular setting leaves the portrait unobstructed. -->
    <circle cx="50" cy="50" r="40.7" fill="url(#gold)" stroke="#60451f" stroke-width="1.1"/>
    <circle cx="50" cy="50" r="39.1" fill="url(#enamel)" stroke="#f6dd98" stroke-width=".7"/>
    <circle cx="50" cy="50" r="37.1" fill="none" stroke="url(#platinum)" stroke-width="2.2"/>
    <circle cx="50" cy="50" r="35.9" fill="none" stroke="#795721" stroke-width=".6"/>
    <circle cx="50" cy="50" r="39.4" fill="none" stroke="#80a2aa" stroke-width=".45" stroke-dasharray="3.2 2.3"/>
    <!-- Swept, mirrored scrolls and inset engraving. -->
    <g id="scroll-left">
      <path d="M21 20C14 20 8 24 5 31c4-2 8-2 11-1-7 3-11 8-13 14 4-3 8-4 12-4-6 5-9 10-10 16 3-3 6-5 9-5-3 8-2 16 3 22 0-7 2-12 6-16l4-27z" fill="url(#gold)" stroke="#65451f" stroke-width="1"/>
      <path d="M20 23C14 24 10 27 8 30c5-1 9 0 12 2-7 1-11 4-14 9 5-2 9-2 13-1-6 4-9 8-11 12 4-2 7-2 10-2-3 6-3 12-1 16 1-6 4-10 7-13l3-21z" fill="url(#enamel)" stroke="#f3d482" stroke-width=".65"/>
      <path d="M10 29c4-1 8 0 11 2M8 40c4-2 9-2 13-1M8 51c4-2 8-2 11-1M17 63c1-6 3-9 6-12" fill="none" stroke="#a7c2c1" stroke-width=".7"/>
      <path d="M19 24c-3 3-3 7 0 9 2 1 5 0 5-2s-3-3-4-1M16 53c-3 4-2 8 0 10" fill="none" stroke="#f9e4a8" stroke-width="1"/>
      <path d="M18 69c-4 5-3 10 1 13 4 3 8 1 8-2 0-2-2-3-4-2 2 1 1 3-1 3-3-1-3-5 0-8l3-4" fill="url(#gold)" stroke="#76501e" stroke-width=".8"/>
      <path d="M19 74c-2 4 0 7 3 7" fill="none" stroke="#fff0b7" stroke-width=".7"/>
      <path d="M12 44l3-3 3 3-3 4z" fill="url(#gem)" stroke="#f8db8d" stroke-width=".7"/>
      <path d="M12.8 44h4.4M15 41.8v5.4" stroke="#b7eee2" stroke-width=".35"/>
    </g>
    <use href="#scroll-left" transform="translate(100 0) scale(-1 1)"/>
    <!-- Arched shoulders and the tall ceremonial jewel. -->
    <path d="M24 20C30 12 39 9 45 9l5-7 5 7c6 0 15 3 21 11l-3 3C66 16 59 14 50 14S34 16 27 23z" fill="url(#gold)" stroke="#67491f" stroke-width="1"/>
    <path d="M28 19c6-5 13-7 22-7s16 2 22 7" fill="none" stroke="#fff0b7" stroke-width="1"/>
    <path d="M31 20c5-3 10-4 14-4M69 20c-5-3-10-4-14-4" fill="none" stroke="#435f68" stroke-width="1"/>
    <path d="M43 10l3-5 4-3 4 3 3 5-3 6h-8z" fill="url(#platinum)" stroke="#745222" stroke-width=".8"/>
    <path d="M45 9l2-4 3-2 3 2 2 4-2 5h-6z" fill="url(#gem)" stroke="#fff0b4" stroke-width=".6"/>
    <path d="M50 3l-2 6 2 5 2-5z" fill="#81d6d4"/><path d="M45 9h10M47 5l5 4M53 5l-5 4" fill="none" stroke="#d5f4df" stroke-width=".45"/>
    <!-- Compass medallion and its engraved lower mount. -->
    <path d="M33 86c5 2 9 3 12 3l5-3 5 3c3 0 7-1 12-3-3 5-8 8-12 9l-5 4-5-4c-4-1-9-4-12-9z" fill="url(#gold)" stroke="#68471f" stroke-width=".9"/>
    <path d="M37 89c4 2 7 2 10 2M63 89c-4 2-7 2-10 2" fill="none" stroke="#fff0ba" stroke-width=".8"/>
    <circle cx="50" cy="91.5" r="5.5" fill="url(#platinum)" stroke="#6d4a20" stroke-width=".8"/>
    <circle cx="50" cy="91.5" r="4.2" fill="url(#enamel)" stroke="#e6c676" stroke-width=".5"/>
    <path d="M50 87.8l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#f4df9b"/>
    <path d="M50 88.5v6M47 91.5h6" stroke="#9dded9" stroke-width=".35"/>
    <path d="M28 78l2-2 2 2-2 2zM68 78l2-2 2 2-2 2z" fill="#b5e4dc" stroke="#dfbe70" stroke-width=".7"/>
  </g>
